  /schedules/parcels/{parcel}/cancel:
    post: { tags: [Schedules], summary: "The sender cancels a parcel before it is loaded.", parameters: [{ name: parcel, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /schedules/parcels/{parcel}/disputes:
