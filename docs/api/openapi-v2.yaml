  /business/procedure-requests/{subject}/deposit/waive:
    post: { tags: [HospitalProcedures], summary: "Hospital: accept the procedure without the deposit owed outside", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/procedure-requests/{subject}/deposit/give-back:
    post: { tags: [HospitalProcedures], summary: "Hospital: return a HELD wallet deposit", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /investigation-centers/{center}/times:
