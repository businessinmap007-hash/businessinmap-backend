  /owner-listings/{id}/images/{image}:
    delete: { tags: [Owner Listings], summary: "Remove one photo.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: image, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listings/{id}/report:
    post: { tags: [Owner Listings], summary: "Report a listing {reason?} — kept for older apps; it is `POST /reports` with type owner_listing and reason other.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listings/{id}/inquiries:
    post: { tags: [Owner Listings], summary: "A buyer opens (or returns to) his conversation about a listing — the chat is `/operation-chats/listing/{inquiry}` (phone numbers cannot be written there until the numbers are swapped).", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listing-inquiries:
    get: { tags: [Owner Listings], summary: "The conversations I am in, as buyer or as seller.", responses: { '200': { description: OK } } }
  /owner-listing-inquiries/{inquiry}:
    get: { tags: [Owner Listings], summary: "One conversation: its listing, the other person, the swap state and the fee quote (`reveal: {requested_by_me, requested_by_other, fee_total, my_share, payer}`), and `other_phone` — null until both said yes and the fee was paid.", parameters: [{ name: inquiry, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listing-inquiries/{inquiry}/reveal/request:
