    get: { tags: [Business Menu], summary: 'The menu as a sheet: columns, the items as rows (or two example rows with template=1), and what the Type/Unit columns may say', parameters: [{ name: template, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /business/menu/sheet.csv:
    get: { tags: [Business Menu], summary: 'The same sheet as a CSV file (UTF-8 with BOM so Excel shows Arabic); template=1 for an empty template', parameters: [{ name: template, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /business/menu/inspect:
    post: { tags: [Business Menu], summary: 'Before an import: a CSV file, or grid (an Excel file read on the phone, header row first), comes back as its numbered headers, a few sample rows and the suggested mapping (our column key -> the file column number), so each of our columns can be pointed at the right column of the merchant file', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/import:
    post: { tags: [Business Menu], summary: 'Import the sheet - a CSV file, grid (an Excel file read on the phone, header row first) or rows (already keyed by our columns). mapping (our column key -> the file column number, 1-based) points our columns at the file columns; without it the headers are recognised by name. dry_run (default true) previews: every row is run and rolled back; the report lists create/update/error per row', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/catalog-lookup:
    get: { tags: [Business Menu], summary: 'Search the catalog models the merchant can link an item to (q, line option)', responses: { '200': { description: OK } } }
  /business/menu/catalog-products:
    post: { tags: [Business Menu], summary: 'The model is not in the catalog: the merchant proposes one (pending review)', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/items/{item}/addons:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    put: { tags: [Business Menu], summary: "Switch the shop's per-item services on or off for one item - {group_ids: [..]}", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/items/{item}/addon-options:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    put: { tags: [Business Menu], summary: "Tick the shop's priced services (cooking method, preparation...) this item offers, one by one - {option_ids: [..]}; the item resource lists them as addon_services with enabled flags", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/items/{item}/cover:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    put: { tags: [Business Menu], summary: "Choose which of the item's photos the CARD shows - {image_id} (null = the first one). Customers and the merchant's own cards then draw it, uploaded photos before the catalog master's", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/items/{item}/images/{image}/crop:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }, { name: image, in: path, required: true, schema: { type: integer } }]
    put: { tags: [Business Menu], summary: 'Which part of a photo the card shows - {x, y, zoom}: the point kept in the middle (0..1) and how far in (1 = the whole photo, up to 4); so the empty part is not shown and the product is not cut off', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/items/{item}/payment-plans:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    put: { tags: [Business Menu], summary: "Replace an item's instalment plans - {plans: [{months, down, total_price}]}; refused for kinds that do not sell on instalments", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/addons:
    get: { tags: [Business Menu], summary: "The services this trade adds on top of an item (cooking method), with the shop's price for each", responses: { '200': { description: OK } } }
    put: { tags: [Business Menu], summary: "Price the shop's services once - {prices: {option_id: price}}; 0 = not offered. Every item carries them as a single-choice extra", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/available-types:
    get: { tags: [Business Menu], summary: Which menu item types this business's menu currently allows, responses: { '200': { description: OK } } }
    put: { tags: [Business Menu], summary: Set which menu item types this business's menu allows, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/menu/display-mode:
    get: { tags: [Business Menu], summary: Grid vs list display mode for this business's customer-facing menu, responses: { '200': { description: OK } } }
    put: { tags: [Business Menu], summary: Set grid vs list display mode, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /delivery/me:
    get: { tags: [Delivery], summary: The acting driver's own carrier profile/status, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /delivery/my-orders:
    get: { tags: [Delivery], summary: Orders this driver has accepted, including a delivered one until its fee is confirmed, responses: { '200': { description: OK } } }
  /notifications/archive-all:
    post: { tags: [Notifications], summary: Archive every one of the signed-in user's notifications, responses: { '200': { description: OK } } }

  # ─────────────────────── Business Offers ───────────────────────
  /business/promotions:
    get: { tags: [Business Offers], summary: "«العروض والخصومات»: my promotions, each with its targets, usage and whether it is running now. Open to every business (the `offers` capability for a delegate).", responses: { '200': { description: OK } } }
    post: { tags: [Business Offers], summary: "Write a promotion: `{title?, kind: percent|amount|n_for_price_of|spend_percent, params: {value} | {n, pay} | {min_total, value}, audience?: all|new_customers, starts_at?, ends_at?, max_uses?, targets: [{type: all|menu_section|menu_item|listing|listing_category|bookable_kind|bookable_item, id?}]}`. «عروض الحجز»: `bookable_kind` / `bookable_item` point at a kind of room or one room; the offer (percent, amount, or `n_for_price_of` read as nights — «ادفع ليلتين وأقم ثلاثًا») comes off the nights at the room's own price in the booking preview and the booking (`price_breakdown.offer_discount_amount`), does not stack with the unit's stay-length discount (the larger applies), and may be limited to a season with `params.stay_from` / `params.stay_to`. `spend_percent` is refused on a booking target. A discount that REACHES THE PRICE: the cart prices each line by the best running rule that fits it (never two stacked), on the item's own price (extras are not discounted), and the fee/tax follow the discounted price. `n_for_price_of` is «اشترِ pay واحصل على n»: the customer pays the dearest `pay` of every group of `n` pieces and takes the rest free (pay=2, n=6 → «اشترِ ٢ واحصل على ٦»; pay=1, n=3 → «٣ بسعر الأغلى»). Optional `params.same_item` (a group is pieces of ONE item) and `params.max_groups` (a cap on groups per order); a group repeats while the cart holds whole groups. Needs an end: `ends_at` or `max_uses`. Targets must be the business's own; an `amount` may not reach the cheapest covered item's price. The answer lists `not_yet_discounted` items (with `eligible_from`) whose price rose by more than 5% within the last 15 days — the «no fake discount» rule, both numbers config (`bim.promotions`) and returned as `rules` by the list.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/promotions/catalog:
    get: { tags: [Business Offers], summary: "My products by section to pick from: `menu` (sections of menu items) `shop` (retail listings by product category) and `booking` (rooms by kind, with the night's price); each group has `type`/`id` (null for «بدون قسم») and its `items` with price.", responses: { '200': { description: OK } } }
  /business/promotions/{promotion}:
    put: { tags: [Business Offers], summary: "Replace a promotion's rule, targets and dates (same body as create).", parameters: [{ name: promotion, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Business Offers], summary: "Delete a promotion. Orders already priced by it keep their discount.", parameters: [{ name: promotion, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/promotions/{promotion}/toggle:
    post: { tags: [Business Offers], summary: "Pause or resume a promotion.", parameters: [{ name: promotion, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /businesses/{business}/promotions:
    get: { tags: [Business Offers], summary: "The promotions running now on a business, for its page's offers tab (a first-order offer is hidden from a returning customer): each with its targets, remaining uses and up to 12 covered items with `price_after` where the rule can say it. The business page's `sections.offers` says whether the tab shows.", parameters: [{ name: business, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  # ─────────────────────── Partnerships ───────────────────────
  /business/partnerships:
    get: { tags: [Partnerships], summary: "«الشراكات والحصص»: the partnerships I am a party to, as owner or as partner (`role`), each with the other side, the state and `awaiting_my_answer`. A contract between two businesses of any trade; ONLY the two parties can read it — everyone else gets 404, never 403.", responses: { '200': { description: OK } } }
    post: { tags: [Partnerships], summary: "The owner invites another business: `{partner_business_id, type?: agency|reseller|supplier|corporate|hotel_allotment, terms?: {note}}`. The invitation waits for the other side; nobody else sees it.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/partnerships/lookup:
    get: { tags: [Partnerships], summary: "Businesses to invite, by name (`q`, 2+ letters).", parameters: [{ name: q, in: query, schema: { type: string } }], responses: { '200': { description: OK } } }
  /business/partnerships/release-requests:
    get: { tags: [Partnerships], summary: "Partner only: the open requests to give back a room it was promised and has not sold — the room and the dates, never who asked.", responses: { '200': { description: OK } } }
  /business/partnerships/release-requests/{id}/{answer}:
    post: { tags: [Partnerships], summary: "Partner only: `approve` gives the room back to the hotel (the allocation's `quantity_released` grows by the quantity; the asking guest is held the room) or `decline` (the guest is told). 404 for a business that was not asked.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: answer, in: path, required: true, schema: { type: string, enum: [approve, decline] } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/partnerships/{partnership}:
    get: { tags: [Partnerships], summary: "One partnership with its allocations (room card, contract price, quantities, the partner's markup and final price). 404 for anyone who is not one of the two parties.", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/partnerships/{partnership}/{answer}:
    post: { tags: [Partnerships], summary: "The invited business accepts or declines (`answer` = accept|decline). The owner cannot answer its own invitation.", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }, { name: answer, in: path, required: true, schema: { type: string, enum: [accept, decline] } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/partnerships/{partnership}/{action}:
    post: { tags: [Partnerships], summary: "Either party pauses, resumes or ends the partnership (`action` = pause|resume|end). Pausing or ending stops the allocations given inside it.", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }, { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, end] } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/partnerships/{partnership}/available-rooms:
    get: { tags: [Partnerships], summary: "Owner only: its own rooms as cards (kind, photos, features) with `capacity_total` and `ungranted`, to pick from when granting.", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/partnerships/{partnership}/allocations:
    post: { tags: [Partnerships], summary: "Owner only: grant the partner ROOMS PER NIGHT of one of its rooms at a contract price (`quantity_total` is how many it may have on any one night, the way hotel allotments are written; a room sold for two nights is free again on the third; `starts_at`/`ends_at` are the dates of the STAY it covers, and what was already sold stands when it ends or is stopped — both sides are told, and `upcoming_bookings`/`pending_bookings` on the allocation say how many): `{bookable_item_id, quantity_total, contract_price, allocation_type?, starts_at?, ends_at?, min_nights?, max_nights?, release_days_before?}`. The partnership must be active; the total granted of a room cannot exceed what the room has.", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/partnerships/{partnership}/allocations/{allocation}:
    put: { tags: [Partnerships], summary: "Owner only: change a grant's quantity (never below what is sold or held), contract price, dates, nights or release days.", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }, { name: allocation, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/partnerships/{partnership}/allocations/{allocation}/{action}:
    post: { tags: [Partnerships], summary: "Owner only: stop or re-activate a grant (`action` = stop|activate).", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }, { name: allocation, in: path, required: true, schema: { type: integer } }, { name: action, in: path, required: true, schema: { type: string, enum: [stop, activate] } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/partnerships/{partnership}/allocations/{allocation}/pricing:
    put: { tags: [Partnerships], summary: "Partner only: price what it was given — `{markup_type: none|fixed|percent, markup_value}` on top of the contract price, never below it. The customer sees only the final price on the partner's page and in hotel-room search.", parameters: [{ name: partnership, in: path, required: true, schema: { type: integer } }, { name: allocation, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  # ─────────────────────── Trip Programs ───────────────────────
  /business/trip-programs:
    get: { tags: [Trip Programs], summary: "«برنامج الرحلة»: my programmes (title, summary, status draft|published, days count). A tour company writes a trip as days and items.", responses: { '200': { description: OK } } }
    post: { tags: [Trip Programs], summary: "Start a programme `{title, summary?}` (a draft). Returns the programme with its days.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/room-cards:
    get: { tags: [Trip Programs], summary: "The rooms a hotel gave this company (active allocations in an active partnership) as cards — photos, what the room carries, the company's own price, the hotel they come from. Never the contract price or quantities.", responses: { '200': { description: OK } } }
  /business/trip-programs/{program}:
    get: { tags: [Trip Programs], summary: "One of my programmes with its days and items (a room item carries `allocation_id` and `room_available`).", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    put: { tags: [Trip Programs], summary: "Change the title or summary.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Trip Programs], summary: "Delete the programme with its days, items and photos.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/{action}:
    post: { tags: [Trip Programs], summary: "Publish (needs at least one item) or unpublish (`action` = publish|unpublish). A published programme is readable on the company's page.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: action, in: path, required: true, schema: { type: string, enum: [publish, unpublish] } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/days:
    post: { tags: [Trip Programs], summary: "Add a day `{title?}` at the end (up to 31).", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/days/{day}:
    put: { tags: [Trip Programs], summary: "Rename a day.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: day, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Trip Programs], summary: "Remove a day with its items.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: day, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/days/{day}/move:
    post: { tags: [Trip Programs], summary: "Move a day `{direction: up|down}`.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: day, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/days/{day}/items:
    post: { tags: [Trip Programs], summary: "Add an item `{kind: text|room|image, body?, allocation_id?}` (up to 30 a day). A text item needs words; a room item needs `allocation_id` of a room this company was given; an image item gets its photo from the `image` call. Returns `item_id` and the programme.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: day, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/items/{item}:
    put: { tags: [Trip Programs], summary: "Change an item's words `{body}`.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Trip Programs], summary: "Remove an item.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/items/{item}/move:
    post: { tags: [Trip Programs], summary: "Move an item inside its day `{direction: up|down}`.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/trip-programs/{program}/items/{item}/image:
    post: { tags: [Trip Programs], summary: "Set the photo of an image item (multipart `image`); a new one replaces the old.", parameters: [{ name: program, in: path, required: true, schema: { type: integer } }, { name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /businesses/{business}/trip-programs:
    get: { tags: [Trip Programs], summary: "The programmes a business published (title, summary, days count) — its page's «البرامج» tab. The page's `sections.programs` says whether the tab shows.", parameters: [{ name: business, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /businesses/{business}/trip-programs/{program}:
    get: { tags: [Trip Programs], summary: "A published programme: days → items. A room item carries the room card (photos, features), the company's price, the hotel it comes from, `bookable_id`/`service_id`/`item_type` to book it through this company, and `room_available` (false once the hotel stops the allocation; the item keeps its words). A draft is 404.", parameters: [{ name: business, in: path, required: true, schema: { type: integer } }, { name: program, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /delivery/register:
    post: { tags: [Delivery], summary: 'Register as a delivery driver (Shipping & Delivery business accounts only)', responses: { '201': { description: Registered }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /delivery/delivery-fee:
    patch:
      tags: [Delivery]
      summary: A freelance driver sets their own flat delivery fee (null clears it)
      description: Used only as a fallback on acceptOrder() when the business itself never set a fee - the business's own configured rate always wins.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { delivery_fee_amount: { type: number, nullable: true } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }
  /delivery/availability:
    post:
      tags: [Delivery]
      summary: Toggle driver availability
      requestBody: { content: { application/json: { schema: { type: object, properties: { active: { type: boolean } } } } } }
      responses: { '200': { description: OK } }
  /delivery/location:
    post:
      tags: [Delivery]
      summary: Driver pings their live position (every 30-60s while carrying an active order)
      requestBody: { content: { application/json: { schema: { type: object, required: [lat, lng], properties: { lat: { type: number }, lng: { type: number } } } } } }
      responses: { '200': { description: OK } }
  /delivery/orders/{order}/confirm-payment:
    post:
      tags: [Delivery]
      summary: Assigned driver confirms they collected the delivery fee in cash
      description: >-
        Their own leg only — see /business/orders/{order}/confirm-payment for
        the order-amount leg the merchant confirms. Refused (409) before the
        order actually reaches the delivered stage.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /delivery/orders/{order}/fee-proposal:
    post:
      tags: [Delivery]
      summary: The assigned courier prices an out-of-city order (or revises the price)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount], properties: { amount: { type: number } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /delivery/available-orders:
    get: { tags: [Delivery], summary: Delivery orders open to take (preparing/ready, unassigned), responses: { '200': { description: OK } } }
  /delivery/orders/{order}/accept:
    post: { tags: [Delivery], summary: Take a delivery order, parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } } }
  /delivery/orders/{order}/pickup-token:
    post: { tags: [Delivery], summary: Restaurant issues the pickup QR token (stage 1), parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /delivery/pickup/{token}/confirm:
    post: { tags: [Delivery], summary: Driver scans pickup token → picked_up, parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /delivery/orders/{order}/delivery-token:
    post: { tags: [Delivery], summary: Driver issues the delivery QR token (stage 2), parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /delivery/deliver/{token}/confirm:
    post: { tags: [Delivery], summary: Customer scans delivery token → completed, parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /delivery/orders/{order}/eta:
    post: { tags: [Delivery], summary: 'Assigned driver tells the customer an ETA - exactly one of eta_minutes or eta_at.', parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }

  # Same driver pool, same loop, mirrored for prescription delivery.
  /delivery/available-prescriptions:
    get: { tags: [Delivery], summary: Delivery prescriptions open to take (ready, unassigned), responses: { '200': { description: OK } } }
  /delivery/prescriptions/{prescription}/accept:
    post: { tags: [Delivery], summary: Take a delivery prescription, parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } } }
  /delivery/prescriptions/{prescription}/pickup-token:
    post: { tags: [Delivery], summary: Pharmacy issues the pickup QR token (stage 1), parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /delivery/prescriptions/pickup/{token}/confirm:
    post: { tags: [Delivery], summary: Driver scans pickup token → picked_up, parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /delivery/prescriptions/{prescription}/delivery-token:
    post: { tags: [Delivery], summary: Driver issues the delivery QR token (stage 2), parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /delivery/prescriptions/deliver/{token}/confirm:
    post: { tags: [Delivery], summary: Patient scans delivery token → dispensed, parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }

  # ─────────────────────────── Tables ───────────────────────────
  /table/{token}/scan:
    post:
      tags: [Tables]
      summary: Scan a table's permanent QR to open/join its dine-in cart
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /table/{token}/call:
    post:
      tags: [Tables]
      summary: Call staff / ask for the bill from a dine-in table
      description: "Idempotent per (table, type): a live pending call of the same type is reused. The token is physical proof of presence at the table."
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [waiter, bill, assistance], default: waiter }
                note: { type: string, maxLength: 300, nullable: true }
      responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/table-calls:
    get:
      tags: [Tables]
      summary: The business's pending dine-in table calls (newest first)
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /business/table-calls/{call}/resolve:
    post:
      tags: [Tables]
      summary: Mark a table call handled
      parameters: [{ name: call, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }

  # ─────────────────────────── Business page ───────────────────────────
  /businesses/{business}:
    get:
      tags: [Business Page]
      summary: The public business page aggregate (profile + rating + section flags)
      description: What a search result opens — profile header (including address, country, governorate/city, category + sub-category names, and its options list), rating summary, open-now, which tabs exist (posts/menu/services), and which fulfillment methods (delivery/pickup/dine_in) the unified entry point above the menu should offer. The heavy lists stay on their own endpoints. For a doctor's own clinic account with an accepted-linked sister clinic, `linked_schedule` carries the whole group's days/hours; null otherwise.
      parameters: [{ name: business, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /businesses/{business}/posts:
    get:
      tags: [Business Page]
      summary: A business's own posts wall (its live posts, to anyone)
      description: Unlike the audience-scoped personal feed, a business's page shows its active, unexpired posts to any viewer. Reactions personalise for a bearer.
      parameters:
        - { name: business, in: path, required: true, schema: { type: integer } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /businesses/{business}/albums:
    get: { tags: [Business Page], summary: "A business's photo albums, public read-only", parameters: [{ name: business, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /businesses/{business}/albums/{album}:
    get:
      tags: [Business Page]
      summary: One of a business's albums with its photos, public
      parameters:
        - { name: business, in: path, required: true, schema: { type: integer } }
        - { name: album, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }

  # ─────────────────────────── Operator presence ───────────────────────────
  /operator/session:
    get:
      tags: [Operator Presence]
      summary: The caller's current operator session (online state)
      parameters: [{ name: service_type, in: query, required: false, schema: { type: string } }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /operator/session/start:
    post:
      tags: [Operator Presence]
      summary: Mark the business online while watching a service screen
      description: Opens the realtime delivery gate; the session self-expires and must be kept alive by heartbeat.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service_type: { type: string, nullable: true }
                screen: { type: string, nullable: true }
                expected_minutes: { type: integer, minimum: 1, maximum: 120 }
      responses: { '201': { description: Created }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /operator/session/heartbeat:
    post:
      tags: [Operator Presence]
      summary: Keep the operator session alive (extends expiry)
      responses: { '200': { description: OK }, '409': { description: No live session to renew } }
  /operator/session/end:
    post:
      tags: [Operator Presence]
      summary: Go offline (close the operator session)
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /operator/realtime/poll:
    get:
      tags: [Operator Presence]
      summary: Live delta feed of notifications since a cursor (poll transport)
      description: |
        The realtime channel for an online operator. Pass the last `cursor` you
        saw; get newer notifications + the next cursor. Polling also heartbeats
        the session. While an operator is online, the dispatcher suppresses the
        redundant Firebase push and delivers via this feed instead.
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: service_type, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }

  # ─────────────────────────── Ratings ───────────────────────────
  /ratings/me:
    get: { tags: [Ratings], summary: My operation rating (percentages + stars) + my rating/fee opt-in state, responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /ratings/enable:
    post: { tags: [Ratings], summary: Open my own rating (per-party opt-in; makes only me liable for service fees — transacting is free), responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /ratings/disable:
    post: { tags: [Ratings], summary: Close my own rating again (self-service reversal of /ratings/enable), responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /ratings/user/{user}:
    get: { tags: [Ratings], summary: Another user's operation rating, parameters: [{ name: user, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /ratings/user/{user}/reviews:
    get: { tags: [Ratings], summary: A user's star reviews, parameters: [{ name: user, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /ratings/review:
    post:
      tags: [Ratings]
      summary: Leave a star review
      description: Only allowed after a real completed operation between the two parties, and once per operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_type, operation_id, stars]
              properties:
                operation_type: { type: string, enum: [booking, order] }
                operation_id: { type: integer, minimum: 1 }
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'No completed operation between the parties, or already reviewed.' }
        '422': { $ref: '#/components/responses/Validation' }

  # ────────────────────────── Schedules ──────────────────────────
  /search/schedules:
    get:
      tags: [Schedules]
      summary: Find carriers on a route + day, ranked by trust (public)
      security: []
      description: |
        Anchor the route with a governorate pair (domestic) **or** a country
        pair (international) — one of the two is required on each end. Give
        `date` or `day_of_week` to pin the day; omit both to list the whole
        route. Results are ranked guaranteed → success rate → coverage → low
        dispute → stars, and each carries `remaining_capacity`.

        A leg matches a day when it is weekly on that weekday, one-off dated to
        it, or on-demand (always available).
      parameters:
        - { name: origin_governorate_id, in: query, schema: { type: integer }, description: Required unless origin_country_id is given. }
        - { name: destination_governorate_id, in: query, schema: { type: integer }, description: Required unless destination_country_id is given. }
        - { name: origin_country_id, in: query, schema: { type: integer } }
        - { name: destination_country_id, in: query, schema: { type: integer } }
        - { name: origin_city_id, in: query, schema: { type: integer }, description: Pins the exact city inside the governorate anchor. }
        - { name: destination_city_id, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date }, description: The weekday is derived from this. }
        - { name: day_of_week, in: query, schema: { type: integer, minimum: 0, maximum: 6 }, description: 0=Sunday .. 6=Saturday. }
        - { name: mode, in: query, schema: { type: string, enum: [freight, passenger, limousine, distribution] } }
        - { name: scope, in: query, schema: { type: string, enum: [domestic, international] } }
        - { name: vehicle_type_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/TripScheduleSearchResult' } }
                      count: { type: integer }
        '422': { $ref: '#/components/responses/Validation' }
  /schedules/vehicle-types:
    get:
      tags: [Schedules]
      summary: The vehicle/cargo classes for the scheduling service (public)
      security: []
      description: The picker for the carrier's publish form and the customer's filter.
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [freight, passenger, limousine, distribution] } }
        - { name: group, in: query, schema: { type: string, example: mode_freight }, description: Filter by the class's mode branch key. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      vehicle_types: { type: array, items: { $ref: '#/components/schemas/VehicleType' } }
  /schedules/countries:
    get:
      tags: [Schedules]
      summary: Country picker for international legs (public)
      security: []
      description: |
        International legs only — a domestic leg picks a governorate instead.
        Mirrors ISO 3166-1's officially assigned codes.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Filters on Arabic/English name or ISO code. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      countries:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name_ar: { type: string }
                            name_en: { type: string }
                            iso2: { type: string }
                            flag: { type: string, description: 'Emoji, derived from the ISO2 code.' }
  /schedules/{schedule}/reserve:
    post:
      tags: [Schedules]
      summary: Reserve capacity on a leg
      description: |
        Capacity is checked under a row lock, so concurrent reservations can
        never oversell a leg. If the leg sets `deposit_per_unit`, that much ×
        `units` is held from the caller's wallet inside the same transaction —
        short funds roll the whole reserve back (422, no capacity taken). The
        deposit is released on complete or cancel. You cannot reserve your own leg.
      parameters: [{ name: schedule, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                units: { type: integer, minimum: 1, default: 1 }
                notes: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Created — pending the carrier's confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      reservation: { $ref: '#/components/schemas/TripReservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Leg not bookable, capacity short, or wallet short of the deposit., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /schedules/my-reservations:
    get:
      tags: [Schedules]
      summary: My reservations
      parameters: [{ $ref: '#/components/parameters/PerPage' }]
      responses:
        '200': { description: 'Paginated TripReservation.', content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /schedules/reservations/{reservation}/cancel:
    post:
      tags: [Schedules]
      summary: Cancel my reservation
      description: |
        Releases the capacity and returns any held deposit. A cancel only marks
        reputation once the carrier had confirmed (a real dealing); a
        never-confirmed pending request cancels with no rating hit.
      parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Not cancellable in its current state., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  # ────────────────────── Schedules (Carrier) ──────────────────────
  /business/schedules:
    get:
      tags: [Schedules (Carrier)]
      summary: My published legs
      parameters: [{ $ref: '#/components/parameters/PerPage' }]
      responses:
        '200': { description: 'Paginated TripSchedule.', content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Schedules (Carrier)]
      summary: Publish a leg
      description: |
        `scope` decides the geography: domestic requires the governorate pair,
        international the country pair. Origin must differ from destination on
        whichever axis anchors the leg. `day_of_week` is required for a weekly
        leg, `trip_date` for a one-off. A `vehicle_type_id` must belong to the
        scheduling service, and a `parent_trip_id` must be a leg you own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, schedule_pattern]
              properties:
                mode: { type: string, enum: [freight, passenger, limousine, distribution] }
                scope: { type: string, enum: [domestic, international], default: domestic }
                vehicle_type_id: { type: integer, nullable: true }
                vehicle_label: { type: string, maxLength: 120, nullable: true }
                origin_governorate_id: { type: integer, nullable: true, description: Required when scope=domestic. }
                destination_governorate_id: { type: integer, nullable: true, description: Required when scope=domestic. }
                origin_city_id: { type: integer, nullable: true }
                destination_city_id: { type: integer, nullable: true }
                origin_country_id: { type: integer, nullable: true, description: Required when scope=international. }
                destination_country_id: { type: integer, nullable: true, description: Required when scope=international. }
                schedule_pattern: { type: string, enum: [weekly, one_off, on_demand] }
                day_of_week: { type: integer, minimum: 0, maximum: 6, nullable: true, description: Required when schedule_pattern=weekly. 0=Sunday. }
                trip_date: { type: string, format: date, nullable: true, description: Required when schedule_pattern=one_off. }
                departure_time: { type: string, example: '09:00', nullable: true }
                return_time: { type: string, nullable: true }
                capacity: { type: integer, minimum: 0, nullable: true, description: Omit for unlimited. }
                capacity_unit: { type: string, maxLength: 24, nullable: true }
                price: { type: number, minimum: 0, nullable: true }
                deposit_per_unit: { type: number, minimum: 0, nullable: true }
                currency: { type: string, maxLength: 10, default: EGP }
                is_return_leg: { type: boolean, default: false }
                parent_trip_id: { type: integer, nullable: true }
                notes: { type: string, maxLength: 2000, nullable: true }
                status: { type: string, enum: [active, paused, expired, cancelled], default: active }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      schedule: { $ref: '#/components/schemas/TripSchedule' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /business/schedules/business-lookup:
    get:
      tags: [Schedules (Carrier)]
      summary: Search other businesses, for picking a backhaul partner
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Name filter; omit to list.' }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
  /business/schedules/{schedule}:
    parameters: [{ name: schedule, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Schedules (Carrier)]
      summary: Update a leg I own
      requestBody: { content: { application/json: { schema: { type: object, description: Same body as publish. } } } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    patch:
      tags: [Schedules (Carrier)]
      summary: Update a leg I own
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Schedules (Carrier)]
      summary: Delete a leg I own
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/schedules/{schedule}/block:
    post:
      tags: [Schedules (Carrier)]
      summary: Block capacity for seats sold off the app
      description: |
        A direct deal outside BIM still consumes the vehicle, so the carrier
        blocks those units here and `remaining_capacity` stays honest (a 14-seat
        microbus with 7 sold directly shows 7 left). The hold takes capacity
        like a real reservation but has no in-app client and never touches the
        rating ledger or a wallet. Release it via the reject endpoint.
      parameters: [{ name: schedule, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units: { type: integer, minimum: 1 }
                notes: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Created — a reservation with status=blocked, source=offline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      reservation: { $ref: '#/components/schemas/TripReservation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Capacity short., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /business/schedules/reservations:
    get:
      tags: [Schedules (Carrier)]
      summary: Reservations on my legs
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, completed, cancelled, blocked] } }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: 'Paginated TripReservation.', content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /business/schedules/reservations/{reservation}/confirm:
    post:
      tags: [Schedules (Carrier)]
      summary: Accept a pending reservation
      parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Not pending., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /business/schedules/reservations/{reservation}/complete:
    post:
      tags: [Schedules (Carrier)]
      summary: Complete a confirmed reservation
      description: |
        Records a success for **both** parties in the universal operation
        rating (this is how a carrier's or limousine captain's reputation is
        built from real trips) and releases any held deposit back to the client.
        Only a confirmed reservation can be completed.
      parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Not confirmed., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /business/schedules/reservations/{reservation}/reject:
    post:
      tags: [Schedules (Carrier)]
      summary: Reject a reservation, or release an offline hold
      description: Frees the capacity. Also the way to release a `blocked` offline hold.
      parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Not cancellable in its current state., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /business/schedules/{schedule}/runs:
    post:
      tags: [Schedules (Carrier)]
      summary: Start a live run of a leg
      description: |
        Snapshots the leg's published stops into the run (the first becomes
        `heading`, the rest `pending`) — the leg must have at least one stop.
        Passenger/limousine legs require `passenger_count`; freight/
        distribution legs require a non-empty `manifest` instead — each is
        forbidden for the other mode.
      parameters: [{ name: schedule, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                passenger_count: { type: integer, minimum: 1 }
                manifest:
                  type: array
                  items:
                    type: object
                    required: [label, assigned_qty]
                    properties:
                      label: { type: string, maxLength: 150 }
                      unit: { type: string, maxLength: 24 }
                      assigned_qty: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { run: { $ref: '#/components/schemas/TripRun' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Missing stops, or a passenger_count/manifest mismatch for the leg's mode., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /business/schedules/runs:
    get:
      tags: [Schedules (Carrier)]
      summary: My legs' live and past runs
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [in_progress, awaiting_reconciliation, completed] } }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: 'Paginated TripRun.', content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
  /business/schedules/runs/{run}:
    get:
      tags: [Schedules (Carrier)]
      summary: One run's live detail
      parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { run: { $ref: '#/components/schemas/TripRun' } } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/schedules/runs/{run}/arrive:
    post:
      tags: [Schedules (Carrier)]
      summary: Mark the current stop arrived
      parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { run: { $ref: '#/components/schemas/TripRun' } } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: No stop is currently `heading`., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /business/schedules/runs/{run}/advance:
    post:
      tags: [Schedules (Carrier)]
      summary: Complete the current stop and move to the next
      description: |
        On the last stop: a freight/distribution run moves to
        `awaiting_reconciliation` instead of completing outright; any other
        mode completes immediately.
      parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { run: { $ref: '#/components/schemas/TripRun' } } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The current stop has not been marked arrived yet., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /business/schedules/runs/{run}/reconcile:
    post:
      tags: [Schedules (Carrier)]
      summary: Report delivered/returned per manifest line and complete the run
      description: Freight/distribution only, and only once the run is `awaiting_reconciliation`. `remaining_qty` is computed, never entered directly.
      parameters: [{ name: run, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [manifest_item_id, delivered_qty, returned_qty]
                    properties:
                      manifest_item_id: { type: integer }
                      delivered_qty: { type: integer, minimum: 0 }
                      returned_qty: { type: integer, minimum: 0 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, message: { type: string }, data: { type: object, properties: { run: { $ref: '#/components/schemas/TripRun' } } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Not awaiting reconciliation, an unknown manifest line, or delivered+returned exceeding what was assigned., content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }

  # ─────────────────────────── Bookings ───────────────────────────
  /business/bookings:
    get: { tags: [Bookings], summary: "The business's incoming-booking queue - owner or a delegated staff member with the bookings capability (mirrors /business/orders).", parameters: [{ name: status, in: query, schema: { type: string } }, { $ref: '#/components/parameters/PerPage' }], responses: { '200': { description: OK } } }
  /bookings:
    get: { tags: [Bookings], summary: My bookings, responses: { '200': { description: OK } } }
    post: { tags: [Bookings], summary: 'Create a booking. offering_id + offering_type say what the booking is about — a price row (service_price, the default) names «كشف عظام» rather than «كشف» and decides the amount; a listing (menu_item) is what a showroom or estate agent is booked ON and never sets the price, since a flat''s asking price is not what a viewing costs. Optional `provider_id` (one of `GET /businesses/{id}/providers`) is the person the customer chose: the booking is assigned to him at once (he is told) and he can hold only one customer at a time — 422 `provider_id` when he is not a provider there or is booked at that time. Without it the business decides.', responses: { '201': { description: Created }, '422': { description: 'The offering does not belong to this business, or is switched off.' } } }
  /bookings/holds:
    post: { tags: [Bookings], summary: "«تحت التعامل»: hold a room for the signed-in guest while they fill the booking in — `{business_id, bookable_id, starts_at, ends_at, quantity?}`. The business is the one the booking is made at (the hotel, or a company that was given the room). Answers `{hold: {id, expires_at, seconds_left}}` (10 minutes by default, `bim.booking_holds.minutes`); asking again for the same room moves the guest's hold. While it runs every other party's availability counts the room as taken and says `held_by_other` («تحت التعامل من طرف آخر»); the guest's own answers do not. 422 on `bookable_id` when the room is not free for them. Making the booking turns the hold into the booking; a hold nobody finishes simply expires.", responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/release-requests:
    post: { tags: [Bookings], summary: "«طلب تحرير غرفة»: a room the hotel promised to a partner (a guaranteed allocation) is not for sale to anyone else; a guest who wants it asks for it back — `{bookable_id, starts_at, ends_at, quantity?}`. Only allowed when the partner's promise is the ONLY thing in the way (the availability code is `held_for_partner`; the hold call answers 409 with `can_request_release`). Every partner holding unsold rooms of that type is told; one request per guest and room is open at a time (30 minutes by default). 422 when the room is free, taken for another reason, or no partner can release it.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/release-requests/{id}:
    get: { tags: [Bookings], summary: "The guest's own request and its status (`pending` / `approved` / `declined` / `expired`). Approved means the room went back to the hotel and is HELD for the guest for the usual hold time: carry on with the booking.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /bookings/holds/{hold}:
    delete: { tags: [Bookings], summary: "The guest left the booking screen: release their hold.", parameters: [{ name: hold, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/form/{business}:
    get: { tags: [Bookings], summary: 'The booking screen for ONE business: which fields to show, which are required, and its bookable units. The app knows nothing about hotels or playstations — it draws what this returns, which is why a new trade needs no app release. `shape` is null when the business''s category carries no booking pattern.', parameters: [{ name: business, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'No such business.' } } }
  /bookings/preview:
    post:
      tags: [Bookings]
      summary: Live running total for a booking-in-progress — same price math as store(), no row created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id, service_id]
              properties:
                business_id: { type: integer, minimum: 1 }
                service_id: { type: integer, minimum: 1 }
                bookable_id: { type: integer, minimum: 1, nullable: true }
                offering_id: { type: integer, minimum: 1, nullable: true }
                offering_type: { type: string, enum: [service_price, menu_item], nullable: true }
                starts_at: { type: string, format: date-time, nullable: true }
                ends_at: { type: string, format: date-time, nullable: true }
                quantity: { type: integer, minimum: 1, nullable: true }
                party_size: { type: integer, minimum: 1, nullable: true }
                option_ids: { type: array, items: { type: integer }, nullable: true }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{booking}:
    get: { tags: [Bookings], summary: Booking detail, parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/stay-requests:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Bookings], summary: "A hotel guest's two buttons: the issue categories, the hotel's services, and this stay's requests (can_request is true only while the stay runs)", responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { tags: [Bookings], summary: "Report a problem with the room ({kind: issue, category, note}) or order something ({kind: service, title, note}) - reaches the hotel with the room number", responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/{booking}/stay-requests/{stayRequest}/cancel:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }, { name: stayRequest, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Bookings], summary: 'Withdraw a request the hotel has not started', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/{booking}/financial-preview:
    get: { tags: [Bookings], summary: Fee/deposit preview (the caller's own side only), description: 'Returns only the calling party''s money - deposit, fee lines, own wallet balance and readiness - plus a single counterpart_ready flag. The counterparty''s wallet and guarantee checks are never included.', parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/accept:
    post: { tags: [Bookings], summary: Business accepts, parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/reject:
    post: { tags: [Bookings], summary: Business rejects, parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/cancel:
    post: { tags: [Bookings], summary: Cancel, parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/client-confirm:
    post:
      tags: [Bookings]
      summary: Client confirms
      description: 'The wallet PIN (`pin`) is required only when this booking will actually need a wallet-held deposit — confirming is the client''s own commitment to that hold, taken before the business''s own start() actually freezes it.'
      parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { pin: { type: string, description: 'Required when the booking''s financial preview shows a non-zero deposit.client_wallet_required.' } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{booking}/business-confirm:
    post: { tags: [Bookings], summary: Business confirms, parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/start:
    post: { tags: [Bookings], summary: Start execution, parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/complete:
    post: { tags: [Bookings], summary: Complete, parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /bookings/{booking}/deposit/agree-release:
    post:
      tags: [Bookings]
      summary: Agree the deposit should be released
      description: 'Self-service: either party (client or business) marks their own side as agreeing the deal succeeded. Once both sides agree, the deposit releases automatically — no admin action needed. Withdraws that same party''s refund agreement, if any. Refused (422) if the deposit is not frozen, or a live dispute exists on it.'
      parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '403': { description: Not a party to this booking }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/pending-settlements:
    get:
      tags: [Bookings]
      summary: My bookings still awaiting my own deposit settlement decision
      description: 'In-progress/completed bookings with a frozen deposit where THIS account has not yet agreed release or refund, and no live dispute already covers it. Drives the mandatory settlement prompt shown on app open/resume.'
      responses:
        '200': { description: OK }
  /bookings/{booking}/deposit/agree-refund:
    post:
      tags: [Bookings]
      summary: Agree the deposit should be refunded
      description: 'Same as agree-release, for the opposite outcome — both parties agreeing the deal did not go through, so the deposit refunds to the client automatically once both sides agree.'
      parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '403': { description: Not a party to this booking }
        '422': { $ref: '#/components/responses/Validation' }

  # ─────────────────── Operation Guarantors ───────────────────
  /bookings/{booking}/guarantors:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Operation Guarantors], summary: List a booking's friend guarantors, responses: { '200': { description: OK } } }
    post: { tags: [Operation Guarantors], summary: Invite a friend to co-guarantee, responses: { '201': { description: Created } } }
  /guarantors/{guarantor}/accept:
    post: { tags: [Operation Guarantors], summary: Accept a co-guarantee invite, parameters: [{ name: guarantor, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /guarantors/{guarantor}/decline:
    post: { tags: [Operation Guarantors], summary: Decline a co-guarantee invite, parameters: [{ name: guarantor, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }

  # ─────────────────────────── Guarantees ───────────────────────────
  /guarantees/levels:
    get: { tags: [Guarantees], summary: Available guarantee levels, responses: { '200': { description: OK } } }
  /guarantees/me:
    get: { tags: [Guarantees], summary: My guarantee state, responses: { '200': { description: OK } } }
  /guarantees/transactions:
    get: { tags: [Guarantees], summary: My guarantee ledger, responses: { '200': { description: OK } } }
  /guarantees/activate:
    post:
      tags: [Guarantees]
      summary: Subscribe/activate a guarantee level (forces fee + rating consent). PIN-gated — it spends from the wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pin], properties: { level_id: { type: integer }, target_type: { type: string, enum: [client, business] }, pin: { type: string } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /guarantees/unlock:
    post:
      tags: [Guarantees]
      summary: Unlock the guarantee back to balance. PIN-gated — it drops the guarantee's coverage for good.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pin], properties: { target_type: { type: string, enum: [client, business] }, pin: { type: string } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /guarantees/check-operation:
    post:
      tags: [Guarantees]
      summary: Check whether the guarantee covers an operation amount
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount, operation_type], properties: { amount: { type: number }, operation_type: { type: string }, operation_id: { type: integer }, target_type: { type: string }, context: { type: object } } }
      responses: { '200': { description: OK } }

  # ─────────────────────── Notifications ───────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: The unified notification center (general + offer matches)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [unread, read, archived] } }
        - { name: type, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK } }
  /notifications/unread-count:
    get: { tags: [Notifications], summary: Unread count + per-type summary, responses: { '200': { description: OK } } }
  /notifications/{notification}:
    get: { tags: [Notifications], summary: Notification detail, parameters: [{ name: notification, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /notifications/{notification}/read:
    post: { tags: [Notifications], summary: Mark read, parameters: [{ name: notification, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /notifications/{notification}/archive:
    post: { tags: [Notifications], summary: Archive, parameters: [{ name: notification, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /notifications/mark-all-read:
    post: { tags: [Notifications], summary: Mark all read, responses: { '200': { description: OK } } }

  # ─────────────────────── Push Tokens ───────────────────────
  /push-tokens:
    post:
      tags: [Push Tokens]
      summary: Register the device's push token (user_push_tokens — the single store)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string }, platform: { type: string } } } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Push Tokens]
      summary: Unregister a device token
      requestBody: { content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
      responses: { '200': { description: OK } }

  # ─────────────────────── Offer Follows ───────────────────────
  /discovery/service-types:
    get: { tags: [Discovery], summary: 'The full platform-service vocabulary (booking/menu/delivery/retail/schedules/training), unscoped by specialty (public) — powers a "what kind of service?" chip row shown before any category child is chosen. Contrast with /discovery/services, which is scoped to one child.', security: [], responses: { '200': { description: OK } } }
  /discovery/services:
    get: { tags: [Discovery], summary: 'Services hub for a specialty (public): every platform service available for the child category (the app services tab), with a business count each. Stable even for a service no one prices yet. open_now=1 narrows the counts.', security: [], parameters: [{ name: child_id, in: query, required: true, schema: { type: integer } }, { name: open_now, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /discovery/filters:
    get: { tags: [Discovery], summary: 'Customer discovery filters (public). open_now=1 narrows the business counts to shops open now.', security: [], parameters: [{ name: open_now, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /discovery/attributes:
    get: { tags: [Discovery], summary: 'Attribute (option) filters for a category child, with business counts (public). open_now=1 counts only shops open now.', security: [], parameters: [{ name: open_now, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /discovery/hotel-rooms/filters:
    get: { tags: [Discovery], summary: "What the hotel-room filter may offer, only from hotels that let a room now (public): classes [{id,name,count}] (تصنيف الإقامة; a hotel that ticked none counts as غير مصنّف), governorates [{id,name,count}], cities of ?governorate_id [{id,name,count}] and the price range", security: [], responses: { '200': { description: OK } } }
  /discovery/hotel-rooms:
    get: { tags: [Discovery], summary: "Rooms across hotels by class, place and price (public), cheapest first: ?class_option_id (the stars) &governorate_id &city_id &price_min &price_max &sort=price_asc|price_desc &business_id (one hotel) &starts_at &ends_at (check-in and check-out dates: only rooms FREE for those nights, each with the stay's total and nights). One row per room type per hotel: {hotel{id,name,class,governorate,city}, room{unit_id,offering_id,service_id,item_type,name,capacity,image} (what a booking of that very room is sent with), price (the hotel's own, per night), total and nights (only with dates; an allocation whose minimum or maximum nights do not fit the stay is left out), best_price, partner_offers[{offer_id,seller,price,available_quantity}]}. A partner company that holds an allocation of the room and offers it at its own price is listed beside the hotel's price, subject to the offer audience rules; the room inherits its hotel's class", security: [], responses: { '200': { description: OK } } }
  /discovery/businesses:
    get: { tags: [Discovery], summary: 'Discover businesses (hotels: starts_at & ends_at keep only businesses with a room FREE for those nights; every row of a room-letting trade carries stay_class {id,name} - the stars, غير مصنّف when none ticked) — filterable by service/item types, option_ids[] (all must match; a business counts as carrying an option if it ticked it OR prices an offering that sells it), and open_now (skip shops currently closed; a shop with no hours set is kept). Each row carries is_open_now.', security: [], parameters: [{ name: near_governorate_id, in: query, required: false, description: 'Where the customer is: orders the list (same city first, then governorate, then the rest) and never hides anyone', schema: { type: integer } }, { name: near_city_id, in: query, required: false, schema: { type: integer } }, { name: category_id, in: query, required: false, description: 'The root the customer came in through — an account holds exactly one (root, child) pair, so a child shared by several roots lists only the accounts filed under THIS one.', schema: { type: integer } }, { name: open_now, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /search/businesses:
    get: { tags: [Discovery], summary: "The app's search box: businesses by NAME (Arabic or English), across every category, newest first, up to 20; `q` of fewer than two letters answers an empty list. Public. Names only — never e-mail or phone, so a result count cannot confirm that an address is registered. Replaces the business half of the removed `/search/offers`.", parameters: [{ name: q, in: query, schema: { type: string } }], responses: { '200': { description: OK } } }
  /discovery/recommended:
    get: { tags: [Discovery], summary: 'Businesses ranked by aggregate review rating (stars_average, review_count on each row) — optionally narrowed to one root category via category_id and/or one platform service via service_id (from /discovery/service-types), but NOT specialty-scoped like /discovery/businesses. Powers a "recommended" browsing surface reached before a specialty is chosen.', security: [], parameters: [{ name: category_id, in: query, required: false, schema: { type: integer } }, { name: service_id, in: query, required: false, schema: { type: integer } }, { name: q, in: query, required: false, schema: { type: string } }], responses: { '200': { description: OK } } }
  /discovery/offerings:
    get: { tags: [Discovery], summary: 'The priced offerings themselves, not just the businesses holding them — «كشف عظام — 300 — مستشفى BIM». Filter with option_ids[] (all must be carried), service_id and item_types[]; reads business_service_prices and menu_items together. Each row carries label, line, modifiers, price and its business.', security: [], parameters: [{ name: child_id, in: query, required: true, schema: { type: integer } }, { name: option_ids, in: query, required: false, schema: { type: array, items: { type: integer } } }, { name: service_id, in: query, required: false, schema: { type: integer } }, { name: item_types, in: query, required: false, schema: { type: array, items: { type: string } } }, { name: per_page, in: query, required: false, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /discovery/offerings/{business}:
    get: { tags: [Discovery], summary: "ONE shop's window, browsed along its own option axes (public). Reads that business's business_service_prices and menu_items together through offering_options, so selling and renting arrive as one list however many services they sit on. data.axes carries the option groups those offerings actually use, each option with an offerings count — computed per axis with the OTHER axes' choices applied but not its own, so a chosen make never zeroes its siblings. option_ids[] are alternatives WITHIN a group and narrow ACROSS groups: «SUV → BMW → إيجار» is three taps. Each row carries action (book|order) and, when it books, the units to send back as bookable_id.", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }, { name: option_ids, in: query, required: false, schema: { type: array, items: { type: integer } } }, { name: service_id, in: query, required: false, schema: { type: integer } }, { name: item_types, in: query, required: false, schema: { type: array, items: { type: string } } }, { name: per_page, in: query, required: false, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Business not found' } } }
  /discovery/offering-lines:
    get: { tags: [Discovery], summary: 'The بنود a child actually sells — each row is a whole line+modifier combination (e.g. «غرفة نوم — مودرن») with its offering count and the exact option_ids to pass back to /discovery/offerings. Collapses the options-then-services funnel into one tap.', security: [], parameters: [{ name: child_id, in: query, required: true, schema: { type: integer } }, { name: service_id, in: query, required: false, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /discovery/menu/{business}:
    get: { tags: [Discovery], summary: "A business's menu grouped into headings (public). Each heading carries source: section (merchant-written) | item_type | line_option | none. data.business carries is_open_now.", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /discovery/menu-items/search:
    get: { tags: [Discovery], summary: "Search across shops by a detail kind's fields and compare prices (public). profile = a kind code from /discovery/menu-items/kinds; attr[code] (words/option ids, comma-separated), attr[code_min]/attr[code_max] (figures) match the unit's own value or, where it states none, its catalog master's. catalog_product_id lists every shop that sells that one product — pass sort=price_asc to compare. data.facets says what is on offer per field; paging is data.meta.", security: [], parameters: [{ name: profile, in: query, required: false, schema: { type: string } }, { name: q, in: query, required: false, schema: { type: string } }, { name: line_option_id, in: query, required: false, schema: { type: integer } }, { name: brand_id, in: query, required: false, schema: { type: integer } }, { name: catalog_product_id, in: query, required: false, schema: { type: integer } }, { name: governorate_id, in: query, required: false, schema: { type: integer } }, { name: city_id, in: query, required: false, schema: { type: integer } }, { name: attr, in: query, required: false, style: deepObject, explode: true, schema: { type: object, additionalProperties: { type: string } } }, { name: sort, in: query, required: false, schema: { type: string, enum: [price_asc, price_desc, newest] } }, { name: per_page, in: query, required: false, schema: { type: integer, maximum: 50 } }], responses: { '200': { description: OK }, '404': { description: 'Unknown kind' } } }
  /discovery/menu-items/kinds:
    get: { tags: [Discovery], summary: "The detail kinds a customer can search (سيارات، كمبيوتر ولاب توب…) — only kinds some shop sells — each with only the fields that are filters for it (public).", security: [], responses: { '200': { description: OK } } }
  /discovery/menu-items/{item}:
    get: { tags: [Discovery], summary: "One active menu item (public), shaped exactly like a row of /discovery/menu/{business} — data.item — plus data.business {id, name, logo, is_open_now}. What a search or compare result opens as the product page.", security: [], parameters: [{ name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Item not found or switched off' } } }
  /discovery/units/{business}:
    get: { tags: [Discovery], summary: "The bookable units a business offers, grouped by kind (public). 21 children set requires_bookable_item, so the booking engine refuses a booking without a named unit and the client must send bookable_id — this is where those ids come from. Each kind carries its own price (line_option_id on the priced row) plus offering_id to send back. Pass starts_at+ends_at to get availability per unit; without them the answer is what exists and what it costs.", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }, { name: service_id, in: query, required: false, schema: { type: integer }, description: 'Defaults to the booking service.' }, { name: item_type, in: query, required: false, schema: { type: string } }, { name: starts_at, in: query, required: false, schema: { type: string, format: date-time } }, { name: ends_at, in: query, required: false, schema: { type: string, format: date-time } }], responses: { '200': { description: OK }, '404': { description: 'Business not found' } } }
  /discovery/units/{business}/day-grid:
    get: { tags: [Discovery], summary: "One day as a grid of start times (public) — for hourly venues and tables: each slot says how many of the business's units are free for `duration_minutes` from that time (`free`, `unit_ids`), judged by the same availability service the booking engine uses (working hours, blocked slots, live bookings). A closed day returns `closed: true` and no slots; a business that never wrote its week is judged open 08:00–23:00 (`hours_known: false`).", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }, { name: date, in: query, required: true, schema: { type: string, format: date } }, { name: duration_minutes, in: query, schema: { type: integer, minimum: 15, maximum: 720, default: 60 } }, { name: step_minutes, in: query, schema: { type: integer, enum: [15, 30, 60], default: 60 } }, { name: party_size, in: query, schema: { type: integer }, description: 'Only units that seat this many' }, { name: service_id, in: query, schema: { type: integer } }, { name: item_type, in: query, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /discovery/appointments/{business}/day-grid:
    get: { tags: [Discovery], summary: "One day as a grid of start times for an appointment with the business itself (public) — no units. Each slot is as long as the chosen service (`offering_id`, a priced row of the business; its `duration_minutes`, else the business's slot setting, else 30 minutes) and `free` 0/1: taken when the business already holds a live booking across it, passed, or inside the business's lead time. A closed day returns `closed: true` and no slots; a business that never wrote its week is judged open 09:00–21:00 (`hours_known: false`).", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }, { name: date, in: query, required: true, schema: { type: string, format: date } }, { name: offering_id, in: query, schema: { type: integer } }, { name: provider_id, in: query, description: "A provider of the business (`GET /businesses/{id}/providers`): the grid then shows only HIS free times — several people can work at once, so other providers' bookings do not block it. 422 for someone who is not a provider there.", schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/booking-settings/arrival-notice:
    get: { tags: [Bookings], summary: "The business's own notice on every booking and appointment it takes — `{minutes, text, message}` (message = the composed sentence, null when the business said nothing).", responses: { '200': { description: OK } } }
    put: { tags: [Bookings], summary: "Set the notice — `{minutes?: 0-240, text?: up to 255 characters}`; an empty pair removes it. The customer sees it on the booking form and on every booking (`arrival_notice`), and the clinic's reminders repeat it.", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /discovery/courses/{business}:
    get: { tags: [Discovery], summary: "The courses of a business with the groups each runs in (public): a group not yet ended and active, with `starts_on`, `ends_on`, `schedule_text`, `level`, `seats` and `seats_left`. A course with no group to join is left out.", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/course-groups:
    get: { tags: [Bookings], summary: "The business's own courses (priced rows of the course kind) and every group, each with the seats taken.", responses: { '200': { description: OK } } }
    post: { tags: [Bookings], summary: 'Open a group of a course — {offering_id, name, level?, schedule_text?, starts_on, ends_on?, seats}. The course must be one of this business.', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/course-groups/{group}:
    put: { tags: [Bookings], summary: 'Change a group (or close it with is_active false). The seats cannot go below the seats already taken.', parameters: [{ name: group, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Bookings], summary: 'Delete a group nobody joined (422 when students joined — close it instead).', parameters: [{ name: group, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /discovery/appointments/{business}/queue:
    get: { tags: [Discovery], summary: "«بالدور» (public): the turn a customer would get on `date` and the time it should come — `{flow, turn, ahead, expected_at, ends_at, full, closed, duration_minutes}`. The time is the earliest gap the service fits in after what the business already holds, inside its opening hours and lead time. Nothing is taken until `POST /bookings/queue`.", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }, { name: date, in: query, required: true, schema: { type: string, format: date } }, { name: offering_id, in: query, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/booking-settings/flow:
    get: { tags: [Bookings], summary: "How the business takes its appointments — `{flow: slots|queue}`; slots = the customer picks a time, queue = the customer is given the next turn of the day.", responses: { '200': { description: OK } } }
    put: { tags: [Bookings], summary: 'Choose how appointments are taken — {flow: slots|queue}.', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/queue:
    post: { tags: [Bookings], summary: "«بالدور»: book by turn — {business_id, service_id, offering_id, date, notes?, meta?…}; the same booking as `POST /bookings` but the business names the time: the booking carries `queue_turn` and a live `queue {turn, ahead, expected_at}` while it waits. The number is taken under a lock on the business. 422 when the business does not book by turn, when the day is closed or its turns are used up.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /service-requests/quote:
    post: { tags: [Service Requests], summary: "A ride's distance and suggested price before it is asked: {origin_city_id, destination_city_id, distance_km?} → {known, needs_distance, distance_km, source, suggested_price}. Two cities are measured centre to centre (x a road factor); one city both ways needs the customer's own distance_km.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /service-requests/home-trades:
    get: { tags: [Service Requests], summary: "The trades a kind=home_service request picks from (electrician, plumber, painter, carpenter, AC, appliances, aluminium, curtains), each {id, name}", responses: { '200': { description: OK } } }
  /service-requests/work-trades:
    get: { tags: [Service Requests], summary: "The workshops and factories a kind=work_quote request picks from (aluminium, doors and windows, furniture, marble, glass, packaging and printing, iron and joinery workshops, appliance repair…), each {id, name}", responses: { '200': { description: OK } } }
  /service-requests/car-options:
    get: { tags: [Service Requests], summary: "The kinds of car (vehicle_types) and makes (brands), each {id, name}, that a kind=car_wanted request picks from", responses: { '200': { description: OK } } }
  /service-requests:
    get: { tags: [Service Requests], summary: "My requests, newest first (status filter incl. expired), with the number of live offers on each.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    post: { tags: [Service Requests], summary: "The requests-and-offers core: post a need. kind=ride → {origin:{governorate_id,city_id,label?}, destination:{…}, passengers?, starts_at?, price?, distance_km?, details?}; the price defaults to the suggested one; the limousine drivers of the origin's governorate are told. An immediate ride lives ttl_minutes, a scheduled one until its time. kind=work_quote → {trade_child_id, what (short), details (the specification), quantity?, unit?, deadline?, max_price?, nationwide? (true: a maker of any governorate may answer, the nearest are told first), governorate_id, city_id?}: workshops or factories of THAT trade answer with a price and `eta_minutes` = the minutes they need to finish (the app sends days x 1440); live 7 days; accepting makes an appointment at the maker (tomorrow 11:00) at the quoted price. kind=home_service → {trade_child_id, governorate_id, city_id, details (the job), starts_at?, max_price?}: only the businesses of THAT trade in the governorate are told (the customer's own city first), live 3 days, and accepting a quote makes a visit appointment at the quoted price; the address is never in the request. kind=car_wanted → {deal: buy|rent, vehicle_type_option_id?, brand_option_id?, year_min?, max_price? (a rental: per day), days?, governorate_id, city_id?, starts_at? (the viewing time), details?}: the showrooms and private sellers of the governorate are told, live 14 days, and accepting an offer makes a free viewing appointment with that dealer.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /service-requests/{id}:
    get: { tags: [Service Requests], summary: "My request with every offer on it (cheapest first), who made each, and the booking once one is chosen.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /service-requests/{id}/price:
    post: { tags: [Service Requests], summary: "The customer changes the price he asks for ({price}); drivers still answer with theirs.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /service-requests/{id}/offers/{offer}/accept:
    post: { tags: [Service Requests], summary: "He picks an offer: it becomes a booking (accepted, the customer confirms attendance first), the other offers are turned down, everyone is told. → {request, booking_id}.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: offer, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /service-requests/{id}/cancel:
    post: { tags: [Service Requests], summary: "Cancel an open request; its offers are turned down and the offerers told.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listings/categories:
    get: { tags: [Owner Listings], summary: "«إعلان من المالك»: the categories (car, property, phones, computers, appliances, furniture, clothes, kids, sports, tools, other), the deals each allows (sale/rent/swap) and the fields each asks, with the select options filled — what the app draws the form from.", responses: { '200': { description: OK } } }
  /owner-listings/mine:
    get: { tags: [Owner Listings], summary: "The caller's own listings in any state (active, flagged, done, expired) — {results: [card…]}.", responses: { '200': { description: OK } } }
  /owner-listings:
    get: { tags: [Owner Listings], summary: "Browse live listings, newest first — only those with a photo, not finished, not expired, not hidden by reports. Filters: category, deal, governorate_id, city_id, q, price_min, price_max, per_page. A card never carries a phone number.", parameters: [{ name: category, in: query, schema: { type: string } }, { name: deal, in: query, schema: { type: string } }, { name: governorate_id, in: query, schema: { type: integer } }, { name: q, in: query, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    post: { tags: [Owner Listings], summary: "Post ONE item for sale/rent/swap with no business account: {category, deal, title, description?, price? (a sale or rent needs it), price_unit? (day|week|month, for a rent), governorate_id, city_id?, visibility? (all|governorate|city: limit who sees it by the viewer own registered place), hold_deposit? (agree to the seriousness deposit — see GET /owner-listings/requirements), attributes?} — attributes are checked against the category's fields. One live listing per category per account (422 on the second); lives 60 days; shown to others once it has a photo.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listings/requirements:
    get: { tags: [Owner Listings], summary: "«جدية الإعلان»: what this account must do to publish — `{required, guarantee_ok, needs_deposit, deposit_amount, balance, min_level{code,name}}`. An advertiser holding a bronze+ guarantee (`bim.owner_listings.min_guarantee_level`) needs nothing; otherwise, when the control panel prices the deposit (event `owner_listing_deposit`), `POST /owner-listings` must carry `hold_deposit: true` and the amount is held in the wallet until the listing is sold, finished, deleted or ends. A guarantee holder whose FREE coverage reaches the amount has that coverage frozen for the life of the listing instead. If a moderator removes the listing for a violation the stake is confiscated; `violations` lists the rules the new-listing page must warn about. Switched off in the panel = `required: false`.", responses: { '200': { description: OK } } }
  /owner-listings/{id}:
    get: { tags: [Owner Listings], summary: "One listing in full (attributes in words, photos, the owner as a person, never the number). A stranger gets 404 for a listing that is not live; its owner sees it in any state, with `inquiries_count`.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    put: { tags: [Owner Listings], summary: "The owner changes a live listing (deal, title, description, price, place, attributes).", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Owner Listings], summary: "The owner deletes it now: the listing, its photos and every chat about it.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listings/{id}/finish:
    post: { tags: [Owner Listings], summary: "«تم البيع/التأجير»: {reason: sold|rented|swapped|withdrawn} (the one that fits the deal). Hidden at once and deleted after 3 days, its chats staying until then; his place in the category is free again.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listings/{id}/renew:
    post: { tags: [Owner Listings], summary: "Another 60 days for a live or just-expired listing (a finished one is not brought back).", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listings/{id}/images:
