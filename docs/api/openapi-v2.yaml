  /guarantee-badges:
    get:
      tags: [Guarantees]
      summary: "The guarantee level each account wears beside its name — ?ids=1,2,3 (at most 100). data.badges is keyed by account id: {code, name_ar, name_en, priority, covers_up_to, target_type} or null when the account has no usable guarantee. Public to any signed-in account on purpose: so the other side of a deal sees what level it deals with and what it covers up to."
      parameters: [{ name: ids, in: query, required: true, schema: { type: string }, description: Comma-separated account ids. }]
      responses: { '200': { description: OK } }
  /visit-deposits/{kind}/{subject}/guarantors:
    get:
      tags: [Guarantees]
      summary: "The customer of an operation (kind = clinic-appointment | investigation-order | procedure-request | order) lists the friends he invited to stand for its deposit: data.guarantors, data.combined_coverage and data.need {deposit, combined_coverage, needed} — what is still missing after his guarantee, his friends' and his wallet. 404 to anyone else."
      parameters: [{ name: kind, in: path, required: true, schema: { type: string } }, { name: subject, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Guarantees]
      summary: "Invite a friend to stand for the operation's deposit — {guarantor_user_id | phone | email}. The friend must hold a usable guarantee; his coverage is frozen on accepting and returned when the operation ends (done, cancelled or ruled). 422 when the operation is over or asks no deposit."
      parameters: [{ name: kind, in: path, required: true, schema: { type: string } }, { name: subject, in: path, required: true, schema: { type: integer } }]
      responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /guarantors/{guarantor}:
    get:
      tags: [Guarantees]
      summary: "One co-guarantor request, read by the invited friend or the requester: the requester, the status and the friend's available_coverage."
      parameters: [{ name: guarantor, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '403': { description: Not a party } }
  /business/schedules/reservations/{reservation}/no-show:
    post: { tags: [Schedules], summary: "The carrier marks a CONFIRMED reservation «لم يحضر»: the customer's side takes a cancelled mark, the seats are freed, and the deposit stays HELD (never confiscated) until the carrier gives it back or either side disputes.", parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /schedules/reservations/{reservation}/attendance:
    post: { tags: [Schedules], summary: "The customer confirms he is there — always FIRST; the carrier confirms after him. 422 unless the reservation is confirmed.", parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/schedules/reservations/{reservation}/attendance:
    post: { tags: [Schedules], summary: "The carrier confirms the passenger boarded — only after the customer did (an off-app seat needs only the carrier). A full leg whose every seat is confirmed by both closes to new bookings and shows as complete.", parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/schedules/reservations/{reservation}/rating-visibility:
    post: { tags: [Schedules], summary: "An off-app passenger appears in ratings and the completed/pending counts only once the SAME platform fee an app customer pays is taken from the carrier's wallet. Idempotent.", parameters: [{ name: reservation, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /schedules/{schedule}/parcels:
    post: { tags: [Schedules], summary: "The sender (an app account) requests a parcel on a leg: description + the receiver (receiver_user_id of an account, or receiver_name + receiver_phone). The driver prices it next.", parameters: [{ name: schedule, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /schedules/my-parcels:
