      parameters:
        - { name: photo, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not in my library' }
  /trainer-photos/{photo}:
    get:
      tags: [Training]
      summary: A library photo from private storage
      description: 'No login: the signed, time-limited link returned by the library endpoint is the credential. 403 when the signature is missing, tampered or expired.'
      security: []
      parameters:
        - { name: photo, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: The image }
        '403': { description: 'Missing, tampered or expired signature' }
        '404': { description: Not found }
  /business/training-plans/{plan}/exercises/{exercise}/images/from-library:
    post:
      tags: [Training]
      summary: Attach photos from my library to a client's exercise (trainer)
      description: 'Each photo is COPIED into the plan, so a plan never depends on the library or on another client. A photo id that is not in my library is a 404. Same 6-per-item cap as an upload.'
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { name: exercise, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [photo_ids]
              properties:
                photo_ids: { type: array, items: { type: integer } }
      responses:
        '201': { description: Attached }
        '404': { description: 'Not your plan or photo' }
        '422': { description: 'Over the per-item photo limit' }
  /business/training-plans/{plan}/meals/{meal}/images/from-library:
    post:
      tags: [Training]
      summary: Attach photos from my library to a client's meal (trainer)
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { name: meal, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [photo_ids]
              properties:
                photo_ids: { type: array, items: { type: integer } }
      responses:
        '201': { description: Attached }
        '404': { description: 'Not your plan or photo' }
        '422': { description: 'Over the per-item photo limit' }
  /business/training-plans/{plan}/program:
    put:
      tags: [Training]
      summary: Set the programme's length and weight progression for the whole plan at once (trainer)
      description: 'duration_weeks (1-52) and starts_on fix the end date; progression {every_weeks, increment_kg, exercise_ids?} sets how the weights climb for the given exercises, or for every weighted exercise when none are given. Nothing is stored per week — every week target is computed from the rule, so later weeks follow.'
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_weeks: { type: integer, minimum: 1, maximum: 52 }
                starts_on: { type: string, format: date }
                progression:
                  type: object
                  properties:
                    every_weeks: { type: integer, minimum: 1, maximum: 26 }
                    increment_kg: { type: number, minimum: 0, maximum: 100 }
                    exercise_ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: 'OK - the plan, each exercise with current_targets (this week per set) and schedule (every week)' }
        '403': { description: Not a training-capable business }
        '404': { description: 'Not your plan' }
        '422': { $ref: '#/components/responses/Validation' }
  /business/training/clients/lookup:
    get:
      tags: [Training]
      summary: Find the client a plan is for - an EXACT phone or e-mail (trainer)
      description: 'Deliberately not a search: only a full phone number or e-mail as registered matches, and only client accounts, so it is a client picker and not a people-finder. Throttled to 30 requests a minute.'
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: 'OK - data.found and, when found, data.client {id, name, phone}' }
        '403': { description: Not a training-capable business }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { description: Too many lookups }
  /business/training-templates:
    get:
      tags: [Training]
      summary: My reusable training templates (trainer)
      parameters: [{ $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK } }
    post:
      tags: [Training]
      summary: Create a reusable template (trainer, or a `training` delegate)
      description: Same exercises/meals shape as a plan, but with no client. Apply it later to any client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                goal: { type: string }
                notes: { type: string }
                exercises: { type: array, items: { type: object, required: [name], properties: { name: { type: string }, day_of_week: { type: integer }, sets: { type: integer }, reps: { type: string }, rest_seconds: { type: integer }, notes: { type: string } } } }
                meals: { type: array, items: { type: object, required: [meal_type, name], properties: { meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }, name: { type: string }, calories: { type: integer }, notes: { type: string } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } }
  /business/training-templates/{template}:
    get:
      tags: [Training]
      summary: A template in full (trainer)
      parameters: [{ name: template, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Training]
      summary: Update a template's header (trainer)
      parameters: [{ name: template, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Training]
      summary: Update a template (alias of PUT)
      parameters: [{ name: template, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Training]
      summary: Delete a template (trainer)
      parameters: [{ name: template, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/training-templates/{template}/exercises:
    post:
      tags: [Training]
      summary: Add an exercise to a template (trainer)
      parameters: [{ name: template, in: path, required: true, schema: { type: integer } }]
      responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/training-templates/{template}/exercises/{exercise}:
