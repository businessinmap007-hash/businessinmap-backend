      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Business Bookables]
      summary: Create a bookable unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, item_type, code]
              properties:
                service_id: { type: integer, description: Must be a service the owner offers. }
                item_type: { type: string, description: Must be an item type the owner's subcategory offers. }
                code: { type: string }
                title: { type: string }
                capacity: { type: integer, minimum: 1 }
                quantity: { type: integer, minimum: 1 }
                is_active: { type: boolean }
      responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/bookable-items/options:
    get: { tags: [Business Bookables], summary: Services + allowed item types for the create form, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /business/bookable-items/{item}:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Bookables], summary: Bookable unit detail, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Business Bookables], summary: Update a bookable unit, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
    patch: { tags: [Business Bookables], summary: Update a bookable unit, responses: { '200': { description: OK } } }
    delete: { tags: [Business Bookables], summary: Delete a bookable unit, responses: { '200': { description: OK } } }
  /business/bookable-items/{item}/images:
    post: { tags: [Business Bookables], summary: 'Upload photos for one bookable unit (multipart images[], max 10 per unit) — same gallery pattern as the menu item photos.', parameters: [{ name: item, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '422': { description: 'Not an image, or the 10-photo cap is reached' } } }
  /business/bookable-items/{item}/images/{image}:
    delete: { tags: [Business Bookables], summary: 'Delete one photo from a bookable unit. Removes the FILE as well as the row.', parameters: [{ name: item, in: path, required: true, schema: { type: integer } }, { name: image, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not this business unit, or no such photo' } } }
  /bookings/{booking}/deposit/request-as-payment:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Business Bookables], summary: "The CUSTOMER asks that the frozen deposit be taken as a payment instead of a transfer outside the platform (only where the business opted in via booking-terms.accept_deposit_as_payment). The reply carries data.deposit_as_payment {allowed, requested, declined, accepted, amount}", responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/{booking}/deposit/accept-as-payment:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Business Bookables], summary: "The BUSINESS accepts the request: the customer's hold moves to it and its own counter-hold returns. Platform fees stay separate (charged from each wallet); a frozen guarantee is never touched", responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/{booking}/deposit/decline-as-payment:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Business Bookables], summary: 'The BUSINESS declines; the deposit stays frozen and comes back when both confirm the cash was paid outside', responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/occupancy:
    get: { tags: [Business Bookables], summary: "«شاشة الغرف»: a hotel's month (`month=YYYY-MM`, default this month) — per room kind, per room type: `stock`, `booked[]` and `via_partner[]` rooms per day, `held_for_partners` (promised to a partner, not for sale) and the month's bookings with guest, source direct|partner, the partner's name and the room number once given. A stay sold by an agency through an allocation counts like any other. Each room type carries `guest_scope` (all|locals|foreigners — «أسعار للمصريين والمقيمين فقط») and each booking the `guest_origin` the guest declared, for the hotel to check on arrival. The same `guest_scope` is on the unit lists; `POST /bookings` takes `guest_origin` (local|foreign), required for a room type that is not `all`, and the unit list and hotel-room search take `guest_origin` to show only the room types sold to that guest.", parameters: [{ name: month, in: query, schema: { type: string, example: '2026-11' } }], responses: { '200': { description: OK } } }
  /business/bookable-items/{item}/rooms:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Bookables], summary: "The hotel's own list of numbered rooms behind a room type (booking_stay only). Never shown to a customer", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    post: { tags: [Business Bookables], summary: 'Add rooms - {numbers: ["101","102"]}; a number already listed is skipped. The quantity of the room type follows the open rooms', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/seasons:
    get: { tags: [Business Bookables], summary: "The hotel's seasons [{id, name, start_date, end_date, room_change_type percent|amount, room_change_value, room_prices {room_type_id: night price}, meal_prices {option_id: price}, min_nights}], with room_types and meal_plans (the plans it sells, at their own price) for the form", responses: { '200': { description: OK } } }
    post: { tags: [Business Bookables], summary: 'Add a season - seasons of a hotel never overlap. A night inside it is priced: the room type''s own price rule first, else room_prices[type], else the base +/- the change; the meal plan at meal_prices[plan]; a stay ARRIVING in it must be at least min_nights (422 on ends_at)', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/seasons/{id}:
    put: { tags: [Business Bookables], summary: 'Edit a season (same body)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Business Bookables], summary: 'Remove a season', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /business/booking-settings/rate-plans:
    get: { tags: [Business Bookables], summary: 'The non-refundable rate: {non_refundable_percent} (null = the hotel sells only the flexible rate)', responses: { '200': { description: OK } } }
    put: { tags: [Business Bookables], summary: 'Write it (1-50%, null to stop). A guest booking a stay with rate_plan=non_refundable (POST /bookings, /bookings/preview) gets this % off the stay (not the gala dinners) - price_breakdown.non_refundable {percent, amount}; its dates can no longer move (reschedule 422). Payment is cash outside the app; nothing is confiscated: the booking''s external_deposit carries kind=prepayment with the WHOLE price, the hotel confirms it (deposit/confirm-received cash|transfer) or waives it, and check-in (start) is refused before that. GET /bookings/{id} carries stay_details {adults, children [{age, percent, single_parent, total}], extra_beds, single_occupancy_percent, cots, meal_plans, gala_dinners, rate_plan} for both sides. Partner sales offer only the flexible rate. The unit list carries non_refundable_percent', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/gala-dinners:
    get: { tags: [Business Bookables], summary: "The hotel's compulsory gala dinners from today on: [{id, date, name, adult_price, child_percent, child_free_under}]", responses: { '200': { description: OK } } }
    post: { tags: [Business Bookables], summary: 'Add one - {date Y-m-d (today or later, one per date), name, adult_price, child_percent (default 50), child_free_under (default 6)}. Every stay over that night pays it - each adult the price, each child from the free age its percentage - whatever meal plan, also on a partner sale; the preview and booking carry price_breakdown.gala_dinners and gala_total. The unit list (and partner rooms) carry gala_dinners', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/gala-dinners/{id}:
    put: { tags: [Business Bookables], summary: 'Edit one gala dinner (same body)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: Not found }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Business Bookables], summary: 'Remove one gala dinner', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: Not found } } }
  /business/meal-times:
    get: { tags: [Business Bookables], summary: "The hotel's meal times (null until written): {breakfast:{from,to}, lunch:{from,to}, dinner:{from,to}} as HH:mm", responses: { '200': { description: OK } } }
    put: { tags: [Business Bookables], summary: 'Write them - each meal from/to HH:mm, any may be empty. A guest reads, on GET /bookings/{id} (meal_times), the meals his plan gives: breakfast (BB) → breakfast; half board → breakfast + dinner; full board and all inclusive → all three. The unit list carries them as meal_times', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/child-policy:
    get: { tags: [Business Bookables], summary: "The hotel's «سياسة الأطفال» (null until written): adult_from_age, counts_from_age (a child takes a place in the room from it), meals_follow, bands [{from, to, percent}] — percent of every night's price, 0 = free", responses: { '200': { description: OK } } }
    put: { tags: [Business Bookables], summary: 'Write it - {adult_from_age, counts_from_age, meals_follow, extra_bed_price, extra_beds_max, single_parent_percent, bands: [{from, to, percent, second_percent}]}; percent is what the room''s FIRST child of the band pays, second_percent each further one; single_parent_percent (null = off) is what the child in the second adult''s place of a ONE-adult room pays (0 = free), the oldest child taking it; bands in order, not overlapping, under adult_from_age. A stay then takes children_ages [..] (POST /bookings, /bookings/preview): each child pays its band percent of ONE PERSON''s night (the night as booked ÷ the room''s capacity) and, with meals_follow, of one adult''s meal plan; guests over the capacity get extra beds at extra_bed_price a night, up to extra_beds_max a room (no price = refused); children from counts_from_age count against the capacity. The policy rides on the unit list as child_policy (and on each partner room)', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/bookable-items/{item}/rooms/{room}/features:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }, { name: room, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Bookables], summary: "The hotel's feature vocabulary (views, beds…) with what THIS numbered room carries ticked - «مواصفات لكل رقم غرفة»", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Business Bookables], summary: 'Set what this room carries - {option_ids: [853, 854]}, kept to the hotel feature vocabulary. A guest who ticked a feature at booking (option_ids) gets, when the stay starts, a free room that carries it; with none free the start is refused and the hotel puts the stay in a room by hand. The room list (GET rooms) returns each room feature_ids and features; GET /business/bookings/{booking}/rooms returns requested[] and, per free room, matches', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/bookable-items/{item}/rooms/{room}:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }, { name: room, in: path, required: true, schema: { type: integer } }]
    patch: { tags: [Business Bookables], summary: 'Rename a room, close it for maintenance (status=maintenance) or note it', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Business Bookables], summary: 'Remove a room (refused while a live stay holds it)', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/bookable-items/{item}/day-use:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Bookables], summary: "Day use of a hotel room type - the window and flat price the hotel set (enabled false until it does)", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Business Bookables], summary: 'Set Day use - {enabled, from: "HH:mm", to: "HH:mm", price}. The window is 2-16 hours; a guest then books it by date (POST /bookings with day_use=true and date), holding one room of the type for that window at the flat price', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/bookable-items/{item}/stay-discounts:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Bookables], summary: "The week and month discounts the owner set on a unit let by the period (0 until set)", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Business Bookables], summary: 'Set them - {weekly_percent, monthly_percent}, each 0-60. A stay of 7+ nights takes the weekly percentage off the total, 30+ nights the monthly one (the larger tier reached); the invoice still reads night by night', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/bookings/{booking}/rooms:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Bookables], summary: 'The rooms this stay could be put in (free ones) and the one it has', responses: { '200': { description: OK } } }
  /business/bookings/{booking}/room:
    parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Business Bookables], summary: 'Put the stay in a room - {room_id}. A stay is given one automatically when it starts; the customer sees the number only from then on', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/stay-requests:
    get: { tags: [Business Bookables], summary: "What hotel guests asked during their stays, with the room number - ?status=open (default, oldest first)|done|all", responses: { '200': { description: OK } } }
  /business/stay-requests/{stayRequest}:
    parameters: [{ name: stayRequest, in: path, required: true, schema: { type: integer } }]
    patch: { tags: [Business Bookables], summary: 'Move a guest request along - {status: in_progress|done|cancelled}; the guest is told', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/stay-services:
    get: { tags: [Business Bookables], summary: "The services a guest may order during a stay - the hotel's own list, or the platform's starting list until the hotel writes its own (custom=false)", responses: { '200': { description: OK } } }
    post: { tags: [Business Bookables], summary: 'Add services - {titles: [..]}. The first row written keeps the starting list and adds to it', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/stay-services/{option}:
    parameters: [{ name: option, in: path, required: true, schema: { type: integer } }]
    patch: { tags: [Business Bookables], summary: 'Rename a service or switch it off - {title?, is_active?}', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    delete: { tags: [Business Bookables], summary: Remove a service from the list, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/booking-add-ons:
    get: { tags: [Business Bookables], summary: "إضافات الحجز - add_ons (meal plans: one choice by default, selection_type single|multiple) and features (a room's own view/features), each option with the price the hotel wrote once for the whole business", responses: { '200': { description: OK } } }
    put: { tags: [Business Bookables], summary: 'Price them - {add_ons: [{option_id, enabled, value, adjust_type, per_person}], features: [same], selection_types: {groupId: single|multiple}}. Rows the screen does not show are kept', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/bookable-items/{item}/features:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Bookables], summary: "The features this room carries (a pool view) with the price the hotel wrote for each - the room's own price then shows the room type's price plus them", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Business Bookables], summary: 'Say which features this room carries - {option_ids: [..]}; the room type (line) is kept', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/booking-terms:
    get:
      tags: [Business Bookables]
      summary: "شروط الحجز — how the business secures its bookings AND its health visits (clinic appointments, lab/radiology orders, hospital procedures): deposit frozen in both wallets / the customer's guarantee / transfer outside the app, with a preview for an 800 booking. Open to a bookings, clinic, investigations or procedures capability; an owner always. The two in-app modes need the business's OWN active guarantee (422 on `security_mode` otherwise; `data.has_guarantee` says): its counter share is frozen from that coverage first, its wallet for the rest. Without one only `external_transfer` may be switched on. Each visit's payload carries `deposit` {mode,status quoted|held|pending|received|waived|released|refunded|void|disputed|resolved,amount,counter_amount}"
      responses: { '200': { description: OK } }
    put:
      tags: [Business Bookables]
      summary: 'Save the terms: enabled, security_mode (deposit_freeze|guarantee_freeze|external_transfer), deposit_percent (1-50), deposit_base (first_day|total), business_counter_percent, guarantee_multiple (0-10), forfeit_to_business, accept_deposit_as_payment (deposit_freeze only)'
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }
  /business/booking-settings/check-times:
    get: { tags: [Business Bookables], summary: A stay's check-in/check-out clock, responses: { '200': { description: OK } } }
    put: { tags: [Business Bookables], summary: Set the check-in/check-out clock ('HH:mm' or null), responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }

