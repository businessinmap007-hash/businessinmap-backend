  /business/investigation-home-fee:
    put: { tags: [Investigations], summary: "A lab's fee for taking the sample at the patient's home — {home_fee: number|null}; null = not offered. Labs only.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /procedure-requests/{row}/confirm:
