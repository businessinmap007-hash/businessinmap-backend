      parameters: [{ name: template, in: path, required: true, schema: { type: integer } }, { name: meal, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/training-templates/{template}/apply:
    post:
      tags: [Training]
