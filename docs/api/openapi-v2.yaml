  /owner-listing-inquiries/{inquiry}/reveal/accept:
    post: { tags: [Owner Listings], summary: "The other side accepts: the platform's fee (priced for the buyer and for the seller in the control panel — fixed or a percent of the price between a floor and a ceiling) is taken from the wallets and each side sees the other's number. 422 `balance` when a wallet cannot pay (nothing is taken). Idempotent.", parameters: [{ name: inquiry, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /owner-listing-inquiries/{inquiry}/reveal/cancel:
    post: { tags: [Owner Listings], summary: "Decline the request, or take one's own back — the conversation goes on.", parameters: [{ name: inquiry, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /reports/reasons:
    get: { tags: [Reports & Moderation], summary: "The reasons the report sheet offers: `[{key, name}]` (spam, fraud, inappropriate, prohibited, wrong_info, other), named in the request language.", responses: { '200': { description: OK } } }
  /reports:
    post: { tags: [Reports & Moderation], summary: "Report a post, a public comment, an owner listing, an account or a CONVERSATION (one of its people reports it; `message_ids` — at most 30 — are the messages he chooses to show the moderators) {type: post|comment|owner_listing|account|conversation, id, reason, details?, message_ids?}. One report per person per item (a second changes nothing); 422 for your own content or content that is no longer available. Three different people reporting a listing hide it until a moderator looks.", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/me:
    get: { tags: [Reports & Moderation], summary: "`{is_moderator}` — does this account get the moderation tab (it holds the content ability)? The same flag is on `GET /auth/me`.", responses: { '200': { description: OK } } }
  /moderation/violations:
    get: { tags: [Reports & Moderation], summary: "The rules an owner listing is removed for: `[{key, name}]` (fraud, inappropriate, prohibited, wrong_info, not_owner, off_platform, spam) — the remove dialog's choices, the same list the new-listing page warns about. 404 for a non-moderator.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /moderation/reports/conversation/{id}/request-consent:
    post: { tags: [Reports & Moderation], summary: "Way 2 of reading a reported conversation: ask both parties to allow the moderators to read it (they answer in the chat, with the banner every chat shows). Needs the claim.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '403': { description: Locked }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/conversation/{id}/vouch:
    post: { tags: [Reports & Moderation], summary: "Way 3: this moderator's own vote toward the quorum (the same quorum admins use, `admin_quorum`, 3) that opens the conversation without the parties. A second vote by the same moderator counts once.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '403': { description: Locked }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/conversation/{id}/messages:
    get: { tags: [Reports & Moderation], summary: "The whole reported conversation, read-only, `{messages:[{id,kind,body,sender,created_at}]}` — only when it is open by the consent of every party or by the quorum; otherwise 403 `conversation_locked` with `data.access` (where each way stands). Way 1 needs no call: the messages the reporter chose are already on the queue row (`conversation.selected`).", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '403': { description: Locked }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/conversation/{id}/party/{user}/chat:
    post: { tags: [Reports & Moderation], summary: "After reading: open a moderator chat with one of the conversation's people (`operation-chats/moderation/{case_id}`). 422 for someone who is not a party.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: user, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '403': { description: Locked }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/conversation/{id}/party/{user}/freeze:
    post: { tags: [Reports & Moderation], summary: "Freeze one of the conversation's people (counted like any freeze; the fifth deletes the account). The conversation's reports close as actioned.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: user, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '403': { description: Locked }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/my-case/objection:
    post: { tags: [Reports & Moderation], summary: "A FROZEN account objects in writing (body `objection`, 10–2000 chars) to a deletion the moderators' panel approved, during its grace period (`bim.moderation.deletion_grace_days`, 3). Once only. The proposal goes back to the panel for a second round; the account stays frozen meanwhile and nothing is deleted before they decide. Reachable while frozen. `GET /moderation/my-case` carries `data.deletion` = `{state: review|scheduled, execute_after, can_object, objected}` or null.", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/deletion-proposals:
    get: { tags: [Reports & Moderation], summary: "Deletions waiting for the moderators' panel (the fifth recent freeze of an account): `{items:[{id, round, account, freezes[{reason,at}], objection, approvals, rejections, approvals_needed, rejections_needed, my_vote, can_vote}]}`. Votes carry no moderator names. Moderators only.", responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /moderation/deletion-proposals/{id}/vote:
    post: { tags: [Reports & Moderation], summary: "Vote on a deletion proposal, body `{vote: approve|reject, note?}`. `bim.moderation.deletion_approvals` (3) approvals approve it — the account is told, stays frozen, and is deleted (balance and guarantee confiscated, banned) after `deletion_grace_days` unless it objects (a scheduled `moderation:execute-deletions` runs it); `deletion_rejections` (2) cancel it. One vote per moderator per round; the freezing moderator's approval is already counted; the account itself cannot vote.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/account/{id}/chat:
    post: { tags: [Reports & Moderation], summary: "Open the moderators' chat with a REPORTED ACCOUNT, to learn what the report is about (needs the claim). The account is told. Returns `{case_id}`; the chat is `/operation-chats/moderation/{case_id}` (only the account and this moderator).", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/account/{id}/freeze:
    post: { tags: [Reports & Moderation], summary: "Freeze the reported account for `bim.moderation.freeze_days` (3). Each freeze is recorded with its reason (optional body `reason`, default: what the reports said) and counted only while it is recent (`bim.moderation.freeze_window_months`, 12); the count is `freeze_count` on `GET /auth/me` next to `freezes_to_delete`, and the freeze screen warns with it. The FIFTH recent freeze (`bim.moderation.freezes_to_delete`) still freezes but deletes NOTHING: it files a deletion PROPOSAL (`pending_deletion: true`) that a panel of moderators votes on (`/moderation/deletion-proposals`). Returns `{case_id, frozen_until, freeze_count, deleted, pending_deletion, confiscated}`. A frozen account is also hidden from every public list, profile and listing while the freeze lasts. The reports close as actioned. A frozen account gets 423 `account_frozen` on every route except `/auth/*`, `/operation-chats/moderation/*` and `/moderation/my-case`, so it can only talk to the moderators and sign out; it works again by itself afterwards.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/account/{id}/unfreeze:
    post: { tags: [Reports & Moderation], summary: "Lift the freeze early and close the case.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/my-case:
    get: { tags: [Reports & Moderation], summary: "For a reported account: its open case `{id, status, frozen_until}` — the id of the chat with the moderators (`/operation-chats/moderation/{id}`) — or null. Reachable while the account is frozen.", responses: { '200': { description: OK } } }
  /moderation/reports:
    get: { tags: [Reports & Moderation], summary: "The moderator's queue — ONE row per reported item, most-reported first: `{type, id, reports, last_reported_at, reasons: [{key,name,count}], details, state: live|hidden|gone, title, excerpt, image, author, price?}`. Open rows add `handler {id,name}`, `claimed_by_me`, `locked` (another moderator is dealing with it); handled rows add `handled_by` (name). `scope=open` (default) or `handled`; `type=` narrows. 404 for an account that is not a moderator.", parameters: [{ name: scope, in: query, schema: { type: string, enum: [open, handled] } }, { name: type, in: query, schema: { type: string, enum: [post, comment, owner_listing, account, conversation] } }, { name: per_page, in: query, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /moderation/reports/{type}/{id}/claim:
    post: { tags: [Reports & Moderation], summary: "«أفتح البلاغ وأتعامل معه»: records this moderator as the one dealing with the report; no other moderator may claim, dismiss or remove it until he closes it or releases it (a claim untouched for `bim.moderation.claim_minutes` lapses). 422 `claim` names who has it.", parameters: [{ name: type, in: path, required: true, schema: { type: string, enum: [post, comment, owner_listing, account, conversation] } }, { name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/{type}/{id}/release:
    post: { tags: [Reports & Moderation], summary: "Let the report go without closing it — free for any moderator again. Only the one holding it may.", parameters: [{ name: type, in: path, required: true, schema: { type: string, enum: [post, comment, owner_listing, account, conversation] } }, { name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/{type}/{id}/dismiss:
    post: { tags: [Reports & Moderation], summary: "Not a problem after all: the reports are closed and a hidden listing comes back.", parameters: [{ name: type, in: path, required: true, schema: { type: string, enum: [post, comment, owner_listing, account, conversation] } }, { name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /moderation/reports/{type}/{id}/remove:
    post: { tags: [Reports & Moderation], summary: "Remove the reported item: a post is hidden (reversible), a comment is hidden, a listing is deleted with its photos and chats. The reports are closed as actioned. For a LISTING `violation` (a key of GET /moderation/violations) is required and the stake behind it — a held deposit, or the frozen guarantee — is CONFISCATED unless `confiscate: false`; the owner is told the rule and the sum. Returns `{confiscated}`.", parameters: [{ name: type, in: path, required: true, schema: { type: string, enum: [post, comment, owner_listing, account, conversation] } }, { name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /moderation/reports/{type}/{id}/restore:
    post: { tags: [Reports & Moderation], summary: "Bring a hidden post back up (posts only).", parameters: [{ name: type, in: path, required: true, schema: { type: string, enum: [post, comment, owner_listing, account, conversation] } }, { name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/training-plans/{plan}/renew:
    post: { tags: [Training], summary: "Another paid month: the control-panel fee of each service the plan uses (workout / meals, per side) is taken again and the plan is back in front of the client. Editing a plan whose month ran out renews it the same way. 422 `balance` when a side cannot pay; 422 for a finished, cancelled or declined plan.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /empty-returns/quote:
    get: { tags: [Service Requests], summary: "«راجع فاضي»: the reference fare of a ride and the price a return starts from (half of it, the driver changes it) — {origin_city_id, destination_city_id, distance_km?} → {known, needs_distance, distance_km, reference_price, suggested_price}.", parameters: [{ name: origin_city_id, in: query, required: true, schema: { type: integer } }, { name: destination_city_id, in: query, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /empty-returns:
    get: { tags: [Service Requests], summary: "«راجع فاضي»: the limousine drivers going back empty on the governorate pair of the two cities, still ahead and not yet booked — exact city pair first, then the cheaper, then the more trusted. Each `{id, driver, origin, destination, departs_at (UTC instant), price, reference_price, saving_percent, seats, remaining, exact_match, trust}`. Booking one is the ordinary `POST /schedules/{id}/reserve` (units 1: the whole car).", parameters: [{ name: origin_city_id, in: query, required: true, schema: { type: integer } }, { name: destination_city_id, in: query, required: true, schema: { type: integer } }, { name: date, in: query, schema: { type: string, format: date } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/empty-returns:
    get: { tags: [Service Requests], summary: "The driver's own «راجع فاضي» offers, newest first.", responses: { '200': { description: OK } } }
    post: { tags: [Service Requests], summary: "A limousine driver publishes the way home — {origin_city_id, destination_city_id, departs_at (within 72 h), price (never above the reference fare), seats?, distance_km?, notes?, vehicle_label?}. It is one trip leg (mode limousine, capacity 1 ride, is_return_leg) so reservation, deposit, attendance, rating and disputes are the trip ones. 422 for any other trade.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/empty-returns/suggestions:
    get: { tags: [Service Requests], summary: "The way back of the driver's OWN rides (accepted/in progress/just completed, from a customer's ride request): `{booking_id, ride_starts_at, from (where he drops the customer), to (where he picked him up), distance_km, reference_price, suggested_price, suggested_departs_at, passengers}` — what the app prefills «راجع فاضي» with. A ride that already has a way back published is not listed. `POST /business/empty-returns` takes `from_booking_id` to link the offer to its ride (one way back per ride).", responses: { '200': { description: OK } } }
  /business/empty-returns/{id}:
    delete: { tags: [Service Requests], summary: "Take the offer down — refused (422) while a customer holds a reservation on it.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/service-requests:
    get: { tags: [Service Requests], summary: "The open requests this business may answer (its trade, its governorate), with its own offer on each and how many offers there are — never another business's price, and only the customer's first name.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/service-requests/availability:
    get: { tags: [Service Requests], summary: "«استراحة»: `{available}` — is this business taking customers' requests (a limousine driver, a showroom)?", responses: { '200': { description: OK } } }
    put: { tags: [Service Requests], summary: "Pause or resume the requests — {available: bool}. Paused: no new request is sent to the business, it cannot answer one (422) and a limousine driver's «راجع فاضي» offers are not shown or published until he is back.", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/service-requests/kinds:
    get: { tags: [Service Requests], summary: "The kinds of request this business's trade may answer (ride for a limousine driver, car_wanted for a showroom or a private seller) - empty for any other trade, so the app shows the requests tile only to those who have something to answer", responses: { '200': { description: OK } } }
  /business/service-requests/{id}/offers:
    post: { tags: [Service Requests], summary: "Answer a request with {price} or {accepts_budget:true} (the customer's own price), plus message? and eta_minutes?, and menu_item_id? (one of the business's own listings, shown to the customer beside the price). One live offer per business: answering again replaces it.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Service Requests], summary: "Take the offer back.", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/by-business:
    post: { tags: [Bookings], summary: "«جاء عميل بدون حجز»: the business books a customer who is standing there — the same body as `POST /bookings` plus {guest_name?, guest_phone?, guest_email?, client_id?}. An account (client_id, or found by phone/e-mail) gets the booking on his own account (accepted at once, he is told, he confirms attendance first); no account → a named guest (guest_name required): the business's own account stands in, `guest` carries the name/phone, his side of the attendance is automatic, and he is never counted or rated. Day closure does not stop the business's own walk-in.", responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /bookings/customer-lookup:
    get: { tags: [Bookings], summary: "?phone= or ?email=: does it belong to an account, and how many dealings (bookings, orders, clinic visits) has that customer already completed with THIS business — {found, customer:{id,name}, previous_dealings}. Rate-limited.", parameters: [{ name: phone, in: query, schema: { type: string } }, { name: email, in: query, schema: { type: string } }], responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /discovery/appointments/{business}/chairs:
    get: { tags: [Discovery], summary: "The active chairs of a business with the person at each (public) — `{id, name, person_name, photo}`; what a customer picks from («احجز مع أحمد»). Empty = the business has one line.", security: [], parameters: [{ name: business, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/chairs:
    get: { tags: [Bookings], summary: "The business's own chairs (active or not).", responses: { '200': { description: OK } } }
    post: { tags: [Bookings], summary: 'Add a chair — multipart: name?, person_name? (one of the two), photo?.', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/chairs/staff:
    get: { tags: [Bookings], summary: "The staff the business may seat at a chair: accepted, active members `{user_id, name, photo, title}` — a customer account taken on as staff shows its own photo and name on the chair.", responses: { '200': { description: OK } } }
  /business/chairs/{chair}:
    post: { tags: [Bookings], summary: 'Change a chair — multipart (a file cannot ride a PUT): the fields sent change; `remove_photo`, `is_active`.', parameters: [{ name: chair, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Bookings], summary: 'Remove a chair; one that ever held a booking is closed instead (`closed: true`).', parameters: [{ name: chair, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/queue:
    get: { tags: [Bookings], summary: "«نداء الدور التالي»: the day's live bookings (pending, accepted, in progress) by chair then time — `{date, flow, chairs, served, items: [{id, turn, status, called_at, starts_at, chair_id, customer, title}]}`; ?date= (today by default). `mine=1` is «كرسيي»: only the chairs the caller sits at. A staff member who sits at a chair gets only that chair's line always, with no capability needed (the chair is the grant); other staff need `bookings`.", parameters: [{ name: date, in: query, schema: { type: string, format: date } }, { name: mine, in: query, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /business/queue/walk-in:
    post: { tags: [Bookings], summary: "«جاء عميل بدون حجز»: the staff add a turn for a customer with no account — {name, phone?, offering_id, chair_id?}. He joins the end of the line (the chosen chair's, or the one that can take him soonest) with no notice period; the turn is accepted at once and is not charged through the wallets. 422 when the day is full or closed.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/queue/{booking}/start:
    post: { tags: [Bookings], summary: "The customer sits down — a walk-in turn goes in progress by itself; an online booking goes through the booking engine start.", parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not a booking of this business }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/queue/{booking}/finish:
    post: { tags: [Bookings], summary: "The service is done — a walk-in turn completes by itself; an online booking goes through the engine complete.", parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not a booking of this business }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/queue/{booking}/call:
    post: { tags: [Bookings], summary: "Call a turn: the customer is told it is their turn (`called_at` set). A booking still pending is accepted by the call. Starting and finishing go through the existing start/complete.", parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not this business's booking }, '422': { $ref: '#/components/responses/Validation' } } }
  /discovery/retail/filters:
    get: { tags: [Discovery], summary: 'Retail filters (public). open_now=1 narrows every facet count to shops open now.', security: [], parameters: [{ name: open_now, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /discovery/retail/products:
    get: { tags: [Discovery], summary: 'Browse retail products (public). open_now=1 keeps only products an open shop currently sells.', security: [], parameters: [{ name: open_now, in: query, required: false, schema: { type: boolean } }], responses: { '200': { description: OK } } }
  /discovery/retail/products/{product}:
    get: { tags: [Discovery], summary: Retail product + its offers (public), security: [], parameters: [{ name: product, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }

  # ─────────────────────── Offers (Discovery) ───────────────────────
  /jobs:
    get: { tags: [Jobs], summary: Browse open jobs — filterable by category_id/category_child_id (public), security: [], responses: { '200': { description: OK } } }
    post:
      tags: [Jobs]
      summary: A business posts a vacancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, body]
              description: 'Send job_title_id (from GET /jobs/titles) or a free-text title — at least one.'
              properties:
                category_id: { type: integer }
                category_child_id: { type: integer, description: Must belong to category_id. }
                job_title_id: { type: integer, description: 'A title from GET /jobs/titles for this field; fills title when none is typed.' }
                title: { type: string, maxLength: 191, description: 'The job title, in whichever language the business writes it.' }
                body: { type: string, description: The job description. }
                requirements: { type: string }
                salary: { type: string, description: 'Free text on purpose — often "يحدد بعد المقابلة", not a number.' }
                interview_starts_at: { type: string, format: date-time }
                expire_at: { type: string, format: date-time, description: When the ad itself closes. }
      responses:
        '201': { description: Created }
        '403': { description: Not a business account }
        '422': { $ref: '#/components/responses/Validation' }
  /jobs/titles:
    get: { tags: [Jobs], summary: The closed job-title list a business picks from (that field's titles + its root's + the general ones; each with its open-jobs count) (public), security: [], parameters: [ { in: query, name: category_id, schema: { type: integer } }, { in: query, name: category_child_id, schema: { type: integer } } ], responses: { '200': { description: OK } } }
  /jobs/categories:
    get: { tags: [Jobs], summary: Category/specialty tree — only branches with an open job, with a count each (public), security: [], responses: { '200': { description: OK } } }
  /deposits:
    get:
      tags: [Deposits]
      summary: Escrow deposits this account is a party to
      description: 'No filter can widen the scope beyond the caller.'
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [frozen, in_progress, released, refunded, split] } }
        - { in: query, name: role, schema: { type: string, enum: [client, business] } }
        - { in: query, name: per_page, schema: { type: integer, maximum: 50 } }
      responses:
        '200': { description: OK }
  /deposits/{deposit}:
    get:
      tags: [Deposits]
      summary: One deposit, if you are a party to it
      description: '404 rather than 403 for a non-party, so ids cannot be probed.'
      parameters:
        - { in: path, name: deposit, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
  /disputes/reason-codes:
    get:
      tags: [Disputes]
      summary: The reason codes a dispute may be opened with
      description: 'A controlled vocabulary, so the app can show a localized picker and cases can be grouped by what went wrong.'
      responses:
        '200': { description: OK }
  /disputes:
    get:
      tags: [Disputes]
      summary: Disputes this account is a party to
      description: 'No filter can widen the scope beyond the caller.'
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, mutual_resolution, under_review, resolved, closed, cancelled, expired] } }
        - { in: query, name: role, schema: { type: string, enum: [opener, respondent] } }
        - { in: query, name: per_page, schema: { type: integer, maximum: 50 } }
      responses:
        '200': { description: OK }
  /disputes/{dispute}:
    get:
      tags: [Disputes]
      summary: One dispute, if you are a party to it
      description: 'Internal meta and the admin resolution notes are never returned; a split ruling exposes only its percentages.'
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
  /bookings/{booking}/disputes:
    post:
      tags: [Disputes]
      summary: Open a dispute on a booking
      description: >-
        Only the booking's client or business may open one; anyone else gets 404 so
        ids cannot be probed. Returns 200 rather than 201 because an already-open
        dispute over the same booking is returned instead of a second one being
        created. Ruling is admin-only and deliberately absent here.
      parameters:
        - { in: path, name: booking, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [not_delivered, not_as_described, quality, late, cancelled_by_business, no_show, overcharged, damage, other] }
                reason_text: { type: string, maxLength: 2000 }
      responses:
        '200': { description: 'Opened, or the existing live dispute' }
        '404': { description: 'Not found, or you are not a party to the booking' }
        '422': { $ref: '#/components/responses/Validation' }
  /orders/{order}/disputes:
    post:
      tags: [Disputes]
      summary: Open a dispute on a menu order
      description: >-
        The order counterpart of the booking dispute door. Only the order's
        customer or business may open one; anyone else gets 404. A menu order
        carries no escrow deposit, so it enters the mutual-settlement /
        arbitration flow directly. Opening records an OUTCOME_DISPUTED rating
        event against both parties (idempotent per order) and notifies the
        respondent. Returns the existing live dispute if one is already open.
      parameters:
        - { in: path, name: order, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [not_delivered, not_as_described, quality, late, cancelled_by_business, no_show, overcharged, damage, other] }
                reason_text: { type: string, maxLength: 2000 }
      responses:
        '200': { description: 'Opened, or the existing live dispute' }
        '404': { description: 'Not found, or you are not a party to the order' }
        '422': { $ref: '#/components/responses/Validation' }
  /schedules/reservations/{reservation}/disputes:
    post:
      tags: [Disputes]
      summary: Open a dispute on a trip reservation
      description: >-
        The schedules-service dispute door, matching the booking and order ones.
        Only the reservation's client or business may open one; anyone else gets
        404. A trip reservation carries no escrow deposit, so it enters the
        mutual-settlement / arbitration flow directly. Opening records an
        OUTCOME_DISPUTED rating event against both parties (idempotent per
        reservation) and notifies the respondent. Returns the existing live
        dispute if one is already open.
      parameters:
        - { in: path, name: reservation, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [not_delivered, not_as_described, quality, late, cancelled_by_business, no_show, overcharged, damage, other] }
                reason_text: { type: string, maxLength: 2000 }
      responses:
        '200': { description: 'Opened, or the existing live dispute' }
        '404': { description: 'Not found, or you are not a party to the reservation' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/cooperate:
    post:
      tags: [Disputes]
      summary: Declare that you are engaging with the settlement
      description: >-
        Idempotent — the timestamp records when you FIRST showed up and is not
        moved by declaring again. Its absence is what matters: when the
        settlement window expires, whoever never declared is flagged for the
        arbitrator to weigh. The flag is a mark, never an automatic charge.
        Responds with `my_side` (client|business), read from the booking rather
        than from who opened the case.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/closure-confirmation:
    post:
      tags: [Disputes]
      summary: Agree to delete a finished dispute's conversation
      description: >-
        Only on a CLOSED dispute, and only with BOTH parties confirming: the
        first tap is a request the other side is shown, the second erases the
        conversation for good. The dispute number, both parties and the ruling
        are kept — only the messages, seats and conduct violations go. A purged
        room's GET returns `meta.thread.purged: true` and is never rebuilt.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /me/dispute-obligations:
    get:
      tags: [Disputes]
      summary: What a ruling decided I owe (and am owed), and whether I'm blocked
      description: >-
        `owed_by_me` are the pending debts that block me from new operations;
        `owed_to_me` is incoming compensation still awaiting the payer. `blocked`
        and `outstanding` summarise the block.
      responses:
        '200': { description: OK }
  /me/dispute-obligations/settle:
    post:
      tags: [Disputes]
      summary: Pay my pending dispute debts from my wallet now (lifts the block)
      description: >-
        Settles as much as the wallet covers. Needed because a top-up made inside
        the grace window would otherwise not clear the block until the scheduled
        sweep runs after the deadline. Not behind the block middleware.
      responses:
        '200': { description: 'OK (returns settled/still_pending/outstanding/blocked)' }
  /disputes/{dispute}/settlement:
    post:
      tags: [Disputes]
      summary: Mark the dispute as settled between the parties
      description: >-
        Takes effect only when BOTH sides have pressed it — an agreement one
        party declares alone is not an agreement. The first tap is a proposal
        the other party is notified about and asked to confirm; the second
        resolves the dispute as `mutual_settlement` and unwinds the escrow, each
        hold returning to whoever posted it. Allowed right up to a ruling,
        including once an arbitrator is involved: an agreement the parties
        reached themselves beats a decision imposed on them. Idempotent.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Disputes]
      summary: Withdraw your agreement
      description: >-
        Open until the second tap lands, so a mis-tap does not become a
        settlement the moment the other side agrees. Refused once the dispute
        has been resolved.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/settlement-payments:
    get:
      tags: [Disputes]
      summary: The off-app settlement proposals on this dispute
      description: >-
        `current` is the one on the table (proposed or accepted); `history` keeps
        every figure including the refused ones, because the haggling is part of
        what an arbitrator needs to read.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
    post:
      tags: [Disputes]
      summary: Propose an amount settled outside the platform
      description: >-
        The platform never touches this money and cannot verify a transfer, so
        it records the statements about it instead. Only one proposal may be
        live at a time — accept or reject the current one first.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payer_side, amount]
              properties:
                payer_side: { type: string, enum: [client, business], description: 'Who hands over the money; the other side is the payee.' }
                amount: { type: number, minimum: 0.01 }
                method: { type: string, maxLength: 40 }
                note: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Created }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/settlement-payments/{settlement}:
    delete:
      tags: [Disputes]
      summary: Withdraw your own proposal
      description: 'Only the proposer, and only while it is still unaccepted.'
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
        - { in: path, name: settlement, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or not part of this dispute' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/settlement-payments/{settlement}/accept:
    post:
      tags: [Disputes]
      summary: Accept the proposed amount
      description: 'The OTHER side only — the proposer already agreed by proposing.'
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
        - { in: path, name: settlement, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or not part of this dispute' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/settlement-payments/{settlement}/reject:
    post:
      tags: [Disputes]
      summary: Reject the proposed amount
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
        - { in: path, name: settlement, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or not part of this dispute' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/settlement-payments/{settlement}/received:
    post:
      tags: [Disputes]
      summary: Confirm the money actually arrived
      description: >-
        The PAYEE only — a payer confirming their own payment proves nothing.
        This is the statement that closes the dispute: it resolves as
        `mutual_settlement` and the escrow unwinds, each hold returning to
        whoever posted it. The off-app amount itself never touches a wallet.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
        - { in: path, name: settlement, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Received; the dispute is now resolved' }
        '404': { description: 'Not found, or not part of this dispute' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/request-arbitration:
    post:
      tags: [Disputes]
      summary: Ask for an arbitrator without waiting out the settlement window
      description: >-
        ONE party is enough — requiring both to agree would let a stonewaller
        block arbitration forever, which is the exact situation it exists for.
        The asker must hold the session fee in their wallet (see
        `arbitration.fee` on GET /disputes/{dispute}); the RESPONDENT's balance
        is deliberately not checked, or emptying a wallet would block every
        request. Escalation by deadline is never gated on any balance.
        The asker must have declared cooperation first: you have to show up
        before you can demand a judge, and that also stops a dispute being
        opened and escalated in the same breath. Unlike expiry, this does NOT
        flag the other party as uncooperative — the window is still open.
        Idempotent once the dispute is already under review.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Now under review' }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/room:
    get:
      tags: [Disputes]
      summary: The conversation on this dispute
      description: >-
        Opens with the dispute, so the settlement window has somewhere to happen.
        An arbitrator takes a third seat in the same thread once the window
        expires. Reading it marks it read. `meta.thread` carries the status, the
        lock and the seat list.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
  /disputes/{dispute}/room/conduct:
    get:
      tags: [Disputes]
      summary: The conduct rules, and whether you have accepted them
      description: >-
        Must be shown and explicitly accepted before the composer is opened.
        What a party consents to is that the arbitrator may rule against them,
        and fine them, for HOW they behave here — separately from who is right
        about the booking. `version` is stored with the acceptance: a rewritten
        charter is a different promise, so bumping it invalidates earlier
        agreements.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
    post:
      tags: [Disputes]
      summary: Accept the conduct rules
      description: >-
        Required before posting; the room refuses messages from a party who has
        not accepted the current version. Arbitrators are exempt — the clauses
        are about losing the case and being fined, neither of which can happen
        to the person deciding it.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Disputes]
      summary: Refuse the terms
      description: >-
        Recorded rather than inferred from silence — refusing and not having
        opened the app are different facts. The consequence is forfeiting the
        right to argue: the room closes to you and the arbitrator rules on the
        evidence before them. It is NOT an automatic loss. Accepting later
        reverses it.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /disputes/{dispute}/room/messages:
    post:
      tags: [Disputes]
      summary: Post a message into the dispute's room, optionally with evidence files
      description: >-
        Refused once a ruling has sealed the room — the record is evidence.
        `body` is optional when one or more `attachments` are sent (a photo of
        the item can be the whole message), but a post with neither is refused.
        Attachments are images only (jpg, jpeg, png, webp, gif), max 6 per
        message. Use multipart/form-data to include files.
      parameters:
        - { in: path, name: dispute, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
          multipart/form-data:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
                attachments:
                  type: array
                  maxItems: 6
                  items: { type: string, format: binary }
      responses:
        '201': { description: 'Created. The message includes an `attachments` array of { id, url, name, mime, size }.' }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }

  # ──────────────────── Operation chats ────────────────────
  /projects/{project}:
    get:
      tags: [Projects]
      summary: View a project at your granted depth
      description: >-
        Detailed (timeline + camera evidence) for the owner, the contracted
        customer, or an approved detailed follower; the coarse map + completion
        percentages for a summary follower or a public project. No access → 404,
        so a private project stays invisible.
      parameters: [{ in: path, name: project, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you may not see it' }
  /projects/{project}/follow:
    post:
      tags: [Projects]
      summary: Request to follow a project's progress
      description: >-
        Creates a pending follow request; the business approves it and grants an
        access level. Allowed on a public project, for the contracted customer,
        or to re-send an existing request — otherwise 404.
      parameters: [{ in: path, name: project, required: true, schema: { type: integer } }]
      responses:
        '201': { description: Requested }
        '404': { description: 'Not found, or you may not follow it' }
    delete:
      tags: [Projects]
      summary: Stop following a project
      parameters: [{ in: path, name: project, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /training-plans:
    get:
      tags: [Training]
      summary: My training plans as a client
      parameters: [{ name: status, in: query, schema: { type: string, enum: [active, paused, completed, cancelled] } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK } }
  /training-plans/{plan}:
    get:
      tags: [Training]
      summary: Read one of my plans (workout + meals + my progress)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: 'Not found, or not yours' } }
  /training-plans/{plan}/progress:
    post:
      tags: [Training]
      summary: Log a progress check-in (client)
      description: Only while the plan is active; otherwise 422.
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logged_on: { type: string, format: date }
                weight: { type: number }
                notes: { type: string }
      responses: { '201': { description: Logged }, '404': { description: 'Not yours' }, '422': { $ref: '#/components/responses/Validation' } }
  /training-plans/{plan}/weekly-summary:
    get:
      tags: [Training]
      summary: My weekly adherence to a plan (trainee)
      description: >-
        A 7-day window (from a start date, else the current week's Saturday):
        confirmed exercise rounds vs. the weekly target (sum of prescribed sets),
        adherence_percent, active_days, a per-day breakdown, and progress
        check-ins.
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: from, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: OK }, '404': { description: 'Not yours' } }
  /business/training-plans/weekly-summary:
    get:
      tags: [Training]
      summary: Weekly adherence across ALL my clients (trainer)
      description: >-
        One-pass overview: per-client adherence for the 7-day window (defaults to
        active plans; ?status= to override), plus the average adherence.
      parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: status, in: query, schema: { type: string, enum: [active, paused, completed, cancelled] } }]
      responses: { '200': { description: OK } }
  /business/training-plans/{plan}/weekly-summary:
    get:
      tags: [Training]
      summary: A client's weekly adherence to the plan (trainer)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: from, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /training-plans/{plan}/chat:
    get:
      tags: [Training]
      summary: My chat with the trainer (trainee) — text only
      description: Direct text-only chat scoped to the plan. No attachments (meta.thread.attachments_allowed is always false).
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: per_page, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: 'Not yours' } }
  /training-plans/{plan}/chat/messages:
    post:
      tags: [Training]
      summary: Send a text message to my trainer (trainee)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 5000 } } } } } }
      responses: { '201': { description: Sent }, '404': { description: 'Not yours' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/training-plans/{plan}/chat:
    get:
      tags: [Training]
      summary: My chat with the trainee (trainer) — text only
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: per_page, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/training-plans/{plan}/chat/messages:
    post:
      tags: [Training]
      summary: Send a text message to the trainee (trainer; a delegate posts as the business)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 5000 } } } } } }
      responses: { '201': { description: Sent }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /training-plans/{plan}/exercises/{exercise}/complete-round:
    post:
      tags: [Training]
      summary: Confirm one finished round of an exercise (trainee)
      description: >-
        The only per-exercise progress action — the trainee taps "done" after
        each round (set); the round number is assigned server-side. No notes or
        images by design. 422 once every prescribed set is confirmed for the day
        or the plan is not active. Optional for_date (defaults to today).
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { name: exercise, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                for_date: { type: string, format: date }
                reps: { type: integer, minimum: 0, maximum: 1000, description: 'Reps actually done in this set (optional).' }
                weight: { type: number, minimum: 0, maximum: 1000, description: 'Weight used in this set, kg (optional).' }
      responses:
        '201': { description: 'Confirmed. data.round carries the recorded reps/weight; data.session_completed is true only for the call that finished every exercise owed that day (the trainer is told once).' }
        '404': { description: 'Not yours' }
        '422': { $ref: '#/components/responses/Validation' }
  /training-plans/{plan}/exercises/{exercise}/rounds/{round}:
    put:
      tags: [Training]
      summary: Correct the reps/weight of a set I already confirmed (trainee)
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { name: exercise, in: path, required: true, schema: { type: integer } }
        - { name: round, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reps: { type: integer, minimum: 0, maximum: 1000 }
                weight: { type: number, minimum: 0, maximum: 1000 }
      responses:
        '200': { description: OK }
        '404': { description: 'Not yours' }
        '422': { $ref: '#/components/responses/Validation' }
  /training-plans/{plan}/monthly-summary:
    get:
      tags: [Training]
      summary: My month on this plan (trainee)
      description: 'Rolled up from the confirmed sets: finished days, totals, volume (reps x weight where both were recorded), each exercise best/total, the month weight check-ins and the trainer body report. month=YYYY-MM, default this month.'
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { in: query, name: month, schema: { type: string, example: '2026-09' } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not yours' }
  /business/training-plans/{plan}/monthly-summary:
    get:
      tags: [Training]
      summary: A client's month on a plan I own (trainer)
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { in: query, name: month, schema: { type: string, example: '2026-09' } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not your plan' }
  /business/training-plans/{plan}/log:
    get:
      tags: [Training]
      summary: One day's sets per exercise next to the prescription (trainer)
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { in: query, name: date, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not your plan' }
  /business/training/photos:
    get:
      tags: [Training]
      summary: My private photo library, reusable across clients (trainer)
      responses:
        '200': { description: OK }
        '403': { description: Not a training-capable business }
    post:
      tags: [Training]
      summary: Add photos to my library (trainer)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images: { type: array, items: { type: string, format: binary } }
