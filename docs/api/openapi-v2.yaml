                      day_of_week: { type: integer, minimum: 0, maximum: 6 }
                      sets: { type: integer }
                      reps: { type: string }
                      rest_seconds: { type: integer }
                      notes: { type: string }
                meals:
                  type: array
                  items:
                    type: object
                    required: [meal_type, name]
                    properties:
                      meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
                      name: { type: string }
                      calories: { type: integer }
                      notes: { type: string }
      responses: { '201': { description: Created }, '403': { description: 'Not a business account' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/training-plans/{plan}:
    get:
      tags: [Training]
      summary: A plan I own, in full (trainer)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Training]
      summary: Update a plan's header/status (trainer)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
    patch:
      tags: [Training]
      summary: Update a plan (alias of PUT)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /plan-photos/{image}:
    get:
      tags: [Training]
      summary: A training-plan photo from private storage
      description: 'No login: the signed, time-limited link in the plan payload is the credential. 403 when the signature is missing, tampered or expired.'
      security: []
      parameters:
        - { in: path, name: image, required: true, schema: { type: integer } }
      responses:
        '200': { description: The image }
        '403': { description: 'Missing, tampered or expired signature' }
        '404': { description: Not a plan photo }
  /business/training/exercise-library:
    post: { tags: [Training], summary: 'Add MY OWN exercise to the library (visible to me alone): category, name, optional kind (default rehab), equipment, default sets/reps and instructions.', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
    get: { tags: [Training], summary: The exercise catalogue a trainer picks from (sections, kinds, equipment and exercises; filter by category_id/kind/equipment/q), parameters: [ { in: query, name: category_id, schema: { type: integer } }, { in: query, name: kind, schema: { type: string } }, { in: query, name: equipment, schema: { type: string } }, { in: query, name: q, schema: { type: string } } ], responses: { '200': { description: OK }, '403': { description: Not a training-capable business } } }
  /business/training/exercise-library/{exercise}:
    put: { tags: [Training], summary: 'Correct one of MY OWN library exercises (the shared catalogue is read-only). An edit that does not name a kind keeps it.', parameters: [{ name: exercise, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not your exercise' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Training], summary: 'Delete one of MY OWN library exercises; plans that already use it keep their copy.', parameters: [{ name: exercise, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not your exercise' } } }
  /business/training/food-library:
    get: { tags: [Training], summary: 'The food catalogue («جدول التغذية») a nutrition specialist picks a meal from — the shared catalogue plus MY OWN foods (`mine`); each food carries its serving, calories, protein, carbs and fat for THAT serving. Filter by category_id/q.', parameters: [ { in: query, name: category_id, schema: { type: integer } }, { in: query, name: q, schema: { type: string } } ], responses: { '200': { description: OK }, '403': { description: Not a training-capable business } } }
    post: { tags: [Training], summary: 'Add MY OWN food (visible to me alone): category, name, serving label, calories and optional macros.', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/training/food-library/{food}:
    put: { tags: [Training], summary: 'Correct one of MY OWN foods (the shared catalogue is read-only).', parameters: [{ name: food, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not your food' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Training], summary: 'Delete one of MY OWN foods; plans that already use it keep their meal.', parameters: [{ name: food, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not your food' } } }
  /business/training-plans/{plan}/exercises:
    post:
      tags: [Training]
      summary: Add a workout exercise (trainer)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/training-plans/{plan}/exercises/{exercise}:
    patch:
      tags: [Training]
      summary: Change one exercise - prescription, per-set weights, how they climb (trainer)
      description: 'Only the fields sent change; an explicit null clears one. set_weights is the base weight per set (max 12); progress_every_weeks and progress_increment_kg add that many kg at each block of weeks. day_label names the training day (Push, Pull, Legs).'
      parameters:
        - { name: plan, in: path, required: true, schema: { type: integer } }
        - { name: exercise, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                day_of_week: { type: integer, minimum: 0, maximum: 6 }
                day_label: { type: string, maxLength: 40 }
                sets: { type: integer }
                reps: { type: string }
                target_weight: { type: number }
                set_weights: { type: array, maxItems: 12, items: { type: number } }
                progress_every_weeks: { type: integer, minimum: 1, maximum: 26 }
                progress_increment_kg: { type: number, minimum: 0, maximum: 100 }
      responses:
        '200': { description: OK }
        '404': { description: 'Not your plan or exercise' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Training]
      summary: Remove an exercise (trainer)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: exercise, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/training-plans/{plan}/body-reports:
    get: { tags: [Training], summary: 'The monthly body series for one plan, newest first. Each month carries a `change` object holding the signed delta from the month before, so a client is never left doing arithmetic on two cards.', parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not your plan' } } }
    post: { tags: [Training], summary: 'Record the month: weight_kg, muscle_mass_kg, fat_percent, water_percent, plus optional bone_mass_kg and visceral_fat. TRAINER ONLY — he owns the scale, and the client side has no write verb on this URI at all. ONE row per plan per month: a second reading in the same month UPDATES it. At least one measurement is required, and fat_percent + water_percent may not exceed 100.', parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '200': { description: 'Updated an existing month' }, '422': { description: 'No measurement, or impossible percentages' } } }
  /business/training-plans/{plan}/body-reports/{report}:
    delete: { tags: [Training], summary: 'Remove one month from the series.', parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: report, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /training-plans/{plan}/body-reports:
    get: { tags: [Training], summary: "My own monthly body series, read-only — the trainer records it. Deleting the plan deletes the reports with it.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not your plan' } } }
  /business/training-plans/{plan}/showcase:
    get: { tags: [Training], summary: "The state of this plan's «نتائج موثَّقة» request (null when never asked).", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    post: { tags: [Training], summary: "Ask the client to let the plan's results be shown as a post: body `{public_title, note?}`. Needs an accepted (active/completed) plan with exercises or meals. Anonymous, never photos. Optional `consent_mode`: `once` (default: ONE approval covers the whole programme and the post updates from the trainer's body reports) or `each` (the client approves every month, asked again at each renewal). Nothing is published before the client approves; on approve he may send `consent_mode: each` to make it stricter.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Training], summary: "The trainer takes the post down (or cancels the request).", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /training-plans/{plan}/showcase/approve:
    post: { tags: [Training], summary: "The client approves showing the plan's results: one approval for the whole programme (anonymous changes only, no photos). He can take it down any time.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /training-plans/{plan}/showcase/decline:
    post: { tags: [Training], summary: "The client declines; body `{note}` optional. The trainer may ask again.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /training-plans/{plan}/showcase/withdraw:
    post: { tags: [Training], summary: "The client takes the post down.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /training-plans/{plan}/showcase/months/{month}/approve:
    post: { tags: [Training], summary: "Month-by-month mode (`consent_mode: each`): the client lets that month's results be shown. A renewal of the paid month opens the new month's question.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: month, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /training-plans/{plan}/showcase/months/{month}/decline:
    post: { tags: [Training], summary: "The client does not let that month's results be shown.", parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: month, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/training-plans/{plan}/exercises/{exercise}/images:
    post: { tags: [Training], summary: 'Attach illustrative photos to one exercise (multipart images[], max 6). TRAINER ONLY — the client side has no route that writes an image, which is the enforcement: the pictures show the machine, the grip, the position, and go one way. Deleting the exercise deletes them, rows and files.', parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: exercise, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: 'Not your plan, or no such exercise' }, '422': { description: 'Not an image, or the 6-photo cap is reached' } } }
  /business/training-plans/{plan}/exercises/{exercise}/images/{image}:
    delete: { tags: [Training], summary: 'Remove one exercise photo — the row and the FILE.', parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: exercise, in: path, required: true, schema: { type: integer } }, { name: image, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not found' } } }
  /business/training-plans/{plan}/meals/{meal}/images:
    post: { tags: [Training], summary: 'Attach photos to one meal (multipart images[], max 6). Trainer only, same rule as the exercise gallery.', parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: meal, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '422': { description: 'Not an image, or the cap is reached' } } }
  /business/training-plans/{plan}/meals/{meal}/images/{image}:
    delete: { tags: [Training], summary: 'Remove one meal photo — the row and the FILE.', parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: meal, in: path, required: true, schema: { type: integer } }, { name: image, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not found' } } }
  /business/training-plans/{plan}/meals:
    post:
      tags: [Training]
      summary: Add a meal (trainer)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
      responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/training-plans/{plan}/meals/{meal}:
    delete:
      tags: [Training]
      summary: Remove a meal (trainer)
      parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }, { name: meal, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /clinic-appointments:
    get:
      tags: [Clinic Appointments]
      summary: My appointments (patient)
      parameters: [{ name: status, in: query, schema: { type: string, enum: [requested, confirmed, completed, cancelled, no_show] } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK } }
    post:
      tags: [Clinic Appointments]
      summary: Request an appointment at a clinic (patient)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinic_id, scheduled_at]
              properties:
                clinic_id: { type: integer }
                scheduled_at: { type: string, format: date-time, description: 'Must be in the future' }
                duration_minutes: { type: integer, minimum: 5, maximum: 480, default: 30 }
                reason: { type: string }
      responses: { '201': { description: Requested }, '422': { $ref: '#/components/responses/Validation' } }
  /clinic-appointments/{appointment}:
    get:
      tags: [Clinic Appointments]
      summary: Read an appointment (a party only)
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: 'Not found, or you are not a party' } }
  /clinic-appointments/{appointment}/cancel:
    post:
      tags: [Clinic Appointments]
      summary: Cancel my appointment (patient)
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Cancelled }, '404': { description: 'Not yours' }, '422': { $ref: '#/components/responses/Validation' } }
  /clinic-appointments/{appointment}/reschedule:
    post:
      tags: [Clinic Appointments]
      summary: Reschedule my appointment to a new time (patient)
      description: A confirmed appointment stays confirmed if the new time is free (overlap-guarded); a requested one just moves. The clinic is notified and any linked slot is freed.
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at: { type: string, format: date-time }
                duration_minutes: { type: integer }
      responses: { '200': { description: Rescheduled }, '404': { description: 'Not yours' }, '422': { $ref: '#/components/responses/Validation' } }
  /clinic-appointments/{appointment}/checkin-token:
    get:
      tags: [Clinic Appointments]
      summary: My own check-in code for this appointment («كل مريض له QR خاص بحجزه») — render it as a QR for the clinic to scan on arrival
      description: Stable across repeat calls (issued once). Only while the appointment is confirmed.
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: 'Not yours' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments:
    get:
      tags: [Clinic Appointments]
      summary: The clinic's appointment queue/calendar
      parameters: [{ name: status, in: query, schema: { type: string } }, { name: date, in: query, schema: { type: string, format: date } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK } }
    post:
      tags: [Clinic Appointments]
      summary: Clinic books an appointment directly (confirmed; overlap-guarded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, scheduled_at]
              properties:
                patient_id: { type: integer }
                scheduled_at: { type: string, format: date-time }
                duration_minutes: { type: integer }
                reason: { type: string }
      responses: { '201': { description: Booked }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/{appointment}/confirm:
    post:
      tags: [Clinic Appointments]
      summary: Confirm a requested appointment (overlap-guarded; notifies the patient)
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/{appointment}/reject:
    post:
      tags: [Clinic Appointments]
      summary: Reject/cancel an appointment (clinic)
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/{appointment}/complete:
    post:
      tags: [Clinic Appointments]
      summary: The doctor's «تم» button — closes this visit AND hands back whoever queues next, tagged with their visit kind
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/walk-in:
    post:
      tags: [Clinic Appointments]
      summary: Secretary adds a patient straight into today's queue — between existing bookings, or standing in for one who hasn't shown (who keeps their own place)
      description: No time slot reserved — joins the queue already checked in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id]
              properties:
                patient_id: { type: integer }
                service_price_id: { type: integer }
                duration_minutes: { type: integer }
                reason: { type: string }
      responses: { '201': { description: Joined the queue }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/queue:
    get:
      tags: [Clinic Appointments]
      summary: Today's waiting patients (checked in, not yet seen), with the automatic-next one flagged
      responses: { '200': { description: OK } }
  /business/clinic-appointments/checkin/{token}:
    post:
      tags: [Clinic Appointments]
      summary: Clinic scans the patient's own QR to check them in
      description: Idempotent — scanning an already-checked-in appointment is a harmless no-op, not an error.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: 'Invalid token, or not this clinic''s' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/{appointment}/call-now:
    post:
      tags: [Clinic Appointments]
      summary: Secretary calls a specific waiting patient ahead of the automatic pattern («تقدر تدخل غيره لحد ما يحضر»)
      description: The one skipped keeps their place untouched — reconsidered normally next time.
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-arrival-qr:
    put: { tags: [Clinic Appointments], summary: "Turn the arrival QR on/off or issue a fresh code. Body {enabled, rotate?}.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    get: { tags: [Clinic Appointments], summary: "The business's OPTIONAL arrival QR: {enabled, token}. The patient scans the token with the platform scanner to be activated in the queue.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /clinic-appointments/arrive:
    post: { tags: [Clinic Appointments], summary: "The patient scanned the clinic's arrival QR (body {code}): his confirmed appointment of today is checked in, which activates his turn. Idempotent; 404 for an unknown / switched-off code, 422 when he has no appointment today.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/booking-day-closure:
    put: { tags: [Clinic Appointments], summary: "{closed, date?}: close new bookings for one date (default today) or reopen — for every dated booking the business takes (clinic appointments → 422 on scheduled_at, unit/appointment bookings → 422 on starts_at). Closing it returns the deposits still held for that day's no-shows. Open to clinic and bookings staff.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    get: { tags: [Clinic Appointments], summary: "The date new bookings are closed for («اكتمل العدد اليوم» — an optional button, never automatic).", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/clinic-appointments/{appointment}/no-show:
    post:
      tags: [Clinic Appointments]
      summary: Mark a no-show (clinic)
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/{appointment}/reschedule:
    post:
      tags: [Clinic Appointments]
      summary: Reschedule an appointment to a new time (clinic; notifies the patient)
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at: { type: string, format: date-time }
                duration_minutes: { type: integer }
      responses: { '200': { description: Rescheduled }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/{appointment}/patient-record:
    get:
      tags: [Clinic Appointments]
      summary: What to open when the patient walks in — a blank slate for a first visit, or their latest prescription/report to continue for a returning one
      description: >
        Gated on the `prescriptions` capability (not `clinic`) since it reveals
        diagnosis/medication content — the secretary who manages the calendar
        does not necessarily read this. previous_prescription excludes this
        same appointment's own just-issued prescription, if any.
      parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '403': { description: Missing the prescriptions capability }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/clinic-links:
    get:
      tags: [Clinic Appointments]
      summary: My own clinic-account links — sent/received pending requests, and accepted
      responses: { '200': { description: OK } }
    post:
      tags: [Clinic Appointments]
      summary: Request linking this clinic account with another one as the same doctor (mutual consent)
      description: Both accounts must be individual doctor's-own-clinic accounts. If the other side already requested a link to this one, it is accepted on the spot instead of creating a duplicate pending row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: { type: integer }
      responses: { '201': { description: Created (pending or auto-accepted) }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-links/{link}/accept:
    post:
      tags: [Clinic Appointments]
      summary: The TARGET side accepts a pending link request
      parameters: [{ name: link, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '403': { description: Not the target of this request }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-links/{link}:
    delete:
      tags: [Clinic Appointments]
      summary: Decline a pending request, or unlink an already-accepted one (either party, either state)
      parameters: [{ name: link, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '403': { description: Not a party to this link } }
  /business/clinic-queue-pattern:
    put:
      tags: [Clinic Appointments]
      summary: Set the clinic's repeating queue pattern («1 كشف ثم 2 استشارة»)
      description: An ordered list of bookable_item_type keys (booking_examination, booking_consultation, …) the queue cycles through when deciding who's next. Send an empty array to go back to plain first-checked-in-first-called.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern]
              properties:
                pattern: { type: array, items: { type: string } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }
    patch:
      tags: [Clinic Appointments]
      summary: Same as PUT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern]
              properties:
                pattern: { type: array, items: { type: string } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }
  /businesses/{business}/providers:
    get:
      tags: [Assignments]
      summary: "«نظام التعيين»: the people who serve customers at ANY business (staff the owner marked is_provider, and its physicians): {id, name, title, logo}. The title is the person's own at that business."
      parameters: [{ name: business, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/providers:
    get:
      tags: [Assignments]
      summary: "Who this business may assign work to (acting business via X-Business-Id / business_id for a delegate): {id, name, title, logo, is_physician}."
      responses: { '200': { description: OK } }
  /business/bookings/{booking}/assignee:
    put:
      tags: [Assignments]
      summary: "Hand a booking to a provider of the business (assignee_id), or take it back (null). The assignee is told once. 422 when the person is not a provider of this business; 403 for a provider himself (he works his own list). Every booking reply carries `assignee` {id, name, title, logo} or null; a provider's GET /business/bookings lists only his own, and `assignee_id` filters the owner's list."
      parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { assignee_id: { type: integer, nullable: true } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } }
  /clinics/{clinic}/physicians:
    get:
      tags: [Clinic Appointments]
      summary: "The physicians who work for this hospital / centre (staff the owner marked is_physician): {id, name, title, logo, open_slots, next_at}. Pick one and ask GET /clinics/{clinic}/slots?physician_id= for HIS times; a slot publishes under a physician, and the appointment, prescription and investigation order carry `physician` (name + title). Empty for a clinic with no staff physicians."
      parameters: [{ name: clinic, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /clinics/{clinic}/slots:
    get:
      tags: [Clinic Appointments]
      summary: "A clinic's open published slots for the next `days` days (default 14, max 60; not 30 rows). The paginator also carries `days` - one entry per day of the window {date, open (the clinic's weekly hours say it sits that day; a week never written counts as open), hours {open, close}, slots (open times left), published (every time the clinic published that day, booked ones too - 0 means the doctor is not there: the app hides the day)} - so the patient sees only the days the doctor sits."
      parameters: [{ name: clinic, in: path, required: true, schema: { type: integer } }, { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 60, default: 14 } }, { name: physician_id, in: query, required: false, description: 'One physician board; absent = the times the hospital published without naming a physician', schema: { type: integer } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /clinic-slots/{slot}/book:
    post:
      tags: [Clinic Appointments]
      summary: Book an open slot in one tap (confirmed at once; notifies the clinic). Optional `specialty_service_ids` (up to 10) name what a specialty clinic's patient came for (422 when the clinic does not offer one of them); the appointment then carries `specialty_services` [{id, name, price}].
      parameters: [{ name: slot, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses: { '201': { description: Booked }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-slots:
    get:
      tags: [Clinic Appointments]
      summary: The clinic's published slots (open by default; include_booked=1 for all)
      parameters: [{ name: include_booked, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK } }
    post:
      tags: [Clinic Appointments]
      summary: Publish one or many open slots (duplicates skipped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                starts_at: { type: string, format: date-time, description: 'Single slot; use instead of slots' }
                slots: { type: array, items: { type: string, format: date-time }, description: 'Many slots; use instead of starts_at' }
                duration_minutes: { type: integer }
      responses: { '201': { description: Published }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-slots/generate:
    post:
      tags: [Clinic Appointments]
      summary: Publish a recurring weekly grid of slots at once (duplicates skipped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekdays]
              properties:
                weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: '0=Sun..6=Sat' }
                times: { type: array, items: { type: string, example: '10:00' }, description: 'Explicit times; use instead of the range' }
                start_time: { type: string, example: '09:00' }
                end_time: { type: string, example: '13:00' }
                interval_minutes: { type: integer }
                weeks: { type: integer, minimum: 1, maximum: 12 }
                duration_minutes: { type: integer }
      responses: { '201': { description: 'Published (returns created/skipped)' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-slots/generate-from-hours:
    post:
      tags: [Clinic Appointments]
      summary: Publish slots straight from the clinic's own configured working hours (business/hours) instead of re-typing days/start/end
      description: Each open day is sliced from ITS OWN open/close window; a day left unset or marked closed generates nothing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weeks: { type: integer, minimum: 1, maximum: 12 }
                interval_minutes: { type: integer, description: 'Defaults to the resolved visit duration' }
                service_price_id: { type: integer }
                duration_minutes: { type: integer }
      responses: { '201': { description: 'Published (returns created/skipped)' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-slots/{slot}:
    delete:
      tags: [Clinic Appointments]
      summary: Remove an open (unbooked) slot
      parameters: [{ name: slot, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /investigations/catalog:
    get: { tags: [Investigations], summary: 'The lab tests and radiology exams a doctor picks from (id + name), never typed.', responses: { '200': { description: OK } } }
  /investigation-centers/{center}/tests:
    get: { tags: [Investigations], summary: 'The tests and exams a lab or radiology centre does, each with its price — what a patient picks from on the centre page (404 for a business that is not a centre).', parameters: [{ name: center, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /investigation-orders:
    get: { tags: [Investigations], summary: 'My investigation orders as a patient (paginated, newest first).', responses: { '200': { description: OK } } }
    post: { tags: [Investigations], summary: 'A doctor (a health business) orders tests for a patient — {patient_id, option_ids[], notes}. Labs and radiology centres only receive, so they are refused.', responses: { '201': { description: Created }, '403': { description: 'Not a doctor / health business' }, '422': { $ref: '#/components/responses/Validation' } } }
  /investigation-orders/issued:
    get: { tags: [Investigations], summary: 'The orders a doctor issued.', responses: { '200': { description: OK }, '403': { description: 'Not a doctor / health business' } } }
  /investigation-orders/request:
    post: { tags: [Investigations], summary: 'The patient asks a registered centre directly, with no doctor — multipart {center_id, option_ids[], notes?, photo? (a paper request)}. The order is sent at once and priced at that centre.', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /investigation-orders/{order}:
    get: { tags: [Investigations], summary: 'One order — the doctor, the patient or the centre it was sent to; anyone else gets 404. Carries the items (with the centre price once sent), the total, the centre note and the signed links of the request photo and the result files.', parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /investigation-orders/{order}/centers:
    get: { tags: [Investigations], summary: 'The registered labs and radiology centres and what each would charge for the whole order (covers / of / total / missing), best coverage first, then cheapest. The patient only.', parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /investigation-orders/{order}/send:
    post: { tags: [Investigations], summary: 'The patient shares an `issued` order with a centre — {center_id}. Each item is priced there (items the centre does not do stay unpriced) and the centre is told. A centre that does none of it is refused.', parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /investigation-orders/{order}/cancel:
    post: { tags: [Investigations], summary: 'The doctor or the patient cancels an order until the centre accepts it.', parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /investigation-orders/{order}/saved:
    post: { tags: [Investigations], summary: "The patient says a copy of the result photos is on his phone (the order must be ready; 404 for anyone but its patient). The server's photos are then deleted once the ordering doctor has opened the order, after a short grace; text results stay. An order nobody kept warns the patient and its photos go after 180 days. The order carries `files_purged`, `patient_saved` and `files_expire_at`.", parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /investigation-files/{image}:
    get: { tags: [Investigations], summary: 'A file of an order from private storage (a request photo or a result). No login: the signed, time-limited link is the credential.', parameters: [{ name: image, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: The image }, '403': { description: 'Missing, tampered or expired signature' }, '404': { description: Not an investigation file } } }
  /business/investigation-prices:
    get: { tags: [Investigations], summary: "The centre's own price list: every test and exam of the platform's lists with what this centre charges (price null = it does not do it).", responses: { '200': { description: OK }, '403': { description: 'Not a centre' } } }
    put: { tags: [Investigations], summary: 'Save the centre prices — {prices: {optionId: price|null}}; null or 0 removes the row. Only words of the platform lists are accepted. This is where a centre prices its tests (not a general prices screen).', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/investigation-orders:
    get: { tags: [Investigations], summary: "The centre's orders — tab=incoming (sent) | accepted | done (ready or declined). A lab, a radiology centre, a hospital or a medical centre.", parameters: [{ name: tab, in: query, schema: { type: string, enum: [incoming, accepted, done] } }], responses: { '200': { description: OK }, '403': { description: 'Not a centre' } } }
  /business/investigation-orders/{order}/accept:
    post: { tags: [Investigations], summary: 'The centre accepts a sent order — {appointment_at?, note?}; the patient is told.', parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/investigation-orders/{order}/decline:
    post: { tags: [Investigations], summary: "The centre declines — {note?}. A doctor's order goes back to the patient to send elsewhere; a patient's own request is `declined`.", parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/investigation-orders/{order}/results:
    post: { tags: [Investigations], summary: 'The centre attaches the results — AS TEXT per test (texts[item id]) and/or photos of what is not text (multipart images[], up to 10), printed reports as PDF (multipart documents[], up to 5, 10 MB each, content-checked), scans as DICOM files (multipart dicoms[], up to 20, 50 MB each, checked by the DICM marker at byte 128; served as an attachment `application/dicom`, opened in an external viewer) and an optional note; at least one of them. Each file in `result_files` carries `type` image|pdf|dicom. The order becomes `ready` and the patient and the doctor are told. The centre never sees the doctor: the order it reads carries doctor null.', parameters: [{ name: order, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /hospitals/{hospital}/departments:
    get: { tags: [HospitalDoctors], summary: "What a patient reads on a hospital's page: its departments (the specialties it ticked) each with its active doctors — {name, business_id (the doctor's own page; null for a doctor listed as text)}. 404 for a business that is not a hospital or medical centre.", parameters: [{ name: hospital, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/hospital-doctors:
    get: { tags: [HospitalDoctors], summary: "The hospital's own view of its departments and doctors, pending invitations included.", responses: { '200': { description: OK }, '403': { description: 'Not a hospital or medical centre' } } }
    post: { tags: [HospitalDoctors], summary: 'Put a doctor under a department — {option_id, user_id} for a doctor with an account (pending until that doctor accepts, unless the doctor already agreed to this hospital), or {option_id, name, title?} for a doctor with no account (listed at once). The department must be one the hospital ticked.', responses: { '201': { description: Created }, '403': { description: 'Not a hospital or medical centre' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/hospital-doctors/find-doctors:
    get: { tags: [HospitalDoctors], summary: 'Doctor accounts (individual clinics) matching ?q= (2+ characters), to invite.', parameters: [{ name: q, in: query, schema: { type: string } }], responses: { '200': { description: OK }, '403': { description: 'Not a hospital or medical centre' } } }
  /business/hospital-doctors/{row}:
    delete: { tags: [HospitalDoctors], summary: "The hospital drops a doctor from a department (404 on another hospital's row).", parameters: [{ name: row, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/hospital-invitations:
    get: { tags: [HospitalDoctors], summary: 'A doctor sees who invited them (pending) and where they are listed (active).', responses: { '200': { description: OK } } }
  /business/hospital-invitations/{row}/accept:
    post: { tags: [HospitalDoctors], summary: "Accept an invitation — it also opens the same hospital's other pending departments, since it is one agreement.", parameters: [{ name: row, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/hospital-invitations/{row}:
    delete: { tags: [HospitalDoctors], summary: 'Decline an invitation, or leave a department the doctor is listed under.', parameters: [{ name: row, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /hospitals/{hospital}/procedures:
    get: { tags: [HospitalProcedures], summary: 'What a hospital offers, by kind (a surgical specialty — surgery, orthopedic, obstetrics, urology, ent, ophthalmology, cardiac, neuro, plastic, pediatric, oncology, bariatric, maxillofacial — then endoscopy and procedure): {id (the offering a patient asks for), name, price (null = after assessment), notes}. 404 for a business that is not a hospital or medical centre.', parameters: [{ name: hospital, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /procedure-requests:
    get: { tags: [HospitalProcedures], summary: "The caller's own procedure requests as a patient (paginated, newest first).", responses: { '200': { description: OK } } }
    post: { tags: [HospitalProcedures], summary: 'Ask a hospital for a procedure it offers — {hospital_procedure_id, preferred_date?, notes?}. The name and price are kept as asked.', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /procedure-requests/{row}/cancel:
    post: { tags: [HospitalProcedures], summary: 'The patient cancels a request until it is completed (404 for anyone else).', parameters: [{ name: row, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/hospital-procedures:
    get: { tags: [HospitalProcedures], summary: "The hospital's own view: the platform list and its own entries by kind, each with `offered` and its price.", responses: { '200': { description: OK }, '403': { description: 'Not a hospital or medical centre' } } }
    put: { tags: [HospitalProcedures], summary: "Save what the hospital offers — {items: [{procedure_id, offered, price|null}]}. Only the platform's list and the hospital's own entries are accepted.", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/hospital-procedures/custom:
    post: { tags: [HospitalProcedures], summary: "Add a procedure the platform list does not have — {kind: any of the kinds above, name}; visible to this hospital alone and offered at once.", responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/hospital-procedures/custom/{procedure}:
    delete: { tags: [HospitalProcedures], summary: "Remove one of the hospital's own entries (404 for the platform list or another hospital's).", parameters: [{ name: procedure, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/procedure-requests:
    get: { tags: [HospitalProcedures], summary: "The hospital's requests by ?tab= incoming (requested) | upcoming (accepted) | done (completed, declined, cancelled).", parameters: [{ name: tab, in: query, schema: { type: string } }], responses: { '200': { description: OK }, '403': { description: 'Not a hospital or medical centre' } } }
  /business/procedure-requests/{row}/accept:
    post: { tags: [HospitalProcedures], summary: 'Accept a requested procedure — {scheduled_at, price? (only fills a missing price), note?}; the patient is told.', parameters: [{ name: row, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/procedure-requests/{row}/decline:
    post: { tags: [HospitalProcedures], summary: 'Decline a requested procedure — {note?}; the patient is told.', parameters: [{ name: row, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/procedure-requests/{row}/complete:
    post: { tags: [HospitalProcedures], summary: 'Mark an accepted procedure done.', parameters: [{ name: row, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /clinics/{clinic}/specialty-services:
    get: { tags: [SpecialtyServices], summary: 'What a specialty clinic offers, by kind (dental: checkup, preventive, restorative, endodontic, periodontal, surgical, prosthetic, orthodontic, cosmetic, pediatric · skin: injectables, face_lifting, laser, scars, peels, skin_disease, hair, body): {id (the service a patient names when booking), name, price (null = after the exam)}; kinds with nothing offered are left out. 404 for a business that has no list.', parameters: [{ name: clinic, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/specialty-services:
    get: { tags: [SpecialtyServices], summary: "The clinic's own view: the platform lists of its specialties and its own entries by kind, each with `offered` and its price.", responses: { '200': { description: OK }, '403': { description: 'No specialty list for this account' } } }
    put: { tags: [SpecialtyServices], summary: "Save what the clinic offers — {items: [{service_id, offered, price|null}]}. A price of 0 or null means after the exam. Only the lists of the clinic's own specialties and its own entries are accepted.", responses: { '200': { description: OK }, '403': { description: 'No specialty list for this account' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/specialty-services/custom:
    post: { tags: [SpecialtyServices], summary: 'Add a service the platform list does not have — {kind (one of the kinds of the clinic specialties), name}; visible to this clinic alone and offered at once.', responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/specialty-services/custom/{service}:
    delete: { tags: [SpecialtyServices], summary: "Remove one of the clinic's own entries (404 for the platform list or another clinic's).", parameters: [{ name: service, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/clinic-appointments/{appointment}/payments:
    post: { tags: [Clinic Appointments], summary: 'Record a payment against a visit — {amount, kind: visit_fee|service, note?}; the visit fee is the base (paid on arrival), a service is paid after it is done, and a treatment may be paid in instalments. Both the patient and the doctor read the payments in `billing`. Only for a confirmed or finished visit.', parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/clinic-appointments/{appointment}/payments/{payment}:
    delete: { tags: [Clinic Appointments], summary: 'Take back a payment recorded by mistake.', parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }, { name: payment, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /business/clinic-appointments/{appointment}/items/{item}:
    put: { tags: [Clinic Appointments], summary: 'Set what a named service is charged once it is done — {final_price: number|null}; null puts it back to the listed price. The clinic may raise or lower it.', parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }, { name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/clinic-appointments/{appointment}/installment:
    put: { tags: [Clinic Appointments], summary: 'What the clinic will ask at the NEXT session — {amount: number|null}; null = what is left. Shown to the patient with his next visit as carried_over.', parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /clinic-appointments/{appointment}/payments/{payment}/confirm:
    post: { tags: [Clinic Appointments], summary: 'The patient confirms a payment the clinic recorded. A confirmed payment can no longer be removed by the clinic nor disputed by the patient.', parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }, { name: payment, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /clinic-appointments/{appointment}/payments/{payment}/dispute:
    post: { tags: [Clinic Appointments], summary: 'The patient disputes a payment the clinic recorded — {note?}; the clinic is told and the payment stays on record as disputed.', parameters: [{ name: appointment, in: path, required: true, schema: { type: integer } }, { name: payment, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /clinics/{clinic}/visit-kinds:
    get: { tags: [Clinic Appointments], summary: 'Every visit kind the clinic prices (examination, consultation, follow-up, procedure, session...) with its fee, in the clinic order - the radio list of the booking board, whether or not a kind has an open slot today - and my_balance {amount, due}: what the caller still owes this clinic from earlier visits.', parameters: [{ name: clinic, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /prescriptions:
    get:
      tags: [Prescriptions]
      summary: My prescriptions as a patient
      parameters: [{ $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK } }
    post:
      tags: [Prescriptions]
      summary: Issue a prescription (doctor → patient)
      description: >-
        The caller must be a clinic (business) account; otherwise 403.
        A line may hold a CONTROLLED drug (narcotic / psychotropic: `is_controlled` on the medicine search result).
        Then the request must also carry `handwritten_image` — a photo of the paper prescription in the doctor's own
        handwriting (and `handwritten_source` camera|upload) — sent as multipart with `items` as a JSON string. Without it:
        422 with `code: handwritten_required` and `controlled` (the drug names); nothing is stored. The same applies to
        revise. The prescription then carries `controlled` and `handwritten_image`, and a pharmacy will not dispense a
        controlled one that has no photo on file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, items]
              properties:
                patient_id: { type: integer }
                diagnosis: { type: string }
                notes: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      dosage: { type: string }
                      quantity: { type: string }
                      instructions: { type: string }
      responses:
        '201': { description: Created }
        '403': { description: 'Not a clinic account' }
        '422': { $ref: '#/components/responses/Validation' }
  /prescriptions/issued:
    get:
      tags: [Prescriptions]
      summary: The prescriptions a doctor has issued
      parameters: [{ $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK }, '403': { description: 'Not a clinic account' } }
  /prescriptions/{prescription}:
    get:
      tags: [Prescriptions]
      summary: Read a prescription (doctor, patient, or pharmacy only)
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: 'Not found, or you are not a party' } }
  /prescriptions/issued/archived:
    post: { tags: [Prescriptions], summary: 'The DOCTOR device (the issuing clinic phone, or a computer with an encrypted download) confirms it holds this prescription ({id, content}). Same fingerprint proof as the patient; the server purges a finished prescription sensitive fields only once BOTH the patient and the doctor hold a copy', responses: { '200': { description: OK }, '403': { description: Not a physician practice }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /prescriptions/archived:
    post: { tags: [Prescriptions], summary: 'The patient phone confirms it holds this prescription ({id, content}). The content is fingerprinted and must equal what the doctor wrote; only then is the prescription marked as held by the patient, which allows the scheduled purge to remove its diagnosis, condition and notes from the server (the medicine lines and the fingerprint stay). The content is never stored', responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /prescriptions/request:
    post:
      tags: [Prescriptions]
      summary: Customer asks a pharmacy for medicine directly (no doctor)
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } }
  /prescriptions/{prescription}/confirm-quote:
    post:
      tags: [Prescriptions]
      summary: Customer accepts the pharmacy's quote on a direct request
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /prescriptions/{prescription}/send:
    post:
      tags: [Prescriptions]
      summary: Patient sends the prescription to a pharmacy
      description: delivery requires a delivery_address; pickup does not.
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pharmacy_id, fulfillment_type]
              properties:
                pharmacy_id: { type: integer }
                fulfillment_type: { type: string, enum: [delivery, pickup] }
                delivery_address: { type: string }
      responses:
        '200': { description: Sent }
        '404': { description: 'Not found, or you are not the patient' }
        '422': { $ref: '#/components/responses/Validation' }
  /prescriptions/{prescription}/cancel:
    post:
      tags: [Prescriptions]
      summary: Cancel a prescription (doctor or patient, before dispensing)
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Cancelled }
        '404': { description: 'Not found, or you are not a party' }
        '422': { $ref: '#/components/responses/Validation' }
  /prescriptions/{prescription}/share:
    post:
      tags: [Prescriptions]
      summary: Grant a second doctor read-only access (the patient or the original doctor only)
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctor_id]
              properties:
                doctor_id: { type: integer, description: 'Must be a different business account than the original doctor.' }
      responses:
        '200': { description: Shared }
        '404': { description: 'Not found, or you are neither the patient nor the original doctor' }
        '422': { $ref: '#/components/responses/Validation' }
  /prescriptions/{prescription}/revise:
    post:
      tags: [Prescriptions]
      summary: Amend a prescription (original doctor only) — creates a new prescription linked via revises_prescription_id and cancels this one; never overwrites it
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                diagnosis: { type: string }
                patient_condition: { type: string }
                notes: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [medicine_id]
                    properties:
                      medicine_id: { type: integer }
                      dosage: { type: string }
                      quantity: { type: string }
                      instructions: { type: string }
                      frequency_per_day: { type: integer }
                      food_timing: { type: string, enum: [before, with, after] }
                      time_slots: { type: array, items: { type: string } }
                      duration_value: { type: integer }
                      duration_unit: { type: string, enum: [days, weeks, months] }
      responses:
        '201': { description: 'Revised — the new prescription' }
        '404': { description: 'Not found, or you are not the original doctor' }
        '422': { $ref: '#/components/responses/Validation' }
  /medicines:
    get:
      tags: [Prescriptions]
      summary: Search the shared medicine dictionary (typeahead)
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses: { '200': { description: 'OK (name + strength, most-used first)' } }
    post:
      tags: [Prescriptions]
      summary: Add a drug to the dictionary (doctors only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                strength: { type: string, example: '500mg' }
      responses:
        '201': { description: Added }
        '403': { description: 'Doctors (clinic accounts) only' }
        '422': { $ref: '#/components/responses/Validation' }
  /prescriptions/{prescription}/schedule-reminders:
    post:
      tags: [Prescriptions]
      summary: Schedule this prescription's doses onto my agenda (patient)
      description: Turns each medicine's structured dosage into agenda medication reminders, timed off the patient's meal times. Re-running rebuilds the schedule.
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'Scheduled (returns reminders count)' }, '404': { description: 'Not yours' } }
  /prescriptions/{prescription}/images:
    post:
      tags: [Prescriptions]
      summary: Attach a scan of the paper prescription (doctor or patient only)
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                source: { type: string, enum: [camera, upload] }
      responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /prescriptions/{prescription}/images/{image}:
    delete:
      tags: [Prescriptions]
      summary: Remove a prescription photo (doctor or patient only)
      parameters:
        - { name: prescription, in: path, required: true, schema: { type: integer } }
        - { name: image, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /agenda:
    get:
      tags: [Agenda]
      summary: My agenda for a day (default today)
      parameters: [{ name: date, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: OK } }
    post:
      tags: [Agenda]
      summary: Add a personal task (blocks time; may remind)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at]
              properties:
                title: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                notes: { type: string }
                remind: { type: boolean }
      responses: { '201': { description: Added }, '422': { $ref: '#/components/responses/Validation' } }
  /agenda/week:
    get:
      tags: [Agenda]
      summary: My week — 7 days (from the Saturday of the week containing date)
      parameters: [{ name: date, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: 'OK (returns from/to + 7 day cells)' } }
  /agenda/export.ics:
    get:
      tags: [Agenda]
      summary: Download my upcoming agenda as an iCalendar (.ics) file
      parameters: [{ name: days, in: query, schema: { type: integer, default: 90, minimum: 1, maximum: 365 } }]
      responses:
        '200':
          description: An iCalendar document
          content:
            text/calendar:
              schema: { type: string }
  /me/agenda-feed:
    get:
      tags: [Agenda]
      summary: My calendar subscription URL (webcal/ICS; created on first use)
      responses: { '200': { description: 'OK (returns url)' } }
  /me/agenda-feed/rotate:
    post:
      tags: [Agenda]
      summary: Rotate my subscription URL (the old one stops working)
      responses: { '200': { description: 'OK (returns the new url)' } }
  /agenda/feed/{token}.ics:
    get:
      tags: [Agenda]
      summary: PUBLIC calendar feed — a calendar app polls this (token is the credential)
      description: No authentication; the unguessable per-user token in the path identifies the user. An unknown token returns an empty calendar (200), never an error.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: An iCalendar document (empty for an unknown token)
          content:
            text/calendar:
              schema: { type: string }
  /agenda/upcoming:
    get: { tags: [Agenda], summary: 'My coming items that ask to be reminded of (remind=true), default next 14 days (max 60) - the phone schedules its own notifications from them', parameters: [{ name: days, in: query, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /agenda/scrub:
    post: { tags: [Agenda], summary: 'The phone now holds the title and notes of these personal tasks ({ids: [..]}): the server drops them and keeps the time under a neutral title. Only my own personal tasks; idempotent', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /agenda/recurring:
    post:
      tags: [Agenda]
      summary: Add a repeating personal task (clashing days are skipped). With private=1 only the times are sent (title and notes stay on the phone); the reply lists the created ids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start_time, frequency]
              properties:
                title: { type: string }
                start_time: { type: string, example: '09:00' }
                duration_minutes: { type: integer }
                frequency: { type: string, enum: [daily, weekly] }
                weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: '0=Sun..6=Sat (weekly only)' }
                weeks: { type: integer, minimum: 1, maximum: 12 }
                notes: { type: string }
                remind: { type: boolean }
      responses: { '201': { description: 'Added (returns created/skipped)' }, '422': { $ref: '#/components/responses/Validation' } }
  /agenda/{item}:
    delete:
      tags: [Agenda]
      summary: Remove a personal task I added
      parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Removed }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /me/meal-times:
    get:
      tags: [Agenda]
      summary: My meal times (defaults if unset)
      responses: { '200': { description: OK } }
    put:
      tags: [Agenda]
      summary: Set my meal times (feed food-tied medication reminders)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [breakfast_at, lunch_at, dinner_at]
              properties:
                breakfast_at: { type: string, example: '08:00' }
                lunch_at: { type: string, example: '14:00' }
                dinner_at: { type: string, example: '20:00' }
      responses: { '200': { description: Saved }, '422': { $ref: '#/components/responses/Validation' } }
  /me/notification-preferences:
    get: { tags: [Notifications], summary: 'My notification categories, each with a switch: on = active, off = silent (still in the inbox, no push, no sound)', responses: { '200': { description: OK } } }
    put: { tags: [Notifications], summary: 'Switch categories - {categories: {orders: false}}; a category left out is untouched; critical alerts and platform announcements are never silenced', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /me/reminder-preferences:
    get:
      tags: [Agenda]
      summary: My reminder lead times (defaults if unset)
      responses: { '200': { description: OK } }
    put:
      tags: [Agenda]
      summary: Set my reminder lead times
      description: Minutes before an appointment (two reminders; second nullable = disabled, must be closer than the first) and before an agenda item (dose/task).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_first_lead_minutes, agenda_lead_minutes]
              properties:
                appointment_first_lead_minutes: { type: integer, example: 1440 }
                appointment_second_lead_minutes: { type: integer, nullable: true, example: 120 }
                agenda_lead_minutes: { type: integer, example: 0 }
      responses: { '200': { description: Saved }, '422': { $ref: '#/components/responses/Validation' } }
  /pharmacy/prescriptions:
    get:
      tags: [Prescriptions]
      summary: The pharmacy's incoming prescriptions
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [sent_to_pharmacy, preparing, ready, dispensed] } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK } }
  /pharmacy/prescriptions/verify:
    post: { tags: [Prescriptions], summary: 'A prescription the patient showed on his phone ({id, content}): the server recomputes the fingerprint of the content and compares it with the one stored when the doctor issued it. Returns authentic, and when authentic: status, can_dispense, superseded, the doctor and dates, and controlled + handwritten_image (the photo of the doctor handwritten paper, to compare with the paper in the patient hand; a controlled prescription with no photo on file has can_dispense false)', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /pharmacy/prescriptions/dispense-in-person:
    post: { tags: [Prescriptions], summary: 'Hand the medicine over against a shown prescription ({id, content}). Re-verified, then dispensed exactly once (row locked); only a prescription still in the issued state can be taken this way', responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
  /pharmacy/prescriptions/{prescription}/price:
    post:
      tags: [Prescriptions]
      summary: Pharmacy prices every line at once (all-or-nothing invoice)
      description: >-
        The pharmacy's own price per line, never inferred from anywhere else.
        Every prescription item must be priced in the same call; a partial
        set is rejected. Re-priceable any time before dispense.
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [prescription_item_id, unit_price, billed_quantity]
                    properties:
                      prescription_item_id: { type: integer }
                      unit_price: { type: number, example: 25.5 }
                      billed_quantity: { type: integer, example: 2 }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /pharmacy/prescriptions/{prescription}/prepare:
    post:
      tags: [Prescriptions]
      summary: Pharmacy begins preparing
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /pharmacy/prescriptions/{prescription}/ready:
    post:
      tags: [Prescriptions]
      summary: Pharmacy marks it ready (notifies the patient)
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /pharmacy/prescriptions/{prescription}/dispense:
    post:
      tags: [Prescriptions]
      summary: Pharmacy dispenses (delivered or handed over)
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /pharmacy/prescriptions/{prescription}/reject:
    post:
      tags: [Prescriptions]
      summary: Pharmacy rejects (returns it to the patient to send elsewhere)
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /pharmacy/prescriptions/{prescription}/quote:
    post:
      tags: [Prescriptions]
      summary: Pharmacy replies to a direct customer request with priced items
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /pharmacy/prescriptions/{prescription}/decline:
    post:
      tags: [Prescriptions]
      summary: Pharmacy declines a direct customer request it cannot fulfil
      parameters: [{ name: prescription, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /operations/{type}/{id}/project:
    get:
      tags: [Projects]
      summary: Follow the build/manufacturing progress linked to my operation
      description: >-
        The contracted customer's read-only view of the project the business
        linked to this order/booking — the timeline, which stage it reached, and
        the camera evidence per stage. Only a party to the operation may read it
        (a stranger gets 404); `data.project` is null when nothing is linked yet. `data.viewer` is `business` for the operation's business and `customer` for its buyer; each task carries `requires_approval`, `approval_status`, `approval_note`, `assignee {id,name,title}`, `parent_id`, `zone`, `weight`, `details`, `start_status`, `items[{id,name,unit,planned,done}]`; the view also carries `agreement`, `agreed`, `versions[]`, `change_requests[]` `quantity_log[]` and `guarantee_requirement {code, name, customer_ok}` (null when none is asked). Change requests are `extension`, `scope` or `shift`.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [order, booking, listing, moderation] } }
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
  /operations/{type}/{id}/project/tasks/{task}/approve:
    post:
      tags: [Projects]
      summary: The customer approves a completed stage that asked for his approval
      description: >-
        Only the contracted customer of the linked operation, and only a stage whose `approval_status` is `pending` (the stage
        was completed and `requires_approval`). Returns the customer view of the project. 422 otherwise.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: task, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /operations/{type}/{id}/project/tasks/{task}/reject:
    post:
      tags: [Projects]
      summary: The customer sends a completed stage back, with a note
      description: >-
        Body `{note}` is required. The stage reopens (in_progress, at most 90%), the business is told with the note, and it
        must be completed again — which asks for approval again.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: task, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /operations/{type}/{id}/project/agreement/agree:
    post: { tags: [Projects], summary: "The customer agrees to the offered plan: his consent is recorded (who, when, which version); the platform's `project_plan_agreed` fee is taken from BOTH sides — refused (422) if either cannot pay. The project takes the delivery date and grace.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/agreement/decline:
    post: { tags: [Projects], summary: "The customer declines the offered plan; body `{note}` is required.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/change-requests/{changeRequest}/approve:
    post: { tags: [Projects], summary: "Approve a request for more time or a change of scope; it is applied, logged, and written as a new agreement version.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }, { in: path, name: changeRequest, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/change-requests/{changeRequest}/reject:
    post: { tags: [Projects], summary: "Reject a request; body `{note}` is required and changes nothing.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }, { in: path, name: changeRequest, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/tasks/{task}/start/approve:
    post: { tags: [Projects], summary: "Approve the start of a main stage: recorded, both sides pay `project_stage_started` (422 if either cannot), the time it waited for him is added to `customer_wait_seconds` (not held against the business in the rating).", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }, { in: path, name: task, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/tasks/{task}/start/decline:
    post: { tags: [Projects], summary: "Decline the start of a main stage; body `{note}` is required. The business may ask again.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }, { in: path, name: task, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/shift-requests:
    post: { tags: [Projects], summary: "The customer asks to postpone the plan or a stage (he cannot pay yet…): body `{scope: plan|stage, task_id?, days? | new_start?, reason (required)}`. The business answers at `/business/projects/{project}/change-requests/{id}/approve|reject`.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/showcase/approve:
    post: { tags: [Projects], summary: "The customer lets the project be shown: the post is made (or switched back on). It carries only the progress he confirmed, live, and no name, address or unit.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/showcase/decline:
    post: { tags: [Projects], summary: "The customer declines to have the project shown; body `{note}` optional. The business may ask again.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/showcase/withdraw:
    post: { tags: [Projects], summary: "The customer takes an approved showcase down; the post is switched off.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/showcase/stages/{task}/approve:
    post: { tags: [Projects], summary: "Stage-by-stage mode (`consent_mode: each`): the customer lets a FINISHED main stage be shown. Until then the stage is neither listed nor counted in the post.", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }, { in: path, name: task, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operations/{type}/{id}/project/showcase/stages/{task}/decline:
    post: { tags: [Projects], summary: "The customer does not let this stage be shown (he can change his mind).", parameters: [{ in: path, name: type, required: true, schema: { type: string, enum: [order, booking] } }, { in: path, name: id, required: true, schema: { type: integer } }, { in: path, name: task, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /operation-chats/{type}/{id}:
    get:
      tags: [Operation Chats]
      summary: Open and read an operation's customer↔business chat
      description: >-
        Opens the chat if it does not exist yet (seating both parties) and
        returns its messages, newest first. Only a party to the operation may
        read it; a stranger gets 404. `meta.thread` carries status, locked,
        expired and retain_until. `listing` is a buyer's conversation about an
        owner listing (`id` = the inquiry): the same chat, but a phone number
        cannot be written in it until the two have swapped numbers (422 on
        `body`).
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [order, booking, listing, moderation] } }
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: per_page, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a party to it' }
    delete:
      tags: [Operation Chats]
      summary: Delete the chat (a party's "delete now")
      description: >-
        Allowed only once the chat has expired (its 7-day retention passed) and
        only when there is no dispute on the operation — a disputed chat is
        evidence and is kept. Either party may delete; otherwise the sweep
        auto-deletes it after a grace window.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [order, booking, listing, moderation] } }
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Deleted }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }
  /operation-chats/{type}/{id}/messages:
    post:
      tags: [Operation Chats]
      summary: Post a message into the operation chat, optionally with evidence files
      description: >-
        `body` is optional when one or more `attachments` are sent, but a post
        with neither is refused. Attachments are images only (jpg, jpeg, png,
        webp, gif), max 6 per message; use multipart/form-data. A chat that has
        expired (7 days after the operation completed) is locked and refuses new
        messages.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [order, booking, listing, moderation] } }
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
          multipart/form-data:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
                attachments:
                  type: array
                  maxItems: 6
                  items: { type: string, format: binary }
      responses:
        '201': { description: 'Created. The message includes an `attachments` array of { id, url, name, mime, size }.' }
        '404': { description: 'Not found, or you are not a party to it' }
        '422': { $ref: '#/components/responses/Validation' }

  # ──────────────────── Thread access consent ────────────────────
  /threads/{thread}/access-status:
    get:
      tags: [Thread Access]
      summary: My and the other party's standing decision on admin read access to this thread
      parameters: [{ name: thread, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a real party to it' }
  /threads/{thread}/access-consent:
    post:
      tags: [Thread Access]
      summary: Record my own decision (approve or decline admin read access)
      parameters: [{ name: thread, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, declined] }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a real party to it' }
        '422': { $ref: '#/components/responses/Validation' }

  # ──────────────────── Direct chats ────────────────────
  /chats:
    get:
      tags: [Chats]
      summary: My conversations, most-recently-active first
      description: >-
        Each row carries the other participant(s), the last message, an unread
        count, and last_message_at.
      responses:
        '200': { description: OK }
    post:
      tags: [Chats]
      summary: Start (or return) a direct chat with a user
      description: >-
        Deduped: messaging the same person again returns the same conversation,
        never a parallel one. 201 whether it was created or already existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, minimum: 1 }
      responses:
        '201': { description: 'Created or existing; returns the thread and the other participant(s).' }
        '404': { description: 'That user does not exist' }
        '422': { $ref: '#/components/responses/Validation' }
  /chats/unread-count:
    get: { tags: [Chats], summary: 'A lightweight count for a home-screen badge (never the full list)', responses: { '200': { description: OK } } }
  /chats/group:
    post:
      tags: [Chats]
      summary: Create a group chat
      description: >-
        A titled conversation with more than two members. The caller becomes
        the owner (may add members, and is the only one who can). Every listed
        user_id must exist and must not be the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, user_ids]
              properties:
                title: { type: string, maxLength: 120 }
                user_ids: { type: array, minItems: 1, maxItems: 50, items: { type: integer, minimum: 1 } }
      responses:
        '201': { description: 'Created; returns the group (type=group, title, is_owner, participants).' }
        '422': { $ref: '#/components/responses/Validation' }
  /chats/{thread}:
    get:
      tags: [Chats]
      summary: Read a conversation
      parameters:
        - { in: path, name: thread, required: true, schema: { type: integer } }
        - { in: query, name: per_page, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or you are not a participant' }
    patch:
      tags: [Chats]
      summary: Rename a group (owner only)
      parameters:
        - { in: path, name: thread, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title], properties: { title: { type: string, maxLength: 120 } } }
      responses:
        '200': { description: 'Renamed; returns the group.' }
        '404': { description: 'Not a group, or not found' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Chats]
      summary: Delete a whole group (owner only)
      parameters:
        - { in: path, name: thread, required: true, schema: { type: integer } }
      responses:
        '200': { description: Deleted }
        '404': { description: 'Not a group, or not found' }
        '422': { $ref: '#/components/responses/Validation' }
  /chats/{thread}/messages:
    post:
      tags: [Chats]
      summary: Post a message into a direct chat, optionally with files
      description: >-
        body is optional when one or more attachments are sent; a post with
        neither is refused. Attachments are images only, max 6, via
        multipart/form-data.
      parameters:
        - { in: path, name: thread, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
          multipart/form-data:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
                attachments:
                  type: array
                  maxItems: 6
                  items: { type: string, format: binary }
      responses:
        '201': { description: 'Created. The message includes an `attachments` array.' }
        '404': { description: 'Not found, or you are not a participant' }
        '422': { $ref: '#/components/responses/Validation' }
  /chats/{thread}/members:
    post:
      tags: [Chats]
      summary: Add a member to a group (owner only)
      parameters:
        - { in: path, name: thread, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, minimum: 1 }
      responses:
        '201': { description: 'Added; returns the group.' }
        '404': { description: 'Not a group, or not found' }
        '422': { $ref: '#/components/responses/Validation' }
  /chats/{thread}/members/{user}:
    delete:
      tags: [Chats]
      summary: Remove a member from a group (owner only; the owner cannot be removed)
      parameters:
        - { in: path, name: thread, required: true, schema: { type: integer } }
        - { in: path, name: user, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Removed; returns the group.' }
        '404': { description: 'Not a group / member not found' }
        '422': { $ref: '#/components/responses/Validation' }
  /chats/{thread}/leave:
    post:
      tags: [Chats]
      summary: Leave a group
      description: >-
        Any member may leave a group; when the last member leaves, the group is
        deleted. A 1-to-1 DM cannot be left (422).
      parameters:
        - { in: path, name: thread, required: true, schema: { type: integer } }
      responses:
        '200': { description: Left }
        '404': { description: 'Not found, or you are not a participant' }
        '422': { $ref: '#/components/responses/Validation' }

  /thread-attachments/{attachment}:
    get:
      tags: [Chats]
      summary: Stream a private conversation evidence file
      description: >-
        The evidence files (dispute rooms, operation chats, direct and group
        chats) live outside the web root, so this authenticated route is the
        only way to fetch one — and only a party to the conversation the
        attachment belongs to may. A non-participant gets 404. Returns the
        image bytes with its Content-Type.
      parameters:
        - { in: path, name: attachment, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'The file bytes.' }
        '404': { description: 'Not found, or you are not a party to it' }

  # ──────────────────── Fines (fraud/abuse) ────────────────────
  /fines:
    get:
      tags: [Fines]
      summary: My platform fines
      description: The fines levied on you, newest first. Paginated.
      responses:
        '200': { description: OK }
  /fines/{fine}:
    get:
      tags: [Fines]
      summary: One of my fines
      parameters:
        - { in: path, name: fine, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or not yours' }
  /fines/{fine}/appeal:
    post:
      tags: [Fines]
      summary: Contest a fine while its window is open
      description: >-
        Allowed only on your own fine, only while it is appealable and the
        window has not closed. Filing pauses collection until an admin decides.
      parameters:
        - { in: path, name: fine, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                statement: { type: string, maxLength: 2000 }
      responses:
        '200': { description: 'Appeal submitted' }
        '404': { description: 'Not found, or not yours' }
        '422': { $ref: '#/components/responses/Validation' }

  /talents:
    get:
      tags: [Talents]
      summary: 'Browse young players — free, and locked for everyone'
      description: >
        The shop window. Never returns a name, club or video for any caller and
        never charges: a scout scrolling forty cards must not be debited forty
        times. Opening one card is GET /talents/{talent}, which is the charged
        moment.
      parameters:
        - { in: query, name: sport, schema: { type: string }, description: 'e.g. كرة قدم' }
        - { in: query, name: position, schema: { type: string } }
        - { in: query, name: age_min, schema: { type: integer, minimum: 5, maximum: 60 } }
        - { in: query, name: age_max, schema: { type: integer, minimum: 5, maximum: 60 } }
      responses:
        '200': { description: 'Locked cards, paginated' }

  /talents/mine/views:
    get:
      tags: [Talents]
      summary: 'Which players this scout has already paid for'
      description: >
        So a scout can reopen a card knowing it will not cost again — the
        question the «counted once» rule exists to answer.
      responses:
        '200': { description: 'This scout''s views, newest first' }

  /talents/{talent}:
    get:
      tags: [Talents]
      summary: 'Open one card — charged once per (player, scout)'
      description: >
        The first open charges bim.talent.view_fee to the SCOUT; every reopen is
        free and only increments view_count. The player is never charged. Only a
        «مستكشف لاعبين» business account may call this — anyone else gets 422.
      parameters:
        - { in: path, name: talent, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'The card; name, club and video only if already revealed' }
        '422': { description: 'Not a scout account, or insufficient balance' }

  /talents/{talent}/reveal:
    post:
      tags: [Talents]
      summary: 'Pay to see the name, club, video and contact'
      description: >
        Charges bim.talent.reveal_fee once. Idempotent — a scout who has already
        revealed gets the card back and is not charged again. The reveal is
        recorded against his account and dated, because the data belongs to a
        minor.
      parameters:
        - { in: path, name: talent, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'The full card' }
        '422': { description: 'Not a scout account, or insufficient balance' }

  # ──────────────────── Follows ────────────────────
  /follows:
    get: { tags: [Follows], summary: Accounts I follow, most-recently-followed first, responses: { '200': { description: OK } } }
    post:
      tags: [Follows]
      summary: Follow an account. Idempotent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [follow_id]
              properties:
                follow_id: { type: integer, minimum: 1 }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /follows/{user}:
    delete: { tags: [Follows], summary: Unfollow. Idempotent, parameters: [{ name: user, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }

  /posts:
    get:
      tags: [Posts]
      summary: 'The feed — public, and audience-scoped when a bearer token is sent'
      security: []
      parameters:
        - { in: query, name: latitude, schema: { type: number }, description: 'With longitude, orders nearest-first (computed in SQL).' }
        - { in: query, name: longitude, schema: { type: number } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: per_page, schema: { type: integer, maximum: 50 } }
      responses:
        '200': { description: OK }
    post:
      tags: [Posts]
      summary: Publish a post
      description: 'multipart/form-data when images are attached.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                title: { type: string, maxLength: 191, description: 'The post title, in whichever language the author writes it. Required unless subject_type is sent, in which case the linked item names the post.' }
                body: { type: string }
                sources: { type: array, items: { type: string, enum: [camera, upload] }, description: 'Where each photo in images[] came from, same order (a live camera shot or the gallery). Returned as images[].source and shown as a badge in the photo viewer; missing = upload.' }
                expire_at: { type: string, format: date-time }
                subject_type:
                  type: string
                  enum: [menu_item, bookable_item]
                  description: >
                    Optionally link the post to something the caller sells, so the
                    reader can act on it. Must be sent together with subject_id, and
                    the item must belong to the caller — otherwise 422. This is a
                    reference only: price, discount and audience live on
                    commercial_offers, not here.
                subject_id: { type: integer, minimum: 1 }
                image: { type: string, format: binary, description: Main image. }
                images:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /posts/{post}/comments:
    get:
      tags: [Posts]
      summary: 'Top-level comments, filtered to what the reader may see'
      description: >
        Public reading. The post's author sees every comment; any other
        signed-in reader sees public comments plus their own private ones; a
        guest sees public only. Applied as a query scope, so paging stays
        correct.
      security: []
      parameters:
        - { in: path, name: post, required: true, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or it is a job posting' }
    post:
      tags: [Posts]
      summary: Add a comment
      parameters:
        - { in: path, name: post, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 5000 }
                status:
                  type: string
                  enum: [public, private]
                  default: public
                  description: 'private = visible only to you and the post owner.'
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /comments/{comment}/replies:
    get:
      tags: [Posts]
      summary: Replies to a comment
      description: 'Returns 404 when the parent comment itself is not readable by you.'
      security: []
      parameters:
        - { in: path, name: comment, required: true, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or the parent is private and not yours' }
    post:
      tags: [Posts]
      summary: Reply to a comment
      description: >
        A reply can never be more visible than its parent — replying to a
        private comment always produces a private reply, whatever status is
        requested, or the private thread would leak.
      parameters:
        - { in: path, name: comment, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 5000 }
                status: { type: string, enum: [public, private] }
      responses:
        '201': { description: Created }
        '404': { description: Parent not readable }
  /comments/{comment}:
    put:
      tags: [Posts]
      summary: Edit your own comment
      parameters:
        - { in: path, name: comment, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 5000 }
      responses:
        '200': { description: OK }
        '403': { description: 'Not your comment — the post owner moderates, but does not rewrite' }
    patch:
      tags: [Posts]
      summary: Edit your own comment
      parameters:
        - { in: path, name: comment, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '403': { description: Not your comment }
    delete:
      tags: [Posts]
      summary: Delete a comment (its author, or the post's author moderating)
      description: 'Deleting a comment deletes its replies — they would otherwise be orphaned and unreachable.'
      parameters:
        - { in: path, name: comment, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '403': { description: Neither the comment author nor the post owner }
  /posts/mine:
    get:
      tags: [Posts]
      summary: My own posts, active or not
      responses:
        '200': { description: OK }
  /posts/subject-options:
    get:
      tags: [Posts]
      summary: What this account can link a post to
      description: >
        The pickable subjects, derived from what the caller actually owns
        (menu items grouped by section, bookable units) rather than from a
        service subscription. An empty list is a normal answer: a business with
        no menu and no bookable units has nothing to advertise but free text.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, enum: [menu_item, bookable_item] }
                            label: { type: string }
                            groups:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: integer, nullable: true }
                                  label: { type: string }
                                  items:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id: { type: integer }
                                        name: { type: string }
                                        price: { type: number, nullable: true }
  /posts/{post}:
    get:
      tags: [Posts]
      summary: One post
      security: []
      parameters:
        - { in: path, name: post, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: 'Not found, or it is a job posting' }
    post:
      tags: [Posts]
      summary: Edit own post
      description: >
        POST rather than PUT because PHP does not parse multipart bodies on
        PUT. Uploading images APPENDS to the gallery; pass replace_images=true
        to wipe it first (v1 wiped it on every update that carried an image).
      parameters:
        - { in: path, name: post, required: true, schema: { type: integer } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 191 }
                body: { type: string }
                expire_at: { type: string, format: date-time }
                is_active: { type: boolean }
                subject_type:
                  type: string
                  nullable: true
                  enum: [menu_item, bookable_item]
                  description: >
                    Omit to leave the existing link untouched; send null (or empty)
                    to unlink; send it with subject_id to relink.
                subject_id: { type: integer, minimum: 1 }
                replace_images: { type: boolean }
                image: { type: string, format: binary }
                images:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        '200': { description: OK }
        '403': { description: Not your post }
    delete:
      tags: [Posts]
      summary: Delete own post and its stored files
      parameters:
        - { in: path, name: post, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '403': { description: Not your post }
  /posts/{post}/share:
    post:
      tags: [Posts]
      summary: Count a share
      parameters:
        - { in: path, name: post, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
  /posts/{post}/react:
    post:
      tags: [Posts]
      summary: 'Like (1), dislike (-1) or clear (0)'
      parameters:
        - { in: path, name: post, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction: { type: integer, enum: [-1, 0, 1] }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /jobs/stats:
    get:
      tags: [Jobs]
      summary: 'Platform-wide job counters (public) — the aggregate companion to /jobs/mine/stats'
      description: >
        Aggregates only: jobs_posted, jobs_open, applicants_total,
        approved_total, businesses_hiring. Names nobody, so the rule that only
        the posting business sees applicant identities still holds.
      security: []
      responses:
        '200': { description: OK }
  /jobs/mine:
    get:
      tags: [Jobs]
      summary: My own job posts (business only)
      parameters: [{ $ref: '#/components/parameters/PerPage' }]
      responses:
        '200': { description: OK }
        '403': { description: Not a business account }
  /jobs/mine/stats:
    get: { tags: [Jobs], summary: The signed-in business's counters — jobs_posted, jobs_open, applicants_total, approved_total, responses: { '200': { description: OK }, '403': { description: Not a business account } } }
  /jobs/follows:
    get: { tags: [Jobs], summary: My followed job fields, responses: { '200': { description: OK } } }
    post:
      tags: [Jobs]
      summary: Follow a job field (a whole category or one specialty) for live push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id: { type: integer, description: Follow a whole root category. }
                category_child_id: { type: integer, description: Follow one specialty. At least one of the two is required. }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /jobs/follows/{follow}:
    delete: { tags: [Jobs], summary: Unfollow a job field, parameters: [{ name: follow, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /jobs/{post}:
    get: { tags: [Jobs], summary: Job detail — includes applicants_count, never applicant identities (public), security: [], parameters: [{ name: post, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK } } }
    post: { tags: [Jobs], summary: "The posting business edits its own vacancy — category/child are not editable", parameters: [{ name: post, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not the posting business }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Jobs], summary: The posting business deletes its own vacancy, parameters: [{ name: post, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not the posting business } } }
  /jobs/{post}/apply:
    post: { tags: [Jobs], summary: A client applies (once — a repeat is 422), parameters: [{ name: post, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } } }
  /jobs/{post}/close:
    post: { tags: [Jobs], summary: The posting business stops accepting applications, parameters: [{ name: post, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not the posting business } } }
  /jobs/{post}/applicants:
    get: { tags: [Jobs], summary: Full applicant list — the posting business only, parameters: [{ name: post, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not the posting business } } }
  /jobs/{post}/applicants/{apply}/approve:
    post: { tags: [Jobs], summary: The posting business accepts an applicant (idempotent, notifies them), parameters: [{ name: post, in: path, required: true, schema: { type: integer } }, { name: apply, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '403': { description: Not the posting business }, '404': { $ref: '#/components/responses/NotFound' } } }
  /visit-deposits/{kind}/{subject}/disputes:
    post:
      tags: [Disputes]
      summary: "Either party of a health visit opens a dispute over its HELD «عربون الجدية» (a no-show, a disagreement). kind = clinic-appointment | investigation-order | procedure-request. Body: reason_code (see /disputes/reason-codes), reason_text. The deposit stays frozen until an arbitrator rules; this is the only thing that holds an account back. 404 to a stranger, 422 when no wallet deposit is held."
      parameters: [{ name: kind, in: path, required: true, schema: { type: string, enum: [clinic-appointment, investigation-order, procedure-request] } }, { name: subject, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/clinic-appointments/{subject}/deposit/confirm-received:
    post: { tags: [Clinic Appointments], summary: "«عربون الجدية» owed outside the platform: the clinic records that it arrived (method cash|transfer, optional reference). Never gates the visit. Reply data.deposit {mode,status,amount,counter_amount,method,reference,dispute_id}", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/clinic-appointments/{subject}/deposit/waive:
    post: { tags: [Clinic Appointments], summary: "The clinic accepts the appointment without the deposit owed outside the platform", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/clinic-appointments/{subject}/deposit/give-back:
    post: { tags: [Clinic Appointments], summary: "The clinic returns a HELD wallet deposit (after a no-show, for instance) — both holds go back, nothing is kept", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/investigation-orders/{subject}/deposit/confirm-received:
