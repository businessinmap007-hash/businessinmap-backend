    post: { tags: [Schedules], summary: "A reservation's deposit owed outside the platform arrived (method cash|transfer). Never withholds the trip.", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/schedules/reservations/{subject}/deposit/waive:
    post: { tags: [Schedules], summary: "The carrier accepts the reservation without the deposit owed outside.", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/schedules/reservations/{subject}/deposit/give-back:
    post: { tags: [Schedules], summary: "The carrier returns a HELD wallet deposit (after a no-show) — both holds and any coverage go back.", parameters: [{ name: subject, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
