                goal: { type: string }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                notes: { type: string }
      responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/training-plans:
    get:
      tags: [Training]
      summary: My clients' training plans (trainer)
      parameters: [{ name: status, in: query, schema: { type: string } }, { name: client_id, in: query, schema: { type: integer } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: OK } }
    post:
      tags: [Training]
      summary: Create a plan for a client (trainer, or a `training` delegate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
