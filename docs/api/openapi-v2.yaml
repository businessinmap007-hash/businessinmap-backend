openapi: 3.0.3
info:
  title: BIM (Business In Map) — Mobile API v2
  version: "2.0.0"
  description: |
    The v2 API is the self-sufficient surface for the BIM mobile app. v1 is
    abandoned; everything the app needs lives under `/api/v2`.

    ## Conventions
    - **Auth**: Sanctum personal-access (Bearer) tokens. Send
      `Authorization: Bearer <token>`. Obtain one from `/auth/register` or
      `/auth/login`. Endpoints tagged as *public* need no token.
    - **Envelope**: successful responses are `{ "success": true, "data": ... }`;
      some also carry `message`. Paginated lists use Laravel's paginator shape
      (`data`, `links`, `meta`) — see `Paginated`.
    - **Errors**: validation failures return HTTP 422 as
      `{ "message": "...", "errors": { "field": ["..."] } }`. Auth failures are
      401, forbidden 403, missing 404, state conflicts 409.
    - **Idempotency**: money endpoints (`wallet/deposit|withdraw|transfer`)
      honour an `Idempotency-Key` header — repeating a key returns the first
      result instead of charging twice.
    - **Money**: the wallet is a points/credit store (deposits, insurance, fees,
      P2P transfer). It does NOT pay for menu orders — those are cash on arrival.

servers:
  - url: https://{host}/api/v2
    description: Deployment (paths below are relative to /api/v2)
    variables:
      host:
        default: businessinmap.com/testing

security:
  - bearerAuth: []

tags:
  - name: Medical
  - name: Talents
    description: |
      Young players publish a card from their own «ناشئ موهوب» business account
      through the ordinary posts endpoints; these are the SCOUT's side of it.

      The identity is behind a paywall because the subject is a minor: the name,
      the club and the video are hidden until a «مستكشف لاعبين» account pays,
      and every reveal is recorded against that account and dated. Opening a
      card is charged once per (player, scout) no matter how often it is
      reopened, and the player is never charged for being watched.
  - name: Auth
  - name: Password Reset
  - name: Account deletion
  - name: Profile
  - name: Categories
    description: |
      The marketplace's front door: root category → specialty → discovery.
      Discovery *requires* a `child_id` and nothing else in v2 returns one, so
      this is the only path an app has to its first business listing. `id` on a
      specialty is that `child_id`.
  - name: Locations
  - name: Addresses
  - name: Contact Groups
  - name: Wallet
  - name: Wallet Top-up
  - name: Merchant Payments
  - name: Cart
  - name: Shared Cart
  - name: Orders (Customer)
  - name: Orders (Business)
  - name: Business Hours
  - name: Business Staff
    description: >-
      Delegated staff on a business account — a clinic secretary, a shop/
      restaurant employee — each granted a set of capabilities from the one
      shared services registry. They then act AS the business on those surfaces.
  - name: Investigations
    description: >-
      Investigation orders («طلب تحاليل وأشعة»): a doctor orders lab tests and radiology exams for a patient, picked from the platform's own lists
      (never typed); the patient shares the order with a registered lab or radiology centre — or asks one directly, with no doctor — and sees
      what each centre would charge for the whole order; the centre accepts it (with a time), declines it, or attaches the results as photos.
      Only the doctor, the patient and the centre may read an order. Files are private, behind signed links.
  - name: HospitalProcedures
    description: >-
      Medical procedures of a hospital («إجراء طبي»): surgeries, endoscopies and treatment procedures picked from the platform's list (or added by the
      hospital itself, seen by it alone), each with the hospital's OWN price (none = «السعر بعد التقييم»). A patient asks for one; the hospital accepts
      it with a date (quoting a price when it had none — a listed price is never overwritten), declines it, and marks it done.
  - name: SpecialtyServices
    description: >-
      Services of a specialty clinic («خدمات التخصص»): a dental clinic's cleaning, fillings, root canals, implants, braces…; a dermatology and
      cosmetic clinic's fillers, botox, laser, scar treatment, non-surgical lifting… — picked from the platform's list for the specialty (or
      added by the clinic itself, seen by it alone), each with the clinic's OWN price (none = «السعر بعد الكشف»). Only a single clinic or a
      medical centre that ticked the specialty («أسنان» · «جلديه وتناسليه» / «جراحة تجميل») has its list; a clinic with both has both in one.
      A patient names the service he came for when booking (`specialty_service_id`).
  - name: HospitalDoctors
    description: >-
      Doctors under a hospital's departments («الأطباء تحت الأقسام»): the departments are the medical specialties a hospital or medical centre
      ticked on itself; it lists doctors under each. A doctor with an account on the app joins only by accepting (so nobody is listed without
      agreeing) and a patient can open that doctor's page from under the department; a doctor with no account is listed as text.
  - name: Prescriptions
    description: >-
      Medical prescriptions (روشتة): a doctor (clinic business) issues one for a
      patient, who sends it to a pharmacy (business) to dispense — delivery or
      pickup. Readable only by the three parties.
  - name: Training
    description: >-
      Training & nutrition plans: a trainer (a gym/coach business) builds a
      client's workout + meals; the client reads it and logs progress. Readable
      only by the trainer and the client. Delegable via the `training` capability.
  - name: Assignments
    description: |
      «نظام التعيين»: who is responsible for a booking at a business — one door for every kind of business.
  - name: Clinic Appointments
    description: >-
      Clinic appointments: a patient requests a time at a clinic (a business),
      the clinic confirms/completes it without double-booking, or the clinic
      books directly. Readable only by the two parties. Delegable via the
      `clinic` capability (e.g. a clinic secretary).
  - name: Agenda
    description: >-
      A user's personal agenda: one unified day of appointments, service
      bookings, medication doses and self-added tasks. Blocking items can't
      overlap, so nothing double-books the same person across services. Includes
      meal times (which time food-tied medication doses).
  - name: Projects
    description: >-
      A business's internal project-management timeline for manufacturing and
      construction — dated, dependent tasks with a computed critical path, and
      camera-captured progress evidence per stage.
  - name: Business Menu
  - name: Business Offers
  - name: Partnerships
  - name: Trip Programs
  - name: Business Prices
  - name: Business Bookables
  - name: Business Retail
  - name: Delivery
  - name: Shipping
    description: Governorate shipping - a Shipping & Delivery company's price list, appointments and shipped / delivered.
  - name: Order Handover
  - name: Business Page
  - name: Operator Presence
  - name: Tables
  - name: Schedules
    description: |
      Scheduling / routes service. A carrier publishes trip legs — "we run
      Cairo→Damietta every Sunday, 14 seats" — and customers search a route and
      day. One entity serves four modes: freight, passenger, limousine and
      distribution. Domestic legs anchor on governorates, international ones on
      countries.
  - name: Schedules (Carrier)
    description: Publishing legs and working their reservation desk. Business accounts only.
  - name: Bookings
  - name: Owner Listings
    description: «إعلان من المالك» — any account lists ONE item per category (car, flat, any used thing) for sale, rent or swap, with no business account; the listing is removed 3 days after it is sold or rented; no phone numbers until buyer and seller pay the platform's fee to swap them.
  - name: Reports & Moderation
    description: «الإبلاغ» — anyone reports a post or an owner listing (once per person); an account holding the content ability is a moderator and works the queue, one row per reported item.
  - name: Service Requests
    description: The requests-and-offers core — a customer posts a need (a limousine ride), the businesses that may answer make offers, he picks one and it becomes a booking.
  - name: Guarantees
  - name: Operation Guarantors
  - name: Ratings
    description: |
      Two different things share the word "rating". The **operation rating** is
      objective and automatic — every completed/cancelled/disputed operation is
      ledgered, giving success and dispute percentages. A **star review** is
      subjective, written by a party, and only allowed after a real completed
      operation between the two.
  - name: Notifications
  - name: Push Tokens
  - name: Discovery
  - name: Search
  - name: Jobs
    description: |
      A business posts a vacancy (any field, no fee/rating — closer to Offers
      than to Booking/Menu). Public sees the job and an applicant COUNT only;
      full applicant identity is visible only to the posting business via
      GET /jobs/{post}/applicants.
  - name: Deposits
    description: |
      Escrow held against an operation. **Read-only in v2, deliberately.**
      Creating, releasing and refunding belong to the booking flow
      (BookingDepositService) and to dispute rulings (DisputeService), which
      know why the money is moving. v1 exposed those as raw REST with no
      authorization at all; re-exposing them here would rebuild that hole.
      You only ever see deposits you are a party to.
  - name: Disputes
    description: |
      A grievance over an operation, and the escrow frozen behind it. Opening
      is the point of these endpoints: the whole mechanism — freezing,
      warnings, escalation, rulings that move money — existed with no way for
      the party who had the grievance to reach it.

      **Ruling is admin-only and deliberately absent here.** A party deciding
      their own dispute would be the v1 escrow hole in a new namespace. Time
      moves a dispute instead: an unmet settlement window escalates itself to
      review (`disputes:process`). You only ever see disputes you are a party
      to, and never the admin's notes or the internal file.
  - name: Operation Chats
    description: |
      The native customer↔business chat on an operation (order or booking) —
      the trusted, in-app alternative to attaching forgeable screenshots from
      elsewhere. Only the two parties to the operation may read or post; a
      stranger gets 404, never 403. Messages can carry image attachments (same
      as the dispute room). A chat is kept for 7 days after the operation
      completes, then it locks (read-only) and an admin can delete it.
  - name: Chats
    description: |
      General person-to-person chat (direct messages) — a conversation about
      nothing in particular, deduped to one thread per pair. Only a participant
      may read or post; a stranger gets 404. Messages can carry image
      attachments, same as everywhere else. No conduct charter, no retention.
  - name: Fines
    description: |
      Platform fines for fraud/abuse, levied on a user outside a dispute. You
      can only see and contest your own. Levy, decide and collect are the
      platform's, on the admin side — never here. The money is frozen at levy
      and captured only after the appeal window closes; a successful appeal
      costs nothing. A fine you already consented to in a settlement is not
      appealable.
  - name: Posts
    description: |
      The social feed. Browsing is public, but sending a bearer token
      personalises it: a signed-in reader sees only authors they are entitled
      to — businesses targeting their category, accounts they follow,
      categories they follow, accounts targeting them — and never their own
      posts. Job postings are excluded here; they live under Jobs.
  - name: Follows
    description: Follow/unfollow another account — the table the personal feed's audience is built from.
  - name: Retail Discovery
    description: Customer-facing retail browsing (public shelf, cross-seller product pages, one seller's storefront).
  - name: Business Groups
    description: A business's own named groups of other businesses — a reusable target list for directed offers.
  - name: Staff
    description: Delegated staff management, invitations, and attendance check-in/out.
  - name: Thread Access
    description: >-
      A chat participant's own standing say over whether an admin may ever
      read this thread's decrypted content — independent of any specific
      admin request, and separate from a dispute's own evidence rules.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal-access token.

  parameters:
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Repeat-safe key for money movements.

  responses:
    Unauthorized:
      description: Missing or invalid token.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not allowed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found / not owned.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Not allowed in the resource's current state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Validation:
      description: Validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Paginated:
      type: object
      description: Laravel length-aware paginator.
      properties:
        current_page: { type: integer }
        data: { type: array, items: {} }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        links: { type: array, items: { type: object } }
    Account:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        type: { type: string, enum: [client, business] }
        is_business: { type: boolean }
        about: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        cover: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        category_id: { type: integer, nullable: true }
        category_child_id: { type: integer, nullable: true }
        balance: { type: number }
    TokenResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Account' }
        token: { type: string, description: Bearer token to send on later requests. }
    Address:
      type: object
      properties:
        id: { type: integer }
        country_id: { type: integer, nullable: true }
        governorate_id: { type: integer }
        city_id: { type: integer }
        zip_code: { type: string, nullable: true }
        address_line: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        is_primary: { type: boolean }
    WalletBalance:
      type: object
      properties:
        balance: { type: number }
        locked_balance: { type: number }
        available_balance: { type: number }
        total_in: { type: number }
        total_out: { type: number }
        status: { type: string }
        last_activity_at: { type: string, format: date-time, nullable: true }
    WalletTransaction:
      type: object
      properties:
        id: { type: integer }
        direction: { type: string, enum: [in, out] }
        type: { type: string, enum: [deposit, withdraw, hold, release, refund, transfer, platform_fee] }
        status: { type: string }
        amount: { type: number }
        balance_after: { type: number }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    WalletTopup:
      type: object
      properties:
        id: { type: integer }
        gateway: { type: string, example: fawry }
        merchant_ref: { type: string }
        amount: { type: number }
        currency: { type: string, example: EGP }
        status: { type: string, enum: [pending, paid, failed, expired] }
        method: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [cart, pending, completed, cancelled] }
        prep_status: { type: string, nullable: true, enum: [accepted, preparing, ready] }
        handled_by: { type: object, description: "Only for the business's own people (never the customer): who accepted the order and who pressed «preparing» — `{accepted_by:{id,name}|null, preparing_by:{id,name}|null}`. The first to press preparing owns it; a second press gets 409.", properties: { accepted_by: { type: object, nullable: true }, preparing_by: { type: object, nullable: true } } }
        fulfillment_type: { type: string, enum: [delivery, pickup, dine_in] }
        delivery_stage: { type: string, nullable: true, enum: [assigned, picked_up, delivered] }
        is_shared: { type: boolean }
        totals:
          type: object
          properties:
            total: { type: number }
            delivery_fee: { type: number }
            discount: { type: number }
            service_fee: { type: number }
            tax: { type: number }
            final_total: { type: number }
        payment_method: { type: string }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        out_of_stock_policy: { type: string, nullable: true, enum: [substitute, remove, cancel], description: "What the customer chose at checkout for a line that turns out unavailable; null on orders placed before this existed." }
        has_project: { type: boolean, description: "Whether the business linked a project timeline to this order — most orders never have one." }
        business_table_id: { type: integer, nullable: true, description: "Dine-in table id (BIM-13.3) when the order came from a table scan." }
        table_label: { type: string, nullable: true, description: "The dine-in table label; present when the businessTable relation is loaded." }
        business: { type: object, nullable: true }
        customer: { type: object, nullable: true }
        items_count: { type: integer }
        items: { type: array, items: { type: object } }
        handover_confirmed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    MenuSection:
      type: object
      properties:
        id: { type: integer }
        name_ar: { type: string }
        name_en: { type: string, nullable: true }
        sort_order: { type: integer }
        is_active: { type: boolean }
    MenuItem:
      type: object
      properties:
        id: { type: integer }
        name_ar: { type: string }
        name_en: { type: string, nullable: true }
        menu_section_id: { type: integer, nullable: true }
        description_ar: { type: string, nullable: true }
        description_en: { type: string, nullable: true }
        base_price: { type: number }
        sort_order: { type: integer }
        is_active: { type: boolean }
        variants: { type: array, items: { type: object } }
        extras: { type: array, items: { type: object } }
    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        priority: { type: string }
        title_ar: { type: string, nullable: true }
        title_en: { type: string, nullable: true }
        body_ar: { type: string, nullable: true }
        body_en: { type: string, nullable: true }
        status: { type: string, enum: [unread, read, archived] }
        action_type: { type: string, nullable: true }
        action_url: { type: string, nullable: true }
        meta: { type: object, nullable: true }
        created_at: { type: string, format: date-time }

    TripSchedule:
      type: object
      description: One published trip leg.
      properties:
        id: { type: integer }
        business_id: { type: integer }
        business: { type: object, nullable: true, description: 'Carrier {id,name,logo}; present on search results.' }
        mode: { type: string, enum: [freight, passenger, limousine, distribution] }
        vehicle_type: { type: object, nullable: true, description: 'The platform vehicle/cargo class {id,key,name}.' }
        vehicle_label: { type: string, nullable: true, description: The carrier's own name for the vehicle. }
        scope: { type: string, enum: [domestic, international] }
        origin:
          type: object
          description: Governorate anchors a domestic leg; country anchors an international one.
          properties:
            country_id: { type: integer, nullable: true }
            country: { type: string, nullable: true }
            governorate_id: { type: integer, nullable: true }
            governorate: { type: string, nullable: true }
            city_id: { type: integer, nullable: true }
        destination:
          type: object
          properties:
            country_id: { type: integer, nullable: true }
            country: { type: string, nullable: true }
            governorate_id: { type: integer, nullable: true }
            governorate: { type: string, nullable: true }
            city_id: { type: integer, nullable: true }
        schedule_pattern: { type: string, enum: [weekly, one_off, on_demand] }
        day_of_week: { type: integer, nullable: true, minimum: 0, maximum: 6, description: '0=Sunday .. 6=Saturday. Set when schedule_pattern=weekly.' }
        trip_date: { type: string, format: date, nullable: true, description: Set when schedule_pattern=one_off. }
        departure_time: { type: string, nullable: true, example: '09:00' }
        return_time: { type: string, nullable: true }
        capacity: { type: integer, nullable: true, description: null means unlimited (e.g. on-demand). }
        capacity_unit: { type: string, nullable: true, example: seat }
        price: { type: number, nullable: true, description: Per unit. }
        deposit_per_unit: { type: number, nullable: true, description: Refundable; held from the client's wallet on reserve. }
        currency: { type: string, example: EGP }
        is_return_leg: { type: boolean, description: A discounted backhaul off a parent trip. }
        parent_trip_id: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [active, paused, expired, cancelled] }
    ScheduleTrust:
      type: object
      description: Why this carrier ranks where it does — the search's trust block.
      properties:
        has_guarantee: { type: boolean }
        coverage_amount: { type: number, nullable: true }
        success_rate: { type: number, nullable: true, description: Percentage of operations completed successfully. }
        dispute_rate: { type: number, nullable: true }
        stars: { type: number, nullable: true }
    TripScheduleSearchResult:
      type: object
      properties:
        schedule: { $ref: '#/components/schemas/TripSchedule' }
        trust: { $ref: '#/components/schemas/ScheduleTrust' }
        remaining_capacity: { type: integer, nullable: true, description: null means unlimited. Already nets off in-app and offline holds. }
    TripReservation:
      type: object
      properties:
        id: { type: integer }
        trip_schedule_id: { type: integer }
        business_id: { type: integer }
        client_id: { type: integer, nullable: true, description: null for a carrier's offline hold. }
        source: { type: string, enum: [app, offline] }
        units: { type: integer }
        unit_price: { type: number, nullable: true }
        total_price: { type: number, nullable: true }
        deposit_held: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, confirmed, completed, cancelled, blocked] }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    VehicleType:
      type: object
      description: A platform-standard vehicle/cargo class for the scheduling service.
      properties:
        id: { type: integer }
        key: { type: string, example: freight_refrigerated }
        name: { type: string }
        mode: { type: string, nullable: true }
        scope: { type: string, nullable: true, enum: [domestic, international] }
        default_unit: { type: string, nullable: true }
        is_default: { type: boolean }
        group: { type: object, nullable: true, description: 'The mode branch this class hangs off {id,key,name}.' }
    TripRun:
      type: object
      description: One live execution of a trip leg — see TripRunService.
      properties:
        id: { type: integer }
        trip_schedule_id: { type: integer }
        mode: { type: string, nullable: true }
        vehicle_label: { type: string, nullable: true }
        status: { type: string, enum: [in_progress, awaiting_reconciliation, completed] }
        passenger_count: { type: integer, nullable: true, description: Set at start for passenger/limousine legs only. }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        current_stop_id: { type: integer, nullable: true }
        stops:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              sequence: { type: integer }
              label: { type: string }
              address: { type: string, nullable: true }
              status: { type: string, enum: [pending, heading, arrived, done] }
              arrived_at: { type: string, format: date-time, nullable: true }
              completed_at: { type: string, format: date-time, nullable: true }
        manifest_items:
          type: array
          description: Freight/distribution only.
          items:
            type: object
            properties:
              id: { type: integer }
              label: { type: string }
              unit: { type: string, nullable: true }
              assigned_qty: { type: integer }
              delivered_qty: { type: integer, nullable: true }
              returned_qty: { type: integer, nullable: true }
              remaining_qty: { type: integer, nullable: true, description: Computed; only present once the run is completed. }

paths:
  # ─────────────────────────── Auth ───────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 191 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 15 }
                password: { type: string, minLength: 6 }
                password_confirmation: { type: string }
                type: { type: string, enum: [client, business] }
                category_id: { type: integer }
                category_child_id: { type: integer }
                option_ids: { type: array, items: { type: integer }, description: 'Non-line attributes describing this business (a doctor''s specialty included) — same rule as PATCH /profile/options, pickable right at signup.' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current account
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses: { '200': { description: OK } }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every token for this account
      responses: { '200': { description: OK } }

  # ─────────────────────── Password Reset ───────────────────────
  /auth/password/forgot:
    post:
      tags: [Password Reset]
      summary: Request a reset code by email (public, no enumeration, throttled 6/min)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses: { '200': { description: Generic answer whether or not the account exists. } }
  /auth/password/resend:
    post:
      tags: [Password Reset]
      summary: Resend the reset code (alias of forgot)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses: { '200': { description: OK } }
  /auth/password/verify:
    post:
      tags: [Password Reset]
      summary: Check a code without consuming it (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, code], properties: { email: { type: string }, code: { type: string } } }
      responses:
        '200': { description: Valid. }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/password/reset:
    post:
      tags: [Password Reset]
      summary: Set a new password with a valid code (public, revokes all tokens)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password, password_confirmation]
              properties:
                email: { type: string }
                code: { type: string }
                password: { type: string, minLength: 6 }
                password_confirmation: { type: string }
      responses:
        '200': { description: Password changed. }
        '422': { $ref: '#/components/responses/Validation' }

  # ──────────────────── Classification — the front door ────────────────────
  # /discovery/* REQUIRES a child_id and nothing in v2 returned one, so the app
  # could not browse a single business. root category -> specialty -> discovery.
  /categories:
    get:
      tags: [Categories]
      summary: Root categories — the app's opening screen (public)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name_ar: { type: string }
                            name_en: { type: string, nullable: true }
                            slug: { type: string, nullable: true }
                            image: { type: string, nullable: true }

  /categories/{category}/specialties:
    get:
      tags: [Categories]
      summary: The specialties under a category — these ids are discovery's child_id (public)
      security: []
      description: >
        `id` here is what /discovery/filters and /discovery/businesses take as
        child_id. `businesses` is how many businesses actually sell it, so the
        app can tell a dead end before the customer taps it.
      parameters:
        - { name: category, in: path, required: true, schema: { type: integer } }
        - { name: sellable, in: query, schema: { type: boolean }, description: Drop specialties nobody sells. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      specialties:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, description: discovery's child_id }
                            name_ar: { type: string }
                            name_en: { type: string, nullable: true }
                            businesses: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────── Geography (BIM-11.1) ────────────────────
  # Public: an address is picked at registration and checkout, before there is a
  # token. Source of truth is countries / governorates / cities — NOT the
  # `locations` tree, which holds only unnamed country rows.
  /locations/countries:
    get:
      tags: [Locations]
      summary: All countries (public)
      security: []
      description: Full ISO 3166-1 officially assigned list.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Filters on Arabic/English name or ISO code. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      countries:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name_ar: { type: string }
                            name_en: { type: string }
                            iso2: { type: string }
                            phone_code: { type: string, nullable: true }
                            flag: { type: string, nullable: true }

  /locations/governorates:
    get:
      tags: [Locations]
      summary: Governorates of one country (public)
      security: []
      description: >
        country_id is required and not defaulted: a silent default returns a
        plausible-looking list for the wrong country and the caller cannot tell.
      parameters:
        - { name: country_id, in: query, required: true, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      governorates:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            country_id: { type: integer }
                            name_ar: { type: string }
                            name_en: { type: string }
                            latitude: { type: number, nullable: true }
                            longitude: { type: number, nullable: true }
        '422': { $ref: '#/components/responses/Validation' }

  /locations/cities:
    get:
      tags: [Locations]
      summary: Cities of one governorate (public)
      security: []
      description: Capped at 300 — the picker is a search box, not a scroll.
      parameters:
        - { name: governorate_id, in: query, required: true, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      cities:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            governorate_id: { type: integer }
                            name_ar: { type: string }
                            name_en: { type: string }
                            latitude: { type: number, nullable: true }
                            longitude: { type: number, nullable: true }
        '422': { $ref: '#/components/responses/Validation' }

  /locations/cities/search:
    get:
      tags: [Locations]
      summary: Type-ahead city search across governorates (public)
      security: []
      description: >
        For "I know the town, not the governorate". Each row carries its
        governorate so the form can fill the parent in from the child. Capped at 30.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: governorate_id, in: query, schema: { type: integer }, description: Optional narrowing. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      cities:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name_ar: { type: string }
                            name_en: { type: string }
                            governorate:
                              type: object
                              nullable: true
                              properties:
                                id: { type: integer }
                                country_id: { type: integer }
                                name_ar: { type: string }
                                name_en: { type: string }
        '422': { $ref: '#/components/responses/Validation' }

  /locations/nearest:
    get:
      tags: [Locations]
      summary: Nearest city to a GPS point (public)
      security: []
      description: >
        "Use my location": resolves a device GPS point to one of our own cities
        with no map provider or third-party geocoder involved. Beyond the
        distance cap (config bim.location.nearest_max_km, default 60 km) it
        returns match=null and the app falls back to the manual pickers.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: float, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, format: float, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      match:
                        type: object
                        nullable: true
                        properties:
                          city:
                            type: object
                            properties:
                              id: { type: integer }
                              governorate_id: { type: integer }
                              name_ar: { type: string }
                              name_en: { type: string }
                              latitude: { type: number, format: float }
                              longitude: { type: number, format: float }
                          governorate:
                            type: object
                            nullable: true
                            properties:
                              id: { type: integer }
                              country_id: { type: integer }
                              name_ar: { type: string }
                              name_en: { type: string }
                          country_id: { type: integer, nullable: true }
                          distance_km: { type: number, format: float }
        '422': { $ref: '#/components/responses/Validation' }

  # ──────────────────── Account deletion (BIM-15.1) ────────────────────
  /account/deletion:
    get:
      tags: [Account deletion]
      summary: May I delete my account, and if not, why not?
      description: >
        Eligibility is a read of its own so the app can show what must be
        finished first. Blocker codes: banned, platform_account, open_dispute,
        pending_bookings, pending_orders, pending_deliveries,
        pending_reservations, guarantor_obligation, locked_balance.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      can_delete: { type: boolean }
                      blockers:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string }
                            message: { type: string }
                            count: { type: integer }
                      grace_days: { type: integer }
                      pending_deletion: { type: boolean }
                      balance_transfer:
                        type: object
                        properties:
                          allowed: { type: boolean }
                          reason: { type: string, nullable: true }
                          available_at: { type: string, nullable: true }
    post:
      tags: [Account deletion]
      summary: Request deletion (soft delete + wallet freeze + revoke all tokens)
      description: >
        Password-confirmed. The balance does NOT move: the account is restorable
        for grace_days, after which the balance escheats to the platform and the
        identity is anonymized. A 422 carries the blocker list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                reason: { type: string, maxLength: 500, nullable: true }
      responses:
        '200':
          description: Deletion requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      deletion_requested_at: { type: string }
                      restorable_until: { type: string }
        '422': { $ref: '#/components/responses/Validation' }

  /account/deletion/cancel:
    post:
      tags: [Account deletion]
      summary: Restore an account inside the grace window (public, throttled)
      description: >
        Public by necessity — requesting deletion revoked every token, so there
        is nothing to authenticate with. It verifies the password itself and is
        throttled like the login it effectively is. One message covers unknown
        account, wrong password and expired window, so it cannot be used to
        discover which addresses exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Account restored; a fresh token is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  token: { type: string }
        '422': { $ref: '#/components/responses/Validation' }

  # ─────────────────────────── Profile ───────────────────────────
  /profile:
    get:
      tags: [Profile]
      summary: Read own account
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } } }
    patch:
      tags: [Profile]
      summary: "Edit basic fields. A business may change its trade (category_id + category_child_id — the child must stand under the root) on the same account: the first call answers 409 with requires_confirmation and will_delete (menu items, sections, bundles, retail listings, prices, bookable units, tables, vocabulary ticks); resend with confirm_reset=true to delete them and move the account to the new trade. 422 with cooling_off {days:15, last_activity_at, available_at} until 15 days have passed since the account's last sale or booking (a guarantee against shedding a bad record by changing trade), and with blockers while an order, booking or frozen deposit is still open. The success body carries trade_switch.deleted."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_reset: { type: boolean }
                name: { type: string }
                phone: { type: string }
                about: { type: string, nullable: true }
                latitude: { type: number }
                longitude: { type: number }
                category_id: { type: integer }
                category_child_id: { type: integer }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /profile/options:
    get:
      tags: [Profile]
      summary: The attributes catalog for a business's own specialty, marked with its current picks
      description: >
        `terms` is «شروط المتجر» — the groups the trade asks the store to answer (returns, delivery & pickup,
        minimum order, trade scope), each with all its options and `selected` flags; they are edited HERE and
        nowhere else, and what is ticked is exactly what customers read on the store page, at checkout and on the
        order. `groups` are the specialty's other attributes (never the same group twice); `selected_ids` covers both.
      responses: { '200': { description: OK }, '403': { description: Not a business account } }
    patch:
      tags: [Profile]
      summary: A business sets which attributes describe it (full replace)
      description: >
        option_ids must all belong to the option set linked to the business's own
        category_child_id (category_child_option) or to a group of its «شروط المتجر» — a business can only pick
        attributes valid for its own specialty. Send an empty array to clear all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_ids]
              properties:
                option_ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: OK }
        '403': { description: Not a business account }
        '422': { $ref: '#/components/responses/Validation' }
  /profile/password:
    post:
      tags: [Profile]
      summary: Change password (revokes other tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 6 }
                password_confirmation: { type: string }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }

  /profile/image:
    post:
      tags: [Profile]
      summary: Set or remove the account photo (multipart — POST, not PUT/PATCH, since PHP cannot decode a file upload on those verbs)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary, description: 'Omit and send remove=1 to clear the current photo.' }
                remove: { type: boolean }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /profile/cover:
    post:
      tags: [Profile]
      summary: Set or remove the account cover photo (multipart — POST, not PUT/PATCH, since PHP cannot decode a file upload on those verbs)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cover: { type: string, format: binary, description: 'Omit and send remove=1 to clear the current cover.' }
                remove: { type: boolean }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }

  # First v2 surface for the legacy Album model — a signed-in account's own
  # photo albums. Every route re-checks ownership by hand since implicit
  # route-model-binding resolves ANY album id, not just the caller's.
  /profile/albums:
    get: { tags: [Profile], summary: My photo albums, responses: { '200': { description: OK } } }
    post:
      tags: [Profile]
      summary: Create an album
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title_ar]
              properties:
                title_ar: { type: string, maxLength: 191 }
                title_en: { type: string, maxLength: 191, nullable: true }
                description_ar: { type: string, maxLength: 2000, nullable: true }
                description_en: { type: string, maxLength: 2000, nullable: true }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /profile/albums/{album}:
    parameters: [{ name: album, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Profile], summary: One album with its photos, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
    patch: { tags: [Profile], summary: Edit an album's title/description, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Profile], summary: Delete an album (and its photo files), responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /profile/albums/{album}/photos:
    post:
      tags: [Profile]
      summary: Add a photo to an album
      parameters: [{ name: album, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                source: { type: string, enum: [camera, upload] }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /profile/albums/{album}/photos/{photo}:
    delete:
      tags: [Profile]
      summary: Remove a photo from an album
      parameters:
        - { name: album, in: path, required: true, schema: { type: integer } }
        - { name: photo, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  # ─────────────────────────── Addresses ───────────────────────────
  /addresses:
    get:
      tags: [Addresses]
      summary: List saved addresses (primary first)
      responses: { '200': { description: OK } }
    post:
      tags: [Addresses]
      summary: Add an address (first one becomes primary)
      description: >
        Ids come from /locations/* — governorate_id from /locations/governorates
        and city_id from /locations/cities. The hierarchy is enforced: the city
        must belong to the governorate, and the governorate to the country. Omit
        country_id and it is derived from the governorate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [governorate_id, city_id, address_line]
              properties:
                country_id: { type: integer, description: Optional; derived from the governorate when absent. }
                governorate_id: { type: integer, description: From /locations/governorates. }
                city_id: { type: integer, description: From /locations/cities. Must belong to governorate_id. }
                address_line: { type: string, minLength: 5, maxLength: 191 }
                zip_code: { type: string }
                lat: { type: number }
                lng: { type: number }
                is_primary: { type: boolean }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /addresses/{address}:
    parameters: [{ name: address, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Addresses]
      summary: Update an address
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Addresses]
      summary: Delete (promotes newest if it was primary)
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /addresses/{address}/primary:
    post:
      tags: [Addresses]
      summary: Make this address primary
      parameters: [{ name: address, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }

  # ─────────────────────── Contact Groups ───────────────────────
  /contact-groups:
    get:
      tags: [Contact Groups]
      summary: List the caller's own named contact groups (e.g. "family", "friends"), newest first
      responses: { '200': { description: OK } }
    post:
      tags: [Contact Groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /contact-groups/{group}:
    parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Contact Groups]
      summary: Rename a group (own only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
    delete:
      tags: [Contact Groups]
      summary: Delete a group (own only) and all its membership rows
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /contact-groups/{group}/members:
    post:
      tags: [Contact Groups]
      summary: Add a member by phone or email — an already-registered account only
      parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, description: Phone number or email of an existing account. }
      responses:
        '201': { description: Created }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /contact-groups/{group}/members/{member}:
    delete:
      tags: [Contact Groups]
      summary: Remove a member from the group (own group only)
      parameters:
        - { name: group, in: path, required: true, schema: { type: integer } }
        - { name: member, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }

  # ─────────────────────────── Wallet ───────────────────────────
  /wallet:
    get:
      tags: [Wallet]
      summary: Balance summary
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/WalletBalance' } } } } } } }
  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: Paginated ledger (newest first)
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [in, out] } }
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK } }
  /wallet/deposit:
    post:
      tags: [Wallet]
      summary: Top up own wallet (points)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount], properties: { amount: { type: number, minimum: 0.01 }, note: { type: string } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/WalletTransaction' } } } } } } }
  /wallet/withdraw:
    post:
      tags: [Wallet]
      summary: Withdraw (PIN-gated)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount, pin], properties: { amount: { type: number, minimum: 0.01 }, pin: { type: string }, note: { type: string } } }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation', description: 'Wrong PIN or insufficient balance.' }
  /wallet/transfer:
    post:
      tags: [Wallet]
      summary: Transfer points to another user (PIN-gated, self blocked)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [to_user_id, amount, pin], properties: { to_user_id: { type: integer }, amount: { type: number, minimum: 0.01 }, pin: { type: string }, note: { type: string } } }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /wallet/pin:
    get:
      tags: [Wallet]
      summary: Whether a wallet PIN is set
      responses: { '200': { description: OK } }
    post:
      tags: [Wallet]
      summary: Set or change the PIN (change needs current_pin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pin, pin_confirmation], properties: { pin: { type: string, pattern: '^\d{4,6}$' }, pin_confirmation: { type: string }, current_pin: { type: string } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /wallet/pin/verify:
    post:
      tags: [Wallet]
      summary: Verify a PIN without spending
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [pin], properties: { pin: { type: string } } } } }
      responses: { '200': { description: OK } }

  # ─────────────────────── Wallet Top-up ───────────────────────
  /wallet/topup:
    post:
      tags: [Wallet Top-up]
      summary: Start a real-money top-up (returns hosted-checkout payload)
      description: Creates a `pending` intent and returns the gateway's hosted-checkout payload. The wallet is credited only by the gateway callback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount], properties: { amount: { type: number }, gateway: { type: string, example: fawry } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/WalletTopup' }
                  payment:
                    type: object
                    properties:
                      gateway: { type: string }
                      merchant_ref: { type: string }
                      init_url: { type: string }
                      charge_request: { type: object }
  /wallet/topup/{topup}:
    get:
      tags: [Wallet Top-up]
      summary: Poll a top-up's status (own only)
      parameters: [{ name: topup, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /wallet/topup/callback:
    post:
      tags: [Wallet Top-up]
      summary: Gateway server-to-server callback (PUBLIC — the gateway calls it)
      security: []
      description: Verifies the signed payload, then idempotently credits the wallet. Not called by the app.
      parameters: [{ name: gateway, in: query, schema: { type: string } }]
      responses:
        '200': { description: Acknowledged. }
        '400': { description: Invalid signature. }
        '422': { description: Amount mismatch. }

  # ─────────────────── Merchant Account (business applies) ───────────────────
  /merchant-account:
    get:
      tags: [Merchant Payments]
      summary: A business's own merchant sub-account status (has account / pending request)
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /merchant-account/request:
    post:
      tags: [Merchant Payments]
      summary: Apply for a Fawry merchant sub-account (business only)
      responses: { '201': { description: Created }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { description: Not eligible (not a business / already has one / pending). } }

  # ─────────────────── Merchant Payments (customer→merchant) ───────────────────
  /merchant-payments:
    post:
      tags: [Merchant Payments]
      summary: Pay a merchant (routed to the merchant's sub-account when configured)
      description: Creates a pending intent and returns the hosted-checkout payload. Settles to the merchant's own gateway account, not the platform wallet.
      responses: { '201': { description: Created }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { description: Validation error. } }
  /merchant-payments/{payment}:
    get:
      tags: [Merchant Payments]
      summary: Poll a merchant payment's status (own only)
      parameters: [{ name: payment, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /merchant-payments/callback:
    post:
      tags: [Merchant Payments]
      summary: Gateway server-to-server callback (PUBLIC — the gateway calls it)
      security: []
      description: Verifies the signed payload with the merchant's (or platform's) key, then idempotently marks the payment paid. No wallet is credited.
      responses:
        '200': { description: Acknowledged. }
        '400': { description: Invalid signature. }
        '404': { description: Unknown reference. }
        '422': { description: Amount mismatch. }

  # ─────────────────────────── Cart ───────────────────────────
  /cart:
    get: { tags: [Cart], summary: Current draft cart, responses: { '200': { description: OK } } }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a line (retail or menu offering)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, offering_id]
              properties:
                kind: { type: string, enum: [retail, menu] }
                offering_id: { type: integer }
                qty: { type: integer, minimum: 1, maximum: 999 }
                size_id: { type: integer, description: menu variant id }
                extras: { type: array, items: { type: integer } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }
  /cart/items/{item}:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Cart]
      summary: Change a line's quantity (0 removes)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [qty], properties: { qty: { type: integer, minimum: 0, maximum: 999 } } } } } }
      responses: { '200': { description: OK } }
    delete: { tags: [Cart], summary: Remove a line, responses: { '200': { description: OK } } }
  /cart/{business}/checkout:
    post:
      tags: [Cart]
      summary: Place the order for a business (cash)
      parameters: [{ name: business, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fulfillment_type: { type: string, enum: [delivery, pickup, dine_in] }
                address_id: { type: integer, description: A saved address book entry (must be the caller's); wins over the free string. }
                address: { type: string, description: Free-text fallback used only when address_id is absent. }
                notes: { type: string }
                payment_method: { type: string }
                out_of_stock_policy: { type: string, enum: [substitute, remove, cancel], description: "What to do if a line turns out unavailable while the business prepares it — applied later by /business/orders/{order}/items/{item}/unavailable." }
      responses: { '200': { description: OK } }

  # ──────────────────────── Shared Cart ────────────────────────
  /cart/{business}/share:
    post:
      tags: [Shared Cart]
      summary: Open a shared (group) cart and get its join token
      parameters: [{ name: business, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /cart/join/{token}:
    post:
      tags: [Shared Cart]
      summary: Join a shared cart by token
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /cart/shared/{order}:
    parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Shared Cart], summary: View a shared cart, responses: { '200': { description: OK } } }
    delete: { tags: [Shared Cart], summary: Cancel a shared cart (host), responses: { '200': { description: OK } } }
  /cart/shared/{order}/items:
    post:
      tags: [Shared Cart]
      summary: Add an attributed line to a shared cart
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /cart/shared/{order}/items/{item}:
    parameters:
      - { name: order, in: path, required: true, schema: { type: integer } }
      - { name: item, in: path, required: true, schema: { type: integer } }
    patch: { tags: [Shared Cart], summary: Update own shared-cart line, responses: { '200': { description: OK } } }
    delete: { tags: [Shared Cart], summary: Remove own shared-cart line, responses: { '200': { description: OK } } }
  /cart/shared/{order}/checkout:
    post:
      tags: [Shared Cart]
      summary: Host checks out the shared cart (one invoice)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fulfillment_type: { type: string, enum: [delivery, pickup, dine_in] }
                address_id: { type: integer }
                address: { type: string }
                notes: { type: string }
                out_of_stock_policy: { type: string, enum: [substitute, remove, cancel], description: "The host's choice for the whole shared order — see the personal-cart checkout." }
      responses: { '200': { description: OK } }
  /cart/shared/{order}/invite:
    post:
      tags: [Shared Cart]
      summary: Invite a friend by phone or email (host only, already-registered accounts only)
      description: >-
        Never adds the friend as a participant directly — sends a
        notification (action_type=open_shared_cart_invite) carrying the join
        token; they still have to join, same as opening a shared link or
        scanning the cart's QR.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, description: Phone number or email of an existing account. }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /cart/shared/{order}/invite-group/{group}:
    post:
      tags: [Shared Cart]
      summary: Invite every member of one of the host's own contact groups at once (host only)
      description: >-
        Same notify-then-join semantics as inviting one friend — a member
        already in the cart, or the host themself if somehow a member of
        their own group, is skipped rather than failing the whole batch.
        Returns only the friends genuinely newly notified.
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
        - { name: group, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart/shared/{order}/leave:
    post:
      tags: [Shared Cart]
      summary: Leave a shared cart (participant)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }

  # ─────────────────────── Orders (Customer) ───────────────────────
  /orders:
    get:
      tags: [Orders (Customer)]
      summary: The customer's placed orders (carts excluded)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, completed, cancelled] } }
        - { name: fulfillment_type, in: query, schema: { type: string, enum: [delivery, pickup, dine_in] } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK } }
  /orders/{order}:
    get:
      tags: [Orders (Customer)]
      summary: Order detail (party-only)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/Order' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{order}/cancel:
    post:
      tags: [Orders (Customer)]
      summary: Cancel a pending order (only before the business accepts)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { description: Cancelled }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{order}/reorder:
    post:
      tags: [Orders (Customer)]
      summary: Order it again — re-add this order's lines to the cart
      description: >-
        Adds every line of a past order back into your cart at today's prices
        and availability (a review-then-checkout, not a blind re-charge). Only
        the customer who placed it may reorder. Returns how many lines were
        added, which offering ids were skipped (gone/retired), the business id,
        and the resulting cart order id.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses:
        '201': { description: 'Lines added to the cart; see data.added / data.skipped / data.cart_order_id.' }
        '404': { description: 'Not found, or not your order' }
  /orders/{order}/confirm-payment:
    post:
      tags: [Orders (Customer)]
      summary: Customer attests they paid the order in cash
      description: >-
        Protective evidence for a later dispute, not a gate on anything else:
        independent of the merchant's and driver's own confirm-payment calls
        (each party confirms only the cash leg they're party to). Once set it
        cannot be unset; a repeat call is a 409.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{order}/trust:
    post:
      tags: [Orders (Customer)]
      summary: Tick or untick "I trust" toward another party of the order
      description: >-
        The caller (must be a party of the order) trusts the customer, the
        business or the assigned driver. Merchant-to-customer also vouches
        through the trusted-partners waiver, which needs the customer to hold
        an active guarantee (422 otherwise); the other directions are recorded
        only. List/detail order responses carry `trust.<party>.trusted_by_me`
        and `trusts_me` on detail views.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party, trusted]
              properties:
                party: { type: string, enum: [customer, business, driver] }
                trusted: { type: boolean }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /bookings/{booking}/confirm-payment:
    post:
      tags: [Bookings]
      summary: Client confirms they paid the booking in cash
      description: >-
        Allowed once the booking is in progress or completed. Also counts as
        the client's agreement to release the frozen deposit (when one is
        frozen and no dispute is open), so the deposit releases once the
        business confirms too. Once set it cannot be unset (409).
      parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /business/bookings/{booking}/confirm-payment:
    post:
      tags: [Bookings]
      summary: Business confirms it received the booking's cash (owner or delegated staff)
      description: Same rules as the client's confirmation, for the business side.
      parameters: [{ name: booking, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /orders/{order}/delivery-fee/accept:
    post:
      tags: [Orders (Customer)]
      summary: Accept the courier's proposed delivery fee (out-of-city order)
      description: Adds the proposed fee to the invoice and lets the delivery loop start. 409 when there is no proposal waiting.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /orders/{order}/delivery-fee/decline:
    post:
      tags: [Orders (Customer)]
      summary: Decline the courier's proposed delivery fee
      description: Releases the courier; the order goes back to the pool for another courier to price and the available drivers are pinged again.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /orders/{order}/handover/issue:
    post:
      tags: [Order Handover]
      summary: Issue a one-time handover token for a ready order
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /handover/{token}/confirm:
    post:
      tags: [Order Handover]
      summary: Confirm handover by scanning the token (flips to completed)
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }

  # ─────────────────────── Orders (Business) ───────────────────────
  /business/working-hours:
    get:
      tags: [Business Hours]
      summary: My weekly opening hours + whether I'm open now (each day carries is_24h)
      responses: { '200': { description: OK } }
    put:
      tags: [Business Hours]
      summary: Replace my weekly opening hours
      description: >-
        Each day (0=Sunday…6=Saturday) is open with a window or explicitly
        closed. open/close are "HH:MM"; open > close means past midnight. Used
        by discovery's open_now filter so customers can reach shops open now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: array
                  minItems: 1
                  maxItems: 7
                  items:
                    type: object
                    required: [day]
                    properties:
                      day: { type: integer, minimum: 0, maximum: 6 }
                      is_closed: { type: boolean }
                      is_24h: { type: boolean, description: 'Open the whole day (stored as 00:00-23:59:59; sending open 00:00 and close 23:59 means the same)' }
                      open: { type: string, example: '09:00' }
                      close: { type: string, example: '22:00' }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /business/capabilities:
    get:
      tags: [Business Staff]
      summary: The one place — every manageable service a business can delegate
      description: >-
        The canonical capability registry (orders, menu, working_hours,
        projects, prescriptions, …). A business grants staff from this list.
      responses: { '200': { description: OK } }
  /business/staff:
    get:
      tags: [Business Staff]
      summary: My delegated staff (owner only)
      responses: { '200': { description: OK } }
    post:
      tags: [Business Staff]
      summary: Grant a staff member a set of capabilities (owner only)
      description: Identify the person by user_id or phone. Capabilities are validated against the registry. `is_physician` (boolean; clinic / hospital / medical-centre accounts only, 422 otherwise) marks the member a treating physician - his name is then recorded on the visits, prescriptions and investigation orders he handles, he publishes his own clinic slots (`physician_id`) and sees only his own appointments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilities]
              properties:
                user_id: { type: integer, description: 'user_id or phone is required' }
                phone: { type: string }
                title: { type: string, example: 'سكرتيرة' }
                capabilities:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [orders, menu, bookings, offers, retail, prices, working_hours, projects, prescriptions, schedules] }
                is_active: { type: boolean, default: true }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /business/staff/{user}:
    patch:
      tags: [Business Staff]
      summary: Update a staff member's grant (owner only)
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                capabilities: { type: array, items: { type: string } }
                is_active: { type: boolean }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Business Staff]
      summary: Revoke a staff member (owner only)
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /business/memberships:
    get:
      tags: [Business Staff]
      summary: The businesses I may manage as staff, with my capabilities
      description: >-
        For a delegate (who may be a plain client). When acting on a business
        surface as staff of several businesses, name the one via the
        `X-Business-Id` header (or a business_id field); with one it is inferred.
      responses: { '200': { description: OK } }
  /business/staff/attendance-qr:
    get:
      tags: [Business Staff]
      summary: The rotating code to show on the business's own attendance-display device
      description: >-
        Owner-only. Returns the same active code on every call until it is
        scanned or expires (StaffAttendanceQrService::TTL_MINUTES), so a
        display polling this every ~30s costs one request per business, not
        per employee.
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
  /business/staff/attendance-settings:
    get:
      tags: [Business Staff]
      summary: Whether GPS + QR attendance verification is currently on (owner-only)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Business Staff]
      summary: Turn GPS + QR attendance verification on or off (owner-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
  /business/projects:
    get:
      tags: [Projects]
      summary: My projects (project-management timeline), newest first
      description: >-
        A business's internal project timeline for manufacturing/construction —
        a furniture factory tracking a shipment through build stages, a
        contractor finishing residential units.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [planning, active, on_hold, completed, cancelled] } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK } }
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string }
                reference: { type: string, description: 'Shipment/unit/contract reference the business recognises' }
                status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
                visibility: { type: string, enum: [private, public], default: private, description: 'public exposes the coarse map + %s to any signed-in user; detailed access always needs the business''s approval' }
                starts_on: { type: string, format: date }
                due_on: { type: string, format: date }
                operation_type: { type: string, enum: [order, booking], description: 'Link the project to an operation you own so the customer can follow progress (send with operation_id)' }
                operation_id: { type: integer }
                template_id: { type: integer, description: 'Start from a ready stage plan (see GET /business/projects/templates): its stages are written into the project as a chain, each starting the day after the previous one ends and waiting for it. 422 for a plan not offered to this business.' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Validation' }
  /business/projects/templates:
    get:
      tags: [Projects]
      summary: The ready stage plans offered to my business
      description: >-
        `{templates:[{id, code, title, stages:[{title, duration_days, requires_approval}]}]}` — the plans of my trade (a car
        workshop gets bodywork → mechanics → electrical → paint; an engineering office gets survey → design → permits →
        supervision → handover…) plus the general ones. Pass an `id` as `template_id` when creating a project.
      responses: { '200': { description: OK } }
  /business/projects/my-stages:
    get:
      tags: [Projects]
      summary: The stages assigned to me at the acting business that still need work
      description: >-
        `{stages:[{id, project_id, project_title, title, status, progress, starts_on, ends_on, requires_photo, approval_status,
        approval_note}]}` — not done yet, or done and sent back by the customer. A staff member's day.
      responses: { '200': { description: OK } }
  /business/projects/{project}:
    get:
      tags: [Projects]
      summary: Project detail + computed timeline
      description: >-
        Returns the project plus the timeline — each task's earliest
        start/finish (day offsets and, when a start date is set, real dates),
        slack, whether it is on the critical path, and whether it is overdue.
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Projects]
      summary: Update a project
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                reference: { type: string }
                status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
                starts_on: { type: string, format: date }
                due_on: { type: string, format: date }
                operation_type: { type: string, enum: [order, booking], nullable: true, description: 'Send an empty value to unlink' }
                operation_id: { type: integer, nullable: true }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Projects]
      summary: Update a project (alias of PUT)
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Projects]
      summary: Delete a project and its tasks
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/projects/{project}/tasks:
    post:
      tags: [Projects]
      summary: Add a task (timeline bar) to a project
      description: >-
        depends_on lists the finish-to-start predecessors (must be tasks in the
        same project; a cycle is refused). requires_photo (default true) gates
        the stage's completion on camera evidence.
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                notes: { type: string }
                parent_id: { type: integer, nullable: true }
                status: { type: string, enum: [pending, in_progress, blocked, done] }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                progress: { type: integer, minimum: 0, maximum: 100 }
                requires_photo: { type: boolean, default: true }
                sort_order: { type: integer }
                depends_on: { type: array, items: { type: integer } }
      responses:
        '201': { description: Created }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /business/projects/{project}/tasks/{task}:
    put:
      tags: [Projects]
      summary: Update a task
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: task, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
    patch:
      tags: [Projects]
      summary: Update a task (alias of PUT)
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: task, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Projects]
      summary: Delete a task
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: task, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/projects/{project}/tasks/{task}/progress:
    patch:
      tags: [Projects]
      summary: Advance a task's progress/status
      description: >-
        A stage with requires_photo=true cannot be set to done (or 100%) until
        it carries at least one camera-captured photo — a 422 otherwise.
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: task, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                progress: { type: integer, minimum: 0, maximum: 100 }
                status: { type: string, enum: [pending, in_progress, blocked, done] }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/projects/{project}/tasks/{task}/photo:
    post:
      tags: [Projects]
      summary: Attach a camera-captured progress photo (evidence)
      description: >-
        Evidence must be captured live by the camera — source must be `camera`
        or the request is refused (422). The mobile app only offers the live
        camera for this surface; the recorded source flag distinguishes it from
        an uploaded/gallery image.
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: task, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, source]
              properties:
                photo: { type: string, format: binary }
                source: { type: string, enum: [camera, upload] }
      responses:
        '201': { description: Created }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /business/projects/{project}/tasks/{task}/assignee:
    put:
      tags: [Projects]
      summary: Hand a stage to one of the business's providers (or release it with null)
      description: >-
        Goes through the assignment core: the person is told once, and sees the stage in `GET /business/projects/my-stages`.
        422 for someone who is not a provider here; 403 for a staff member who is himself a provider (he cannot hand work
        around). Every task payload and the timeline carry `assignee {id, name, title}`, `requires_approval`,
        `approval_status` (null | pending | approved | rejected) and `approval_note`.
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: task, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { assignee_id: { type: integer, nullable: true } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /business/projects/{project}/generate:
    post: { tags: [Projects], summary: "Write the whole plan of a residential building into an EMPTY project: body `{kind: building, floors (counts the ground floor), basement?, apartments_per_floor, elevator? (default true: adds the lift shaft, its installation and its fitting), starts_on?}`. Six main stages (foundations, concrete frame, masonry, installations, finishing, handover) and, inside them, a work for every level and every flat with its place in `zone` («الدور الثالث / شقة ٢»), its weight and its quantity lines (columns, concrete, bricks, areas — planned 0 for the engineer to fill). The frame and masonry go level by level, installations and finishing flat by flat; every main stage waits for the one before. 422 when the project already has stages.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/tasks/{task}/items:
    post: { tags: [Projects], summary: "Add a measurable quantity to a work (`{name, unit?, planned, notes?, reason?}`). Before the plan is agreed it is added and logged; AFTER the agreement it is a scope change: 202 with `data.pending_request` and nothing changes until the customer approves. A work with items measures its own progress by them (mean of done ÷ planned; 99% until its camera photo exists when it needs one).", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: task, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '202': { description: 'Waiting for the customer (scope change)' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/tasks/{task}/items/{item}:
    patch: { tags: [Projects], summary: "Change a quantity: `done`, `name`, `unit`, `notes` apply at once (and are logged); a different `planned` after the agreement is a scope change (202 + `pending_request`). Reporting `done` on an agreed project needs the customer's approval of the START of its main stage. Optional `reason` is written to the log.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: task, in: path, required: true, schema: { type: integer } }, { name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '202': { description: 'Waiting for the customer (scope change)' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Projects], summary: "Remove a quantity (a scope change after the agreement: 202).", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: task, in: path, required: true, schema: { type: integer } }, { name: item, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '202': { description: 'Waiting for the customer' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/quantity-log:
    get: { tags: [Projects], summary: "Every change of a quantity, newest first: `{task_id, task, item_id, field (created|name|unit|planned|done|deleted), old, new, reason, via_request, by, at}`. The customer reads the same list in `GET /operations/{type}/{id}/project` as `quantity_log`.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/agreement:
    get: { tags: [Projects], summary: "The version in force (or the one waiting), every version, and the change requests with their answers: `{agreement, agreed, versions[], change_requests[]}`.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    post: { tags: [Projects], summary: "Offer the plan to the customer: body `{starts_on, due_on, grace_days, required_guarantee?}` — execution STARTS on a future date (the time until then is the negotiation; the plan's dates are moved to it), is delivered by `due_on` with a grace after it, and `required_guarantee` (a level code such as `silver`) makes the customer hold a guarantee of at least that level before he can agree and before each stage start he approves. The project must be linked to a customer's order / booking and have stages. The version freezes the stages, places, quantities, the dates and a hash; the customer agrees or declines. Only before a plan is agreed — afterwards use extension / scope requests.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/extension-requests:
    post: { tags: [Projects], summary: "Ask for more time: body `{extra_days, reason}`. The customer's approval writes a new agreement version with the later end of grace; nothing moves before he answers. One pending request at a time.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/tasks/{task}/request-start:
    post: { tags: [Projects], summary: "Ask the customer to approve the START of a main (top-level) stage of an agreed project. Refused while a stage it depends on is not done. Nothing on the stage may move before he approves; his approval charges `project_stage_started` to both sides.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: task, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/shift:
    post: { tags: [Projects], summary: "Postpone the plan or one stage: body `{scope: plan|stage, task_id? (for stage), days? (1–365: 7 = a week, 30 = a month) | new_start?, reason?}`. Only work that has not started moves; a stage move takes its works and everything that starts on or after it; the delivery date and grace move by the same days. Before the agreement it applies at once (200); after it it is a request (201) the customer approves, and the approval writes a new agreement version.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Applied }, '201': { description: 'Request sent' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/showcase:
    get: { tags: [Projects], summary: "The state of this project's «نتائج موثَّقة» request (null when never asked).", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    post: { tags: [Projects], summary: "Ask the customer to let the project be shown as a post: body `{public_title, note?, show_photos?}`. Optional `consent_mode`: `once` (default, one approval covers every stage) or `each` (he approves each finished main stage). Needs an AGREED plan and a linked customer (422 otherwise); nothing is published before he approves; on approve he may send `consent_mode: each` to make it stricter.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Projects], summary: "The business takes the post down (or cancels the request); the post is switched off.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/change-requests/{changeRequest}/approve:
    post: { tags: [Projects], summary: "The business approves a postponement the CUSTOMER asked for (a request is always answered by the other side; the asker gets 422).", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: changeRequest, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/change-requests/{changeRequest}/reject:
    post: { tags: [Projects], summary: "The business declines a postponement the customer asked for; body `{note}` optional.", parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: changeRequest, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/projects/{project}/followers:
    get:
      tags: [Projects]
      summary: Who follows this project (requests + granted followers)
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/projects/{project}/followers/{user}:
    patch:
      tags: [Projects]
      summary: Approve/reject a follow request (or invite a user directly)
      description: >-
        approve=true grants access at access_level (summary = coarse map + %s;
        detailed = full stages + camera evidence). approve=false rejects. If the
        user never requested, the grant is created — so the business can invite a
        specific person to follow a private project.
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                access_level: { type: string, enum: [summary, detailed] }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
    delete:
      tags: [Projects]
      summary: Revoke a follower's access
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/delivery-drivers:
    get:
      tags: [Delivery]
      summary: The business's own private driver roster, plus nearby freelance drivers when located
      parameters:
        - { name: radius_km, in: query, schema: { type: number, default: 5 } }
      responses: { '200': { description: OK } }
  /business/delivery-drivers/{driver}:
    patch:
      tags: [Delivery]
      summary: Take one of the business's own drivers off duty / back on (never a hard delete)
      parameters: [{ name: driver, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [is_active], properties: { is_active: { type: boolean } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/delivery-settings:
    get:
      tags: [Delivery]
      summary: The business's own flat delivery fee, applied automatically at checkout
      responses: { '200': { description: OK } }
    patch:
      tags: [Delivery]
      summary: Set the business's own flat delivery fee (null clears it)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { delivery_fee_amount: { type: number, nullable: true } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }
  /business/orders:
    get:
      tags: [Orders (Business)]
      summary: The business's incoming-order queue
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, completed, cancelled] } }
        - { name: fulfillment_type, in: query, schema: { type: string, enum: [delivery, pickup, dine_in] } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK } }
  /business/orders/{order}:
    get:
      tags: [Orders (Business)]
      summary: Business order detail
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
  /business/orders/{order}/accept:
    post:
      tags: [Orders (Business)]
      summary: Accept a pending order (settles BIM's service fee from the business wallet)
      description: prep_status → accepted. Blocks with 422 if the business wallet can't cover the platform service fee.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Accepted }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation', description: 'Insufficient business wallet balance for the fee.' }
  /business/orders/{order}/preparing:
    post:
      tags: [Orders (Business)]
      summary: Mark preparing (becomes visible to delivery drivers)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } }
  /business/orders/{order}/ready:
    post:
      tags: [Orders (Business)]
      summary: Mark ready
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } }
  /business/orders/{order}/reject:
    post:
      tags: [Orders (Business)]
      summary: Reject a pending order (only before acceptance)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Conflict' } }
  /business/orders/{order}/installments/{seq}/collect:
    post:
      tags: [Orders (Business)]
      summary: Record an instalment payment the business received (or take it back)
      description: >-
        Marks one monthly payment of an order bought on instalments as collected
        (paid=true, the default) or not (paid=false). The customer's agenda item
        for that payment is done when collected. Returns the order's schedule.
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
        - { name: seq, in: path, required: true, schema: { type: integer } }
      requestBody: { content: { application/json: { schema: { type: object, properties: { paid: { type: boolean } } } } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/orders/{order}/confirm-payment:
    post:
      tags: [Orders (Business)]
      summary: Merchant confirms they received the order amount in cash
      description: >-
        The order amount only — excludes delivery_fee, which whoever
        actually collects it confirms separately (see
        /delivery/orders/{order}/confirm-payment, since that could be this
        same business's own driver or an unrelated freelancer).
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }
  /business/orders/{order}/trust:
    post:
      tags: [Orders (Business)]
      summary: Tick or untick "I trust" toward another party of the order
      description: >-
        The caller (must be a party of the order) trusts the customer, the
        business or the assigned driver. Merchant-to-customer also vouches
        through the trusted-partners waiver, which needs the customer to hold
        an active guarantee (422 otherwise); the other directions are recorded
        only. List/detail order responses carry `trust.<party>.trusted_by_me`
        and `trusts_me` on detail views.
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party, trusted]
              properties:
                party: { type: string, enum: [customer, business, driver] }
                trusted: { type: boolean }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /business/orders/{order}/pickup-token:
    post:
      tags: [Orders (Business)]
      summary: Issue the stage-1 pickup QR token (owner or delegated staff)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
  /business/orders/{order}/pickup-token/reset:
    post:
      tags: [Orders (Business)]
      summary: Reset the pickup code (owner or delegated staff) - the previous code stops working
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/orders/{order}/delivery-fee/recommendation:
    post:
      tags: [Orders (Business)]
      summary: Recommend the courier's proposed delivery fee to the customer (suitable / not suitable)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommendation]
              properties:
                recommendation: { type: string, enum: [suitable, not_suitable] }
                note: { type: string, maxLength: 500 }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /business/orders/{order}/shipping-companies:
    get:
      tags: [Orders (Business)]
      summary: Shipping companies that ship this order's governorate, with their price
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /business/orders/{order}/shipping-company:
    post:
      tags: [Orders (Business)]
      summary: Pick the shipping company; its price is added to the invoice
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /business/shipping/rates:
    get:
      tags: [Shipping]
      summary: A shipping company's price to every other governorate
      responses: { '200': { description: OK } }
    put:
      tags: [Shipping]
      summary: Replace the company's price list (Shipping & Delivery accounts only)
      responses: { '200': { description: OK } }
  /business/shipping/orders:
    get:
      tags: [Shipping]
      summary: The shipping company's orders
      responses: { '200': { description: OK } }
  /business/shipping/orders/{order}/appointment:
    post:
      tags: [Shipping]
      summary: Set or change the shipping appointment (appointment_at, note)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /business/shipping/orders/{order}/shipped:
    post:
      tags: [Shipping]
      summary: Mark the order shipped
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /business/shipping/orders/{order}/delivered:
    post:
      tags: [Shipping]
      summary: Mark the order delivered (completes it)
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /orders/{order}/shipping/appointment-ok:
    post:
      tags: [Shipping]
      summary: The customer confirms the scheduled shipping appointment suits them
      parameters: [{ name: order, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK } }
  /business/orders/{order}/items/{item}/unavailable:
    post:
      tags: [Orders (Business)]
      summary: A line turned out unavailable while preparing — apply the customer's out_of_stock_policy
      description: >-
        Reads what the customer chose at checkout (Order.out_of_stock_policy)
        and applies it — never guesses. substitute keeps the line at its
        original price and requires `note` (what it became); remove drops the
        line from the total; cancel cancels the whole order, the one
        deliberate exception to "no cancelling after acceptance". A `422`
        with a `policy` error means the order carries no stated policy
        (placed before this existed) — resolve it with the customer directly
        via the order chat instead.
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: Required when the order's policy is "substitute" — what the item became. }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  # ─────────────────────── Business Menu ───────────────────────
  /business/menu/sections:
    get: { tags: [Business Menu], summary: List sections, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post:
      tags: [Business Menu]
      summary: Create a section
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name_ar], properties: { name_ar: { type: string }, name_en: { type: string }, sort_order: { type: integer }, is_active: { type: boolean } } }
      responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' } }
  /business/menu/sections/{section}:
    parameters: [{ name: section, in: path, required: true, schema: { type: integer } }]
    patch: { tags: [Business Menu], summary: Update a section, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    delete: { tags: [Business Menu], summary: Delete a section, responses: { '200': { description: OK } } }
  /business/menu/items:
    get:
      tags: [Business Menu]
      summary: List items
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: menu_section_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Business Menu]
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_ar, base_price]
              properties:
                name_ar: { type: string }
                name_en: { type: string }
                menu_section_id: { type: integer, description: Must belong to this business. }
                description_ar: { type: string }
                description_en: { type: string }
                base_price: { type: number, minimum: 0 }
                sort_order: { type: integer }
                is_active: { type: boolean }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } }
  /business/menu/items/{item}:
    parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Menu], summary: Item detail (with variants + extras), responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { tags: [Business Menu], summary: Update an item, responses: { '200': { description: OK } } }
    delete: { tags: [Business Menu], summary: Delete an item, responses: { '200': { description: OK } } }
  /business/menu/items/{item}/images:
    post: { tags: [Business Menu], summary: "Upload photos for one menu item (multipart images[], max 10 per item, jpg/png/webp/gif, 8MB each). A GALLERY, not a single photo — menu_items.image was one column no screen ever wrote. APPENDS; to replace, delete what you do not want. Paths come back RELATIVE (files/uploads/...). Deleting the item deletes every photo's row AND file.", parameters: [{ name: item, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Created }, '422': { description: 'Not an image, or the 10-photo cap is reached' } } }
  /business/menu/items/{item}/images/{image}:
    delete: { tags: [Business Menu], summary: 'Delete one photo from a menu item. Removes the FILE as well as the row — an orphaned upload can never be found again to remove.', parameters: [{ name: item, in: path, required: true, schema: { type: integer } }, { name: image, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { description: 'Not this business item, or no such photo' } } }
  /business/menu/items/{item}/variants:
    post:
      tags: [Business Menu]
      summary: Add a variant (setting is_default clears the others)
      parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name_ar]
              properties:
                type: { type: string }
                name_ar: { type: string }
                name_en: { type: string }
                price: { type: number }
                price_delta: { type: number }
                is_default: { type: boolean }
                is_active: { type: boolean }
      responses: { '201': { description: Created } }
  /business/menu/items/{item}/variants/{variant}:
    parameters:
      - { name: item, in: path, required: true, schema: { type: integer } }
      - { name: variant, in: path, required: true, schema: { type: integer } }
    patch: { tags: [Business Menu], summary: Update a variant, responses: { '200': { description: OK } } }
    delete: { tags: [Business Menu], summary: Delete a variant, responses: { '200': { description: OK } } }
  /business/menu/items/{item}/extra-groups:
    post:
      tags: [Business Menu]
      summary: Add an extra group — decides whether its extras are picked one at a time (single, radio) or any number (multiple, checkbox)
      parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_ar, selection_type]
              properties:
                name_ar: { type: string, maxLength: 100 }
                name_en: { type: string, maxLength: 100 }
                selection_type: { type: string, enum: [single, multiple], description: 'single renders as radio buttons, multiple as checkboxes.' }
                reorder: { type: integer, minimum: 0 }
                is_active: { type: boolean }
      responses: { '201': { description: Created } }
  /business/menu/items/{item}/extra-groups/{group}:
    parameters:
      - { name: item, in: path, required: true, schema: { type: integer } }
      - { name: group, in: path, required: true, schema: { type: integer } }
    patch: { tags: [Business Menu], summary: Update an extra group, responses: { '200': { description: OK } } }
    delete: { tags: [Business Menu], summary: "Delete an extra group — its extras become standalone (extra_group_id is nulled), not deleted", responses: { '200': { description: OK } } }
  /business/menu/items/{item}/extras:
    post:
      tags: [Business Menu]
      summary: Add an extra
      parameters: [{ name: item, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_ar, price]
              properties:
                extra_group_id: { type: integer, nullable: true }
                name_ar: { type: string }
                name_en: { type: string }
                price: { type: number, minimum: 0 }
                max_qty: { type: integer, minimum: 1, maximum: 99 }
                is_active: { type: boolean }
      responses: { '201': { description: Created } }
  /business/menu/items/{item}/extras/{extra}:
    parameters:
      - { name: item, in: path, required: true, schema: { type: integer } }
      - { name: extra, in: path, required: true, schema: { type: integer } }
    patch: { tags: [Business Menu], summary: Update an extra, responses: { '200': { description: OK } } }
    delete: { tags: [Business Menu], summary: Delete an extra, responses: { '200': { description: OK } } }
  /business/menu/market-catalog:
    get: { tags: [Business Menu], summary: "«تعبئة الرفوف» bulk shelf pricing (menu_market children only) — every sellable row pre-named from the platform's option vocabulary, grouped into the same sections a customer sees.", responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post:
      tags: [Business Menu]
      summary: Batch-save one or more rows (typically one section's worth). A blank base_price deactivates that row instead of deleting it; an option outside this merchant's own vocabulary is silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: object
                  description: 'Keyed by option id, e.g. {"123": {quantity, supply_price, base_price, sale_unit, brand_name}}.'
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
  /business/menu/market-catalog/low-stock-threshold:
    put:
      tags: [Business Menu]
      summary: Set the quantity at or below which a low-stock alert is sent to the business itself (never the customer). Null/omitted reverts to alerting only once an item is fully at zero.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                low_stock_threshold: { type: integer, minimum: 0, nullable: true }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
  /business/menu/bundles:
    get:
      tags: [Business Menu]
      summary: List the business's own bundles ("وجبة العيلة") — fixed-composition combos of its own menu items, each with its computed price
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Business Menu]
      summary: Create a bundle. Composition is edited as a whole list, not incrementally — items always replaces the full set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_ar, pricing_mode, items]
              properties:
                name_ar: { type: string }
                name_en: { type: string }
                pricing_mode: { type: string, enum: [fixed, discount_percent, discount_fixed], description: 'fixed = a flat price for the whole bundle. discount_percent/discount_fixed = the live sum of the components'' own current prices, minus a percentage or flat discount.' }
                fixed_price: { type: number, minimum: 0, description: Required when pricing_mode=fixed. }
                discount_value: { type: number, minimum: 0, maximum: 100, description: 'Required when pricing_mode is a discount mode. Percent (0-100) for discount_percent, a flat amount for discount_fixed.' }
                is_active: { type: boolean }
                sort_order: { type: integer }
                items:
                  type: array
                  minItems: 2
                  description: At least 2 components — one item under its own name is not a bundle.
                  items:
                    type: object
                    required: [menu_item_id]
                    properties:
                      menu_item_id: { type: integer, description: Must belong to this business. }
                      qty: { type: integer, minimum: 1, maximum: 99 }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/Validation' } }
  /business/menu/bundles/{bundle}:
    parameters: [{ name: bundle, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Menu], summary: Bundle detail, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { tags: [Business Menu], summary: Update a bundle (same body as create; items replaces the whole composition), responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Business Menu], summary: Delete a bundle, responses: { '200': { description: OK } } }

  # ─────────────────────── Business Prices ───────────────────────
  /business/prices:
    get:
      tags: [Business Prices]
      summary: The business's price rows
      parameters:
        - { name: service_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Business Prices]
      summary: Create a price for one (service, item type)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, bookable_item_type, price]
              properties:
                service_id: { type: integer, description: Must be a service the owner offers. }
                bookable_item_type: { type: string, description: Must be an item type the owner's subcategory offers. }
                price: { type: number, minimum: 0 }
                charge_mode: { type: string, enum: [standard, free, reservation_fee, minimum_charge] }
                charge_amount: { type: number, minimum: 0, description: Only used by reservation_fee / minimum_charge. }
                currency: { type: string }
                is_active: { type: boolean }
                discount_enabled: { type: boolean }
                discount_percent: { type: integer, minimum: 0, maximum: 100 }
      responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } }
  /business/prices/options:
    get: { tags: [Business Prices], summary: Services + allowed item types + charge modes for the create form, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /business/prices/{price}:
    parameters: [{ name: price, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Business Prices], summary: Price detail, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Business Prices], summary: Update a price, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } } }
    patch: { tags: [Business Prices], summary: Update a price, responses: { '200': { description: OK } } }
    delete: { tags: [Business Prices], summary: Delete a price, responses: { '200': { description: OK } } }
  /business/clinic-prices:
    get:
      tags: [Business Prices]
      summary: A doctor's own clinic account only — every visit kind it may price, each with its current price/duration if already set
      description: A one-call convenience over the same BusinessServicePrice rows business/prices manages, skipping the service_id/bookable_item_type discovery step and the general line/modifier shape a clinic never uses.
      responses: { '200': { description: OK }, '422': { description: 'Not a clinic account, or the service is unavailable' } }
    patch:
      tags: [Business Prices]
      summary: Set (or update) several visit-kind fees in one call
      description: An unset kind is left untouched — this never clears a fee the doctor didn't mention. Every key must be one GET already lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: object
                  additionalProperties:
                    type: object
                    required: [price]
                    properties:
                      price: { type: number, minimum: 0 }
                      duration_minutes: { type: integer, minimum: 5, maximum: 480 }
                      is_active: { type: boolean }
                  example: { booking_examination: { price: 100, duration_minutes: 20 } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }
    put:
      tags: [Business Prices]
      summary: Same as PATCH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices: { type: object }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Validation' } }

  # ─────────────────────── Business Bookables ───────────────────────
  /business/bookable-items:
    get:
      tags: [Business Bookables]
      summary: The business's bookable units
      parameters:
        - { name: service_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
