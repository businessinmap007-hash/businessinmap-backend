  /business/schedules/parcels:
    get: { tags: [Schedules], summary: "The carrier's parcels (?status=). Never carries the delivery code.", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
  /business/schedules/parcels/{parcel}/price:
    post: { tags: [Schedules], summary: "The driver sets the parcel's price, how many seats it takes (0 = rides in the boot) and an approximate expected_arrival_at (the actual hour is recorded at delivery). Body: price, seats, expected_arrival_at.", parameters: [{ name: parcel, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Validation' } } }
